<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0c" />
<title>GO LIVE</title>
<style>
  :root {
    --bg: #0a0a0c;
    --panel: #121218;
    --line: #2a2a35;
    --ink: #f2f2f5;
    --muted: #8b8b9a;
    --red: #ff3b4a;
    --pink: #ff5c8a;
    --green: #3dff9a;
    --amber: #ffc14a;
    --blue: #5b9dff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    overflow: hidden;
  }
  #app { height: 100%; width: 100%; position: relative; }

  /* ===== PRE-LIVE ===== */
  .prelive {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    gap: 18px;
    text-align: center;
  }
  .logo {
    font-size: 13px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .title {
    font-size: clamp(36px, 10vw, 56px);
    font-weight: 800;
    line-height: 1;
  }
  .title span { color: var(--red); }
  .subtitle {
    color: var(--muted);
    font-size: 15px;
    max-width: 320px;
    line-height: 1.45;
  }
  .go-live {
    margin-top: 12px;
    width: min(320px, 100%);
    padding: 18px 24px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #ff2d55, #ff5c8a);
    color: #fff;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: .06em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 12px 40px rgba(255, 45, 85, .35);
  }
  .go-live:active { transform: scale(.97); }
  .hint {
    font-size: 12px;
    color: var(--muted);
    max-width: 300px;
  }
  .err {
    color: var(--red);
    font-size: 13px;
    max-width: 320px;
  }

  /* ===== LIVE STAGE ===== */
  .live {
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
    background: #000;
  }
  .video-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    background: #000;
    overflow: hidden;
  }
  #cam {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    background: #111;
  }
  .cam-fallback {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    padding: 20px;
  }

  /* Top bar */
  .topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: max(12px, env(safe-area-inset-top)) 12px 12px;
    background: linear-gradient(to bottom, rgba(0,0,0,.65), transparent);
    pointer-events: none;
  }
  .topbar > * { pointer-events: auto; }
  .live-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 999px;
    padding: 6px 12px 6px 8px;
    backdrop-filter: blur(8px);
  }
  .live-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 0 0 rgba(255,59,74,.7);
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,59,74,.6); }
    70% { box-shadow: 0 0 0 10px rgba(255,59,74,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,59,74,0); }
  }
  .live-label {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .14em;
  }
  .viewers {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
  }
  .viewers span { color: var(--muted); font-weight: 500; margin-right: 4px; }
  .end-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(0,0,0,.55);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
  }

  /* Floating reactions */
  .floats {
    position: absolute;
    right: 10px;
    bottom: 38%;
    width: 60px;
    height: 40%;
    pointer-events: none;
    z-index: 15;
    overflow: hidden;
  }
  .float-emoji {
    position: absolute;
    bottom: 0;
    left: 50%;
    font-size: 22px;
    animation: floatUp 2.2s ease-out forwards;
    opacity: 0;
  }
  @keyframes floatUp {
    0% { transform: translate(-50%, 0) scale(.6); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), -180px) scale(1.15); opacity: 0; }
  }

  /* Chat */
  .chat-wrap {
    position: relative;
    height: min(38vh, 320px);
    background: linear-gradient(to top, rgba(0,0,0,.92) 70%, rgba(0,0,0,.55));
    display: flex;
    flex-direction: column;
    z-index: 10;
  }
  .chat-list {
    flex: 1;
    overflow: hidden;
    padding: 10px 12px 6px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 4px;
    mask-image: linear-gradient(to bottom, transparent, #000 18%);
  }
  .chat-line {
    font-size: 13px;
    line-height: 1.3;
    word-break: break-word;
    animation: chatIn .18s ease-out;
  }
  @keyframes chatIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  .chat-user {
    font-weight: 700;
    margin-right: 6px;
  }
  .chat-text { color: #ececf2; }
  .chat-input-row {
    display: flex;
    gap: 8px;
    padding: 8px 12px max(10px, env(safe-area-inset-bottom));
  }
  .chat-input {
    flex: 1;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.06);
    color: #fff;
    border-radius: 999px;
    padding: 10px 14px;
    font-size: 14px;
    outline: none;
  }
  .chat-send {
    border: none;
    border-radius: 999px;
    padding: 0 16px;
    background: var(--pink);
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }
  .mic-status {
    position: absolute;
    top: -28px;
    left: 12px;
    font-size: 11px;
    color: var(--muted);
    background: rgba(0,0,0,.5);
    padding: 3px 8px;
    border-radius: 6px;
  }
  .mic-status.on { color: var(--green); }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  const NAMES = [
    'nova_x','kaiplayz','shadowfox','luna99','pixeljay','momo_ttv','dreww','skye_','rileyqt',
    'jaxn','emberly','frostbyte','vibeonly','chillax','prodigy7','nightowl','sunnyyy','blobfish',
    'mapleleaf','orbitkid','zenmode','hexagon','coralreef','neonbat','quietstorm','loudpack',
    'tea_time','snackr','gamerbee','softlock','hardcarry','npc_energy','mainchar','sidequest',
    'ping200','lowlatency','frameperfect','clutchor','ezclap','pogchamp','kekw','omegalul',
    'user'+Math.floor(Math.random()*9999),'xx'+Math.floor(Math.random()*99),'the_'+Math.floor(Math.random()*500)
  ];
  const COLORS = ['#ff6b9d','#5b9dff','#3dff9a','#ffc14a','#c084fc','#67e8f9','#fb7185','#a3e635','#f472b6','#38bdf8'];

  const CHAT_POOL = [
    'yo','hey','hi','hello','first','early','lets go','LFG','W','WW','WWW','W stream',
    'hi chat','whats good','good morning','good night','im here','joined late','who is this',
    'quality is good','cam looks clean','audio check','can you hear us','say hi if you can hear',
    'this is fire','mid','not bad','actually good','respect','no way','bruh','lol','lmao',
    'spam W','W in chat','F in chat','ratio','based','real','facts','ong','fr fr','no cap',
    'follow','followed','sub?','when raid','host is cooking','dont end','one more hour',
    'where you from','love from eu','na gang','asia hello','phone stream?','pc?',
    'music in bg?','turn up mic','lighting good','angle fire','fit check','drip',
    'tell a joke','story time','rant incoming','drama?','tea','spill',
    'bot lobby?','real people?','chat moving crazy','chat dead','chat exploding',
    'slow mode when','mods?','ban the spammer','keep it chill','be nice',
    'hi from work','on the bus','school wifi','parents home quiet','brb snack',
    'this algorithm cooked','fyp brought me','random recommend','glad i clicked',
    'you free later','schedule?','post the vod','clip that','someone clip',
    'gg','wp','ez','not ez','skill','aura','sigma','rizz','unc status',
    '❤️','🔥','😂','😭','💀','👏','🙌','👀','✨','💯','🚀','👑'
  ];

  const SPAM_PACKS = {
    w: ['W','W','W','WW','WWW','W stream','W chat','big W','W in the chat','W'],
    l: ['L','L','L','LL','L stream','L + ratio','massive L'],
    f: ['F','F','F','F in chat','press F','F'],
    fire: ['🔥','🔥🔥','🔥','fire','this is fire','heat'],
    heart: ['❤️','❤️','💕','❤️❤️','love'],
    lol: ['lol','lmao','😂','😭','💀','hahaha','im dead'],
    hi: ['hi','hey','hello','yo','hihi','hey chat'],
    pog: ['POG','POGGERS','lets go','LFG','GOATED'],
  };

  // Voice trigger keywords → spam pack + intensity (0-1 fraction of bots react)
  const VOICE_TRIGGERS = [
    { re: /\b(chat|say w|spam w|type w|w in chat)\b/i, pack: 'w', intensity: 0.72 },
    { re: /\b(say l|spam l|l in chat)\b/i, pack: 'l', intensity: 0.55 },
    { re: /\b(f in chat|press f|say f)\b/i, pack: 'f', intensity: 0.6 },
    { re: /\b(fire|this is fire|heat)\b/i, pack: 'fire', intensity: 0.5 },
    { re: /\b(i love you|love you|hearts|send hearts)\b/i, pack: 'heart', intensity: 0.65 },
    { re: /\b(laugh|funny|joke|lol)\b/i, pack: 'lol', intensity: 0.45 },
    { re: /\b(say hi|hello chat|hi chat|wave)\b/i, pack: 'hi', intensity: 0.7 },
    { re: /\b(lets go|let's go|pog|hype)\b/i, pack: 'pog', intensity: 0.55 },
  ];

  const state = {
    screen: 'pre', // pre | live
    stream: null,
    viewers: 0,
    error: null,
    listening: false,
    lastVoice: '',
    chatBurstUntil: 0,
    demo: false,
  };

  let chatTimer = null;
  let viewerTimer = null;
  let recognition = null;
  const chatLines = []; // {id, user, color, text, t}

  function randName() {
    if (Math.random() < 0.55) return NAMES[Math.floor(Math.random() * NAMES.length)];
    const a = ['cool','dark','lit','pro','noob','fast','silent','lucky','wild','soft'];
    const b = ['wolf','cat','fox','kid','god','bot','xd','ttv','yt','hq'];
    return a[Math.floor(Math.random()*a.length)] + b[Math.floor(Math.random()*b.length)] + Math.floor(Math.random()*90);
  }
  function randColor() { return COLORS[Math.floor(Math.random() * COLORS.length)]; }
  function randChat() { return CHAT_POOL[Math.floor(Math.random() * CHAT_POOL.length)]; }

  function formatViewers(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 10000) return Math.round(n / 100) * 100 >= 1000 ? (Math.round(n / 100) / 10).toFixed(1).replace(/\.0$/, '') + 'K' : String(n);
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
    return String(Math.max(0, Math.floor(n)));
  }

  function pushChat(user, text, color) {
    chatLines.push({
      id: Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      user: user || randName(),
      color: color || randColor(),
      text: text,
      t: Date.now()
    });
    // Keep DOM light — only last ~80 visible lines
    while (chatLines.length > 80) chatLines.shift();
    paintChat();
  }

  function paintChat() {
    const list = document.getElementById('chatList');
    if (!list) return;
    // Only re-render last lines for performance
    const slice = chatLines.slice(-40);
    list.innerHTML = slice.map(c =>
      `<div class="chat-line"><span class="chat-user" style="color:${c.color}">${escapeHtml(c.user)}</span><span class="chat-text">${escapeHtml(c.text)}</span></div>`
    ).join('');
    list.scrollTop = list.scrollHeight;
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function spawnFloat(emoji) {
    const root = document.getElementById('floats');
    if (!root) return;
    const el = document.createElement('div');
    el.className = 'float-emoji';
    el.textContent = emoji;
    el.style.setProperty('--dx', (Math.random() * 40 - 20) + 'px');
    el.style.left = (30 + Math.random() * 40) + '%';
    root.appendChild(el);
    setTimeout(() => el.remove(), 2300);
  }

  function spamReaction(packKey, intensity) {
    const pack = SPAM_PACKS[packKey] || SPAM_PACKS.w;
    // Burst: many comments over ~1.2s
    const count = Math.floor(18 + intensity * 55 + Math.random() * 25);
    state.chatBurstUntil = Date.now() + 1400;
    for (let i = 0; i < count; i++) {
      const delay = Math.random() * 1100;
      setTimeout(() => {
        const msg = pack[Math.floor(Math.random() * pack.length)];
        pushChat(randName(), msg, randColor());
        if (/[🔥❤️💕😂😭💀👏]/.test(msg) || Math.random() < 0.25) {
          spawnFloat(msg.match(/[🔥❤️💕😂😭💀👏🙌👀✨💯🚀👑]/)?.[0] || '❤️');
        }
      }, delay);
    }
    // Viewer spike
    state.viewers += Math.floor(80 + intensity * 400 + Math.random() * 300);
    updateViewerLabel();
  }

  function startChatEngine() {
    stopChatEngine();
    // Baseline flood: scales with viewer count
    chatTimer = setInterval(() => {
      if (state.screen !== 'live') return;
      const burst = Date.now() < state.chatBurstUntil;
      const v = state.viewers;
      // How many messages this tick
      let n = 1;
      if (v > 5000) n = 2 + Math.floor(Math.random() * 3);
      if (v > 15000) n = 3 + Math.floor(Math.random() * 4);
      if (v > 40000) n = 5 + Math.floor(Math.random() * 6);
      if (burst) n += 4 + Math.floor(Math.random() * 8);

      for (let i = 0; i < n; i++) {
        setTimeout(() => {
          if (state.screen !== 'live') return;
          pushChat(randName(), randChat(), randColor());
        }, Math.random() * 280);
      }
    }, 180);
  }

  function stopChatEngine() {
    if (chatTimer) { clearInterval(chatTimer); chatTimer = null; }
  }

  function startViewerEngine() {
    stopViewerEngine();
    // Start between 5k–55k
    const band = Math.random();
    if (band < 0.25) state.viewers = 5000 + Math.floor(Math.random() * 5000);
    else if (band < 0.6) state.viewers = 10000 + Math.floor(Math.random() * 15000);
    else if (band < 0.9) state.viewers = 25000 + Math.floor(Math.random() * 25000);
    else state.viewers = 50000 + Math.floor(Math.random() * 40000);
    updateViewerLabel();

    viewerTimer = setInterval(() => {
      if (state.screen !== 'live') return;
      const r = Math.random();
      let d;
      if (r < 0.55) d = (Math.random() < 0.55 ? 1 : -1) * (5 + Math.floor(Math.random() * 40));
      else if (r < 0.85) d = (Math.random() < 0.6 ? 1 : -1) * (50 + Math.floor(Math.random() * 150));
      else d = (Math.random() < 0.65 ? 1 : -1) * (200 + Math.floor(Math.random() * 600));
      state.viewers = Math.max(1200, state.viewers + d);
      updateViewerLabel();
    }, 900);
  }

  function stopViewerEngine() {
    if (viewerTimer) { clearInterval(viewerTimer); viewerTimer = null; }
  }

  function updateViewerLabel() {
    const el = document.getElementById('viewerCount');
    if (el) el.textContent = formatViewers(state.viewers);
  }

  // ===== Speech recognition =====
  function startListening() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const mic = document.getElementById('micStatus');
    if (!SR) {
      state.listening = false;
      if (mic) { mic.textContent = 'Mic: voice not supported on this browser'; mic.className = 'mic-status'; }
      return;
    }
    try {
      if (recognition) {
        try { recognition.stop(); } catch (e) {}
      }
      recognition = new SR();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        state.listening = true;
        if (mic) { mic.textContent = 'Mic: listening…'; mic.className = 'mic-status on'; }
      };
      recognition.onerror = () => {
        state.listening = false;
        if (mic) { mic.textContent = 'Mic: tap to retry listening'; mic.className = 'mic-status'; }
      };
      recognition.onend = () => {
        // Auto-restart while live
        if (state.screen === 'live') {
          setTimeout(() => {
            try { recognition.start(); } catch (e) {}
          }, 400);
        } else {
          state.listening = false;
        }
      };
      recognition.onresult = (ev) => {
        let finalText = '';
        let interim = '';
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          const t = ev.results[i][0].transcript;
          if (ev.results[i].isFinal) finalText += t;
          else interim += t;
        }
        const text = (finalText || interim).trim();
        if (!text) return;
        state.lastVoice = text;
        if (mic) mic.textContent = 'Heard: “' + text.slice(0, 42) + (text.length > 42 ? '…' : '') + '”';

        if (finalText) {
          handleVoice(finalText);
        }
      };
      recognition.start();
    } catch (e) {
      state.listening = false;
      if (mic) { mic.textContent = 'Mic: permission blocked'; mic.className = 'mic-status'; }
    }
  }

  function stopListening() {
    if (recognition) {
      try { recognition.onend = null; recognition.stop(); } catch (e) {}
      recognition = null;
    }
    state.listening = false;
  }

  let lastTriggerAt = 0;
  function handleVoice(text) {
    const now = Date.now();
    if (now - lastTriggerAt < 1800) return; // debounce
    for (const tr of VOICE_TRIGGERS) {
      if (tr.re.test(text)) {
        lastTriggerAt = now;
        spamReaction(tr.pack, tr.intensity);
        return;
      }
    }
  }

  // ===== Camera =====
  function cameraErrorMessage(e) {
    const name = (e && e.name) || '';
    const secure = typeof window.isSecureContext === 'boolean' ? window.isSecureContext : true;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return 'Camera API not available here. Open this file in Chrome or Safari (not the Grok preview).';
    }
    if (!secure && location.protocol !== 'https:' && location.hostname !== 'localhost') {
      return 'Camera needs HTTPS or localhost. Upload live.html to GitHub Pages or open in Chrome.';
    }
    if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
      return 'Camera blocked. In Chrome: tap the lock/tune icon in the address bar → allow Camera, then try again.';
    }
    if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
      return 'No camera found on this device.';
    }
    if (name === 'NotReadableError' || name === 'TrackStartError') {
      return 'Camera is busy (another app is using it). Close other camera apps and retry.';
    }
    if (name === 'SecurityError') {
      return 'Browser blocked camera in this view. Open in Chrome/Safari, not an in-app preview.';
    }
    return 'Camera failed (' + (name || 'unknown') + '). Try Demo Live, or open in Chrome.';
  }

  async function startCamera() {
    state.error = null;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      state.error = cameraErrorMessage({ name: 'NotSupported' });
      return false;
    }
    try {
      // Try ideal constraints first
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
      } catch (e1) {
        // Fallback: any camera
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      }
      state.stream = stream;
      return true;
    } catch (e) {
      state.error = cameraErrorMessage(e);
      return false;
    }
  }

  function stopCamera() {
    if (state.stream) {
      state.stream.getTracks().forEach(t => t.stop());
      state.stream = null;
    }
  }

  function enterLiveUI(demo) {
    state.screen = 'live';
    state.demo = !!demo;
    chatLines.length = 0;
    render();
    const video = document.getElementById('cam');
    if (video && state.stream) {
      video.srcObject = state.stream;
      video.play().catch(() => {});
    }
    startViewerEngine();
    startChatEngine();
    for (let i = 0; i < 8; i++) {
      setTimeout(() => pushChat(randName(), randChat(), randColor()), i * 80);
    }
    startListening();
  }

  async function goLive() {
    const ok = await startCamera();
    if (!ok) { render(); return; }
    enterLiveUI(false);
  }

  function goLiveDemo() {
    state.error = null;
    stopCamera();
    enterLiveUI(true);
  }

  function endLive() {
    stopListening();
    stopChatEngine();
    stopViewerEngine();
    stopCamera();
    state.screen = 'pre';
    state.viewers = 0;
    chatLines.length = 0;
    render();
  }

  function sendUserChat() {
    const input = document.getElementById('chatInput');
    if (!input) return;
    const text = (input.value || '').trim();
    if (!text) return;
    pushChat('You', text, '#fff');
    input.value = '';
    // Bots sometimes reply
    if (Math.random() < 0.55) {
      setTimeout(() => pushChat(randName(), randChat(), randColor()), 400 + Math.random() * 900);
    }
  }

  function render() {
    const app = document.getElementById('app');
    if (state.screen === 'pre') {
      app.innerHTML = `
        <div class="prelive">
          <div class="logo">Broadcast // Simulator</div>
          <h1 class="title">GO <span>LIVE</span></h1>
          <p class="subtitle">Turn on your camera. Chat floods in. Say “chat” and watch them spam W.</p>
          ${state.error ? `<p class="err">${escapeHtml(state.error)}</p>` : ''}
          <button class="go-live" id="goLiveBtn">● Go Live</button>
          <button class="go-live" id="demoBtn" style="background:transparent;border:1px solid #333;box-shadow:none;margin-top:0;color:#ccc;font-size:14px;">Demo Live (no camera)</button>
          <p class="hint">Open in <strong>Chrome</strong> or <strong>Safari</strong> (not Grok preview). Camera needs HTTPS or localhost. Allow Camera when asked.</p>
        </div>`;
      document.getElementById('goLiveBtn').onclick = goLive;
      document.getElementById('demoBtn').onclick = goLiveDemo;
      return;
    }

    app.innerHTML = `
      <div class="live">
        <div class="video-wrap">
          <video id="cam" playsinline autoplay muted></video>
          ${state.demo ? `<div class="cam-fallback">Demo mode — no camera<br/><span style="opacity:.7">Chat & viewers still work</span></div>` : ''}
          <div class="topbar">
            <div class="live-pill">
              <div class="live-dot"></div>
              <div class="live-label">LIVE</div>
              <div class="viewers"><span>👁</span><span id="viewerCount">${formatViewers(state.viewers)}</span></div>
            </div>
            <button class="end-btn" id="endBtn" title="End stream">×</button>
          </div>
          <div class="floats" id="floats"></div>
        </div>
        <div class="chat-wrap">
          <div class="mic-status" id="micStatus">Mic: starting…</div>
          <div class="chat-list" id="chatList"></div>
          <div class="chat-input-row">
            <input class="chat-input" id="chatInput" placeholder="Say something…" maxlength="120" />
            <button class="chat-send" id="chatSend">Send</button>
          </div>
        </div>
      </div>`;

    document.getElementById('endBtn').onclick = endLive;
    document.getElementById('chatSend').onclick = sendUserChat;
    document.getElementById('chatInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendUserChat();
    });
    document.getElementById('micStatus').onclick = () => startListening();

    const video = document.getElementById('cam');
    if (video && state.stream) {
      video.srcObject = state.stream;
      video.play().catch(() => {});
    }
    paintChat();
    updateViewerLabel();
  }

  render();
})();
</script>
</body>
</html>
