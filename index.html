  function generateBotName(usedSet){
    const used = usedSet || new Set();
    for(let attempt = 0; attempt < 40; attempt++){
      const core = BOT_CORE_NAMES[Math.floor(Math.random() * BOT_CORE_NAMES.length)];
      const style = Math.random();

      if(style < 0.35){

      let authNullTimer = null;
      let authRestoring = true; // true until first real user OR grace period ends

      function applyAuthUser(user, forceNull){
        if (user) {
          if (authNullTimer) { clearTimeout(authNullTimer); authNullTimer = null; }
          authRestoring = false;
          state.currentUser = {
            uid: user.uid,
            name: user.displayName || 'Player',
            photoURL: user.photoURL || '',

          loadSavedProfile();
          ensureUserDoc().catch(() => {});
          state.authSettled = true;
          render();
          return;
        }
        // Firebase often emits null once while LOCAL persistence is restoring after refresh.
        // Never treat that as a real logout until the grace window ends (or signOut forces it).
        if (!forceNull && (authRestoring || state.currentUser)) {
          if (authNullTimer) clearTimeout(authNullTimer);
          authNullTimer = setTimeout(() => {
            authRestoring = false;
            if (!fbAuth.currentUser) {
              state.currentUser = null;
              state.authSettled = true;
              render();
            } else {
              applyAuthUser(fbAuth.currentUser);
            }
          }, 2500);
          return;
        }
        authRestoring = false;
        state.currentUser = null;
        state.authSettled = true;
        render();
      }

      // LOCAL = stay logged in after refresh / re-open
      fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
        .catch(err => console.warn('Auth persistence:', err))
        .then(() => {
          // Prefer currentUser if already available
          if (fbAuth.currentUser) applyAuthUser(fbAuth.currentUser);
          fbAuth.onAuthStateChanged(user => applyAuthUser(user));
          return fbAuth.getRedirectResult();
        })
        .then(result => {
          if (result && result.user) applyAuthUser(result.user);
        })
        .catch(err => console.warn('Auth restore error:', err));

      // Safety: if auth never settles, stop waiting after 4s
      setTimeout(() => {
        if (!state.authSettled) {
          authRestoring = false;
          if (fbAuth.currentUser) applyAuthUser(fbAuth.currentUser);
          else {
            state.authSettled = true;

          }

  const AudioCtx = window.AudioContext || window.webkitAudioContext;

  function startTurnTimer(){
    clearTurnTimer();

  function clearReviewTimer(){

    state.onlineReviewSecondsLeft = null;
  }
  function startReviewTimer(endsAt){
    if(!endsAt) return;
    // Don't restart the same countdown over and over (causes the "back to 10s" glitch)
    if(reviewInterval && lastReviewEndsAtStarted === endsAt) return;
    clearReviewTimer();
    lastReviewEndsAtStarted = endsAt;

    function tick(){
      const left = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
      state.onlineReviewSecondsLeft = left;
      if(left <= 0){
        clearReviewTimer();
        lastReviewEndsAtStarted = null;
        // Any client may request advance; advanceToNextTurn is idempotent / guarded
        advanceToNextTurn();
      } else {
        render();
      }
    }
    tick();
    if(state.onlineReviewSecondsLeft > 0){
      reviewInterval = setInterval(tick, 250);
    }
  }


  function playSFX(type){
    if(!state.soundEnabled) return;
    try {
      if(!ctx) ctx = new AudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      const now = ctx.currentTime;
      if(type === 'click'){
        osc.frequency.setValueAtTime(400, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
      } else if(type === 'start'){
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if(type === 'stop'){
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(440, now + 0.12);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
      } else if(type === 'reveal'){
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(300, now + 0.3);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      }
    } catch(e){}
  }

  function shuffledOrder(n){
    const arr = Array.from({length:n}, (_,i)=>i);
    for(let i=arr.length-1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  function pad2(n){ return n.toString().padStart(2,'0'); }
  function formatTime(ms){
    const totalCenti = Math.round(ms/10);
    const sec = Math.min(99, Math.floor(totalCenti/100));
    const centi = totalCenti % 100;

  }

  function generateTargetAndClue(){
    let minS = 1, maxS = 9;
    if(state.mode === 'fast'){ minS = 0.5; maxS = 3; }
    if(state.mode === 'marathon'){ minS = 10; maxS = 20; }

    const centi = Math.floor(Math.random() * (maxS * 100 - minS * 100 + 1)) + (minS * 100);
    state.targetMs = centi * 10;

    const totalSec = state.targetMs / 1000;
    const level = state.clueLevel || 'normal';
    if(level === 'off'){
      state.imposterClue = '';
      return;
    }
    // Easy = wide range, Normal = medium, Hard = tight range
    let spreadMin, spreadMax;
    if(level === 'easy'){ spreadMin = 2.5; spreadMax = 5; }
    else if(level === 'hard'){ spreadMin = 0.3; spreadMax = 0.8; }
    else { spreadMin = 0.5; spreadMax = 2; } // normal

    const lowOff = spreadMin + Math.random() * (spreadMax - spreadMin);
    const highOff = spreadMin + Math.random() * (spreadMax - spreadMin);
    const lower = Math.max(0, Math.floor(totalSec - lowOff));
    const upper = Math.ceil(totalSec + highOff);
    if(level === 'hard'){
      state.imposterClue = `Very close to ${Math.round(totalSec)}s`;
    } else {
      state.imposterClue = `Target is between ${lower}s and ${upper}s`;
    }
  }

  function assignTeams(n){
    const teams = new Array(n).fill(0);
    const order = shuffledOrder(n);
    // Split as evenly as possible
    order.forEach((idx, i) => { teams[idx] = i < Math.ceil(n / 2) ? 0 : 1; });
    state.playerTeams = teams;
  }

  function teamName(t){ return t === 0 ? 'Alpha' : 'Bravo'; }

  function computeTeamWinner(){
    // Average |diff| for non-imposter, non-skip players per team. Lower is better.
    const sums = [0, 0];
    const counts = [0, 0];
    for(let i = 0; i < state.numPlayers; i++){
      if(i === state.imposterIndex) continue;
      if(state.times[i] === undefined || state.times[i] === 'SKIP') continue;
      const team = state.playerTeams[i] || 0;
      sums[team] += Math.abs(state.times[i] - state.targetMs);
      counts[team]++;
    }
    if(counts[0] === 0 && counts[1] === 0) return null;
    if(counts[0] === 0) return 1;
    if(counts[1] === 0) return 0;
    const avg0 = sums[0] / counts[0];
    const avg1 = sums[1] / counts[1];
    if(Math.abs(avg0 - avg1) < 1) return null; // near tie
    return avg0 < avg1 ? 0 : 1;
  }

  function signInWithGoogle(){
    if(!fbReady){ render(); return; }
    playSFX('click');
    const provider = new firebase.auth.GoogleAuthProvider();

    // Popup first (works on most browsers). Redirect only if popup fails.
    fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(() => {
      return fbAuth.signInWithPopup(provider);
    }).then(result => {
      if(!result || !result.user) return;
      const u = result.user;
      state.currentUser = {
        uid: u.uid,
        name: u.displayName || 'Player',

      ensureUserDoc().catch(() => {});
      state.signInBlocked = false;
      render();
    }).catch(err => {
      console.warn('Popup sign-in failed:', err);
      const msg = (err && err.message) || '';
      const code = (err && err.code) || '';
      const blockedIndicators = ['disallowed_useragent', 'operation-not-supported', 'popup-blocked', 'operation-not-allowed'];
      const isBlocked = blockedIndicators.some(k => msg.indexOf(k) !== -1 || code.indexOf(k) !== -1);
      // Try redirect as backup (page will reload and getRedirectResult restores user)
      fbAuth.signInWithRedirect(provider).catch(redirectErr => {
        console.warn('Redirect sign-in also failed:', redirectErr);
        state.signInBlocked = true;
        render();
      });
      if(isBlocked){
        // Still attempt redirect above; mark blocked only if both fail
      }
    });
  }

  function validateName(name){
    // Letters, numbers, underscores only (Roblox/Discord style)
    return /^[A-Za-z0-9_]{3,20}$/.test(name);
  }

  function validateUsername(username){
    return /^[A-Za-z0-9_]{3,20}$/.test(username);
  }

  function daysLeft(ts){
    if(!ts) return 0;
    const ms = 7 * 24 * 60 * 60 * 1000;
    const left = (ts + ms) - Date.now();
    return left > 0 ? Math.ceil(left / (24 * 60 * 60 * 1000)) : 0;
  }

  function genDefaultUsername(){
    const n = Math.floor(1000 + Math.random() * 9000);
    return 'user' + n;
  }

  async function claimDefaultUsername(uid){
    for(let i = 0; i < 8; i++){
      const candidate = genDefaultUsername();
      const ref = fbDb.collection('usernames').doc(candidate);
      const snap = await ref.get();
      if(!snap.exists){
        await ref.set({ uid: uid, claimedAt: firebase.firestore.FieldValue.serverTimestamp() });
        return candidate;
      }
    }
    return 'user' + Date.now().toString().slice(-6);
  }

  function applyUserFlags(data){
    if(!data) return;
    if(data.banned){
      state.isBanned = true;
      state.banMessage = data.banReason || 'You have been banned from Timer Imposter by an administrator.';
      leaveOnlineRoom();
      state.screen = 'banned';
      render();
      return true;
    }
    // Unbanned
    if(state.isBanned){
      state.isBanned = false;
      state.banMessage = '';
      if(state.screen === 'banned') state.screen = 'start';
    }
    state.currentUser.mutedUntil = data.mutedUntil || null;
    state.isMuted = !!(data.mutedUntil && data.mutedUntil > Date.now());
    if(data.name) state.currentUser.name = data.name;
    if(data.username) state.currentUser.username = data.username;
    if(data.photoURL !== undefined) state.currentUser.photoURL = data.photoURL || state.currentUser.photoURL || '';
    return false;
  }

  function subscribeToUserDoc(){
    if(!fbReady || !state.currentUser) return;
    if(state.userDocUnsub){ state.userDocUnsub(); state.userDocUnsub = null; }
    state.userDocUnsub = fbDb.collection('users').doc(state.currentUser.uid)
      .onSnapshot(snap => {
        if(!snap.exists) return;
        applyUserFlags(snap.data());
        render();
      }, err => console.warn('User doc listen error:', err));
  }

  async function ensureUserDoc(){
    if(!fbReady || !state.currentUser) return null;
    const uref = fbDb.collection('users').doc(state.currentUser.uid);
    const snap = await uref.get();
    if(!snap.exists){
      let uname = await claimDefaultUsername(state.currentUser.uid);
      await uref.set({
        name: state.currentUser.name,
        username: uname,
        email: state.currentUser.email || null,
        isOwner: !!state.currentUser.isOwner,
        nameChangedAt: null,
        usernameChangedAt: null,
        mutedUntil: null,
        banned: false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      state.currentUser.username = uname;
      subscribeToUserDoc();
      return { name: state.currentUser.name, username: uname, nameChangedAt: null, usernameChangedAt: null, mutedUntil: null, banned: false };
    }
    const data = snap.data();
    if(applyUserFlags(data)) return null;

    // Auto-assign username if missing
    if(!data.username){
      const uname = await claimDefaultUsername(state.currentUser.uid);
      await uref.set({ username: uname }, { merge: true });
      data.username = uname;
      state.currentUser.username = uname;
    }
    subscribeToUserDoc();
    return data;
  }

  function saveProfile(){
    if(!state.currentUser || !fbReady) return;
    playSFX('click');
    const nameInput = document.getElementById('profileNameInput');
    const usernameInput = document.getElementById('profileUsernameInput');
    const photoInput = document.getElementById('profilePhotoInput');
    let newName = (nameInput ? nameInput.value : '').trim();
    let newUsernameRaw = (usernameInput ? usernameInput.value : '').trim();
    const isOwner = !!state.currentUser.isOwner;
    // Owner can use any characters; others lowercase alphanumeric + underscore
    let newUsername = isOwner ? newUsernameRaw : newUsernameRaw.toLowerCase();
    let newPhoto = (photoInput ? photoInput.value : '').trim();

    state.profileError = null;

    if(newName){
      if(isOwner){
        if(newName.length < 1 || newName.length > 30){
          state.profileError = 'Name: 1-30 characters.';
          render(); return;
        }
      } else if(!validateName(newName)){
        state.profileError = 'Name: 3-20 chars, letters, numbers, underscores only.';
        render(); return;
      }
    }
    if(newUsername){
      if(isOwner){
        if(newUsername.length < 1 || newUsername.length > 30){
          state.profileError = 'Username: 1-30 characters.';
          render(); return;
        }
      } else if(!validateUsername(newUsername)){
        state.profileError = 'Username: 3-20 chars, letters, numbers, underscores only.';
        render(); return;
      }
    }
    if(newPhoto && !/^https?:\/\/.+/i.test(newPhoto)){
      state.profileError = 'Photo URL must start with http:// or https://';
      render();
      return;
    }

    if(!confirm('Are you sure you want to save these profile changes?')) return;

    ensureUserDoc().then(async (udata) => {
      if(!udata) return;
      const updates = {};
      const nameCooldown = isOwner ? 0 : daysLeft(udata.nameChangedAt);
      const userCooldown = isOwner ? 0 : daysLeft(udata.usernameChangedAt);

      if(newName && newName !== (udata.name || state.currentUser.name)){
        if(nameCooldown > 0){
          state.profileError = `You can change your name again in ${nameCooldown} day(s).`;
          render();
          return;
        }
        updates.name = newName;
        updates.nameChangedAt = Date.now();
      }

      if(newUsername && newUsername !== (udata.username || '')){
        if(userCooldown > 0){
          state.profileError = `You can change your username again in ${userCooldown} day(s).`;
          render();
          return;
        }
        // Unique username check
        const unameKey = newUsername.toLowerCase();
        const unameRef = fbDb.collection('usernames').doc(unameKey);
        const taken = await unameRef.get();
        if(taken.exists && taken.data().uid !== state.currentUser.uid){
          state.profileError = 'That username is already taken.';
          render();
          return;
        }
        // Free old username
        if(udata.username){
          await fbDb.collection('usernames').doc(String(udata.username).toLowerCase()).delete().catch(()=>{});
        }
        await unameRef.set({ uid: state.currentUser.uid, display: newUsername, claimedAt: firebase.firestore.FieldValue.serverTimestamp() });
        updates.username = newUsername;
        updates.usernameChangedAt = Date.now();
      }

      if(newPhoto !== undefined){
        updates.photoURL = newPhoto || null;
      }

      if(Object.keys(updates).length === 0){
        state.profileError = 'No changes to save.';
        render();
        return;
      }

      await fbDb.collection('users').doc(state.currentUser.uid).set(updates, { merge: true });
      if(updates.name) state.currentUser.name = updates.name;
      if(updates.username) state.currentUser.username = updates.username;
      if(updates.photoURL !== undefined) state.currentUser.photoURL = updates.photoURL || '';

      try {
        localStorage.setItem('ti_profile', JSON.stringify({
          name: state.currentUser.name,
          photoURL: state.currentUser.photoURL || '',
          username: state.currentUser.username || ''
        }));
      } catch(e){}

      if(state.roomCode){
        const pUpdates = {};
        if(updates.name) pUpdates.name = updates.name;
        if(updates.photoURL !== undefined) pUpdates.photoURL = updates.photoURL || '';
        if(updates.username) pUpdates.username = updates.username;
        if(Object.keys(pUpdates).length){
          await fbDb.collection('rooms').doc(state.roomCode).collection('players').doc(state.currentUser.uid).update(pUpdates);
        }
      }

      state.profileError = null;
      state.showAccounts = false;
      render();
    }).catch(err => {
      state.profileError = err.message || 'Could not save profile.';
      render();
    });
  }

  function joinRoomByCode(code){
    const roomRef = fbDb.collection('rooms').doc(code);
    roomRef.get().then(doc => {
      if(!doc.exists){ state.onlineError = 'No room found.'; render(); return; }
      const roomData = doc.data();
      if(roomData.status !== 'waiting'){ state.onlineError = 'That room has already started.'; render(); return; }

      return roomRef.collection('players').get().then(async snap => {
          if(snap.size >= (roomData.maxPlayers || 10)){
              state.onlineError = 'This room is full!';
              render();
              return;
          }
          state.roomCode = code;
          state.onlineMaxPlayers = roomData.maxPlayers || 10;
          state.onlineBotSimulated = !!roomData.botSimulated;
          state.onlineIsPrivate = !!roomData.isPrivate;
          state.onlineError = null;

          // Bot rooms: claim hostUid only for write permissions, but UI treats you as guest
          // (no Start button — auto-starts in 3–10s). Your own rooms still make you real host.
          let amHost = (roomData.hostUid === state.currentUser.uid);
          if(roomData.botSimulated && !amHost){
            try {
              await roomRef.update({ hostUid: state.currentUser.uid });
              // Keep isHost true internally so bot turns/votes/start can run from this client
              amHost = true;
            } catch(e){ console.warn('claim bot host', e); }
          }
          state.isHost = amHost;
          // Flag used by UI to hide Start Game on bot rooms
          state.onlineBotSimulated = !!roomData.botSimulated;

          await roomRef.collection('players').doc(state.currentUser.uid).set({
            name: state.currentUser.name,
            photoURL: state.currentUser.photoURL || '',
            isOwner: !!state.currentUser.isOwner,
            joined: firebase.firestore.FieldValue.serverTimestamp(),
            votedFor: null
          });
          state.screen = 'onlineLobby';
          subscribeToRoom(code);
          render();
          // Bot rooms: do NOT start instantly on join — delayed start is handled by room fill sim
      });
    }).catch(err => { state.onlineError = 'Could not join room: ' + err.message; render(); });
  }

  function subscribeToRoom(code){
    unsubscribeOnline();
    // Owner keeps global lobby sim (create/delete/join many rooms)
    if(state.currentUser && state.currentUser.isOwner) startLobbyBotSim();
    // ANY host (including test accounts) fills their own waiting room with bots
    startRoomFillSim();
    subscribeToChat(code);
    const roomRef = fbDb.collection('rooms').doc(code);

    state.onlineUnsub = roomRef.onSnapshot(doc => {
      if(!doc.exists) return;
      const data = doc.data();
      state.onlineStatus = data.status;
      state.onlineImposterUid = data.imposterUid || null;
      state.onlineTargetMs = data.targetMs || null;
      state.onlineMaxPlayers = data.maxPlayers || 10;
      state.onlineIsPrivate = !!data.isPrivate;
      state.onlineBotSimulated = !!data.botSimulated;
      state.onlineSuspectedUid = data.suspectedUid || null;
      state.onlineCrewWins = data.crewWins || false;
      state.onlineTurnOrder = data.turnOrder || [];
      state.onlineLastPlayedUid = data.lastPlayedUid || null;

      // Sync turn index from server — detect change BEFORE writing it
      const incomingIndex = data.currentTurnIndex || 0;
      const indexChanged = incomingIndex !== state.onlineCurrentTurnIndex;
      state.onlineCurrentTurnIndex = incomingIndex;

      const incomingPhase = data.turnPhase || 'play';
      const curUid = (state.onlineTurnOrder || [])[incomingIndex];
      const curPlayer = state.onlinePlayers.find(p => p.uid === curUid);
      const curAlreadyDone = !!(curPlayer && curPlayer.submitted);

      // Protect optimistic local review from lagging "play" snapshots on same index
      const localReviewActive = state.onlineTurnPhase === 'review' && state.onlineReviewEndsAt && Date.now() < state.onlineReviewEndsAt && !indexChanged;

      if(incomingPhase === 'review' && (data.reviewForIndex == null || data.reviewForIndex === incomingIndex)){
        state.onlineTurnPhase = 'review';
        state.onlineReviewEndsAt = data.reviewEndsAt || state.onlineReviewEndsAt;
        state.onlineRoundPhase = 'stopped';
      } else if(indexChanged){
        // New turn — reset local play state
        state.onlineTurnPhase = 'play';
        state.onlineReviewEndsAt = null;
        state.onlineRoundPhase = 'ready';
        clearReviewTimer();
        lastReviewEndsAtStarted = null;
        state._botPlayingUid = null;
      } else if(incomingPhase === 'play' && !localReviewActive){
        // Same index, server says play
        if(curAlreadyDone){
          // Current player already submitted but phase still play → stay stopped, request advance
          state.onlineTurnPhase = 'play';
          state.onlineRoundPhase = 'stopped';
          if(!advancingTurn) setTimeout(() => advanceToNextTurn(), 200);
        } else {
          state.onlineTurnPhase = 'play';
          state.onlineReviewEndsAt = null;
          // Only go back to ready if we haven't already finished this turn
          if(state.onlineRoundPhase === 'stopped'){
            // Don't snap back to TAP TO START if we already played
            const meDone = state.currentUser && state.onlinePlayers.find(p => p.uid === state.currentUser.uid && p.submitted);
            if(!meDone) state.onlineRoundPhase = 'ready';
          }
        }
      } else if(!localReviewActive && incomingPhase === 'review'){
        state.onlineTurnPhase = 'review';
        state.onlineReviewEndsAt = data.reviewEndsAt || null;
        state.onlineRoundPhase = 'stopped';
      }

      const myTurnNow = state.currentUser && state.onlineTurnOrder[state.onlineCurrentTurnIndex] === state.currentUser.uid;
      const meDoc = state.currentUser && state.onlinePlayers.find(p => p.uid === state.currentUser.uid);
      const iAlreadySubmitted = !!(meDoc && meDoc.submitted);

      // Start the 20s auto-skip only if it's truly your turn and you haven't submitted
      if(data.status === 'reveal' && state.onlineTurnPhase !== 'review' && myTurnNow && !iAlreadySubmitted && state.onlineLastTimerIndex !== state.onlineCurrentTurnIndex){
        state.onlineLastTimerIndex = state.onlineCurrentTurnIndex;
        state.onlineRoundPhase = 'ready';
        startTurnTimer();
      } else if(!myTurnNow || data.status !== 'reveal' || state.onlineTurnPhase === 'review' || iAlreadySubmitted){
        clearTurnTimer();
      }

      // Shared 10s review countdown for everyone
      if(data.status === 'reveal' && state.onlineTurnPhase === 'review' && state.onlineReviewEndsAt){
        startReviewTimer(state.onlineReviewEndsAt);
        if(Date.now() > state.onlineReviewEndsAt + 1200 && !advancingTurn){
          advanceToNextTurn();
        }
      } else if(state.onlineTurnPhase !== 'review'){
        clearReviewTimer();
        lastReviewEndsAtStarted = null;
      }

      maybePlayBotTurn();

      if(data.status === 'reveal' && !state.onlineSecret){
        fbDb.collection('rooms').doc(code).collection('secrets').doc(state.currentUser.uid).get().then(sdoc => {
          if(sdoc.exists){ state.onlineSecret = sdoc.data(); render(); }
        });
      }
      
      if(state.screen === 'onlineLobby' && data.status === 'reveal'){
        state.screen = 'onlineReveal';
      }
      // After role reveal, everyone goes to the shared round screen
      if(data.status === 'reveal' && (state.screen === 'onlineReveal' || state.screen === 'onlineLobby')){
        // keep them on reveal until they tap Ready; then goToOnlineRound
      }
      if(data.status === 'voting' && state.screen !== 'onlineVoting' && state.screen !== 'onlineResults'){
        state.screen = 'onlineVoting';
        state.onlineVotedFor = null;
        botVoteStarted.clear();
        // Kick off bot votes as soon as voting starts
        setTimeout(() => { maybeBotVotes(); }, 400);
        setTimeout(() => { maybeBotVotes(); }, 2000);
      }
      if((state.screen === 'onlineVoting' || state.screen === 'onlineWaiting') && data.status === 'revealed'){
        state.screen = 'onlineResults';
      }
      render();
    });

    state.onlinePlayersUnsub = roomRef.collection('players').onSnapshot(snap => {
      state.onlinePlayers = [];
      snap.forEach(d => state.onlinePlayers.push({ uid: d.id, ...d.data() }));

      // If we were kicked (our player doc no longer exists), leave the room
      if(state.currentUser && state.roomCode && state.onlinePlayers.length > 0){
        const stillHere = state.onlinePlayers.some(p => p.uid === state.currentUser.uid);
        if(!stillHere){
          state.onlineError = 'You were kicked from the room.';
          leaveOnlineRoom();
          state.screen = 'onlineHome';
          render();
          return;
        }
      }
      
      if(state.onlineStatus === 'voting'){
          maybeBotVotes();
          // Host (or owner) tallies when everyone has voted
          if(state.isHost || (state.currentUser && state.currentUser.isOwner)){
            const allVoted = state.onlinePlayers.length > 0 && state.onlinePlayers.every(p => !!p.votedFor);
            if(allVoted) tallyOnlineVotes();
          }
      }
      maybePlayBotTurn();
      render();
    });
  }

  const botVoteStarted = new Set();
  function maybeBotVotes(){
    if(!state.currentUser || !state.roomCode) return;
    if(state.onlineStatus !== 'voting'){
      botVoteStarted.clear();
      return;
    }
    // Drive bot votes if we are host, owner, or sitting in a bot-filled room
    const hasBots = state.onlinePlayers.some(p => p.isBot);
    if(!hasBots) return;
    if(!state.isHost && !(state.currentUser && state.currentUser.isOwner) && !state.onlineBotSimulated) return;

    const target = resolveTargetMs();
    state.onlinePlayers.forEach(p => {
      if(!p.isBot) return;
      if(p.votedFor) return;
      if(botVoteStarted.has(p.uid)) return;
      botVoteStarted.add(p.uid);

      const others = state.onlinePlayers.filter(x => x.uid !== p.uid);
      if(!others.length){
        botVoteStarted.delete(p.uid);
        return;
      }

      // Vote like a human: suspect farthest from target (or group average)
      let pick = others[Math.floor(Math.random() * others.length)].uid;
      const withTimes = others.filter(x => x.time != null && !x.skipped);
      if(withTimes.length >= 1){
        if(target != null){
          withTimes.sort((a, b) => Math.abs(b.time - target) - Math.abs(a.time - target));
        } else {
          const avg = withTimes.reduce((s, x) => s + x.time, 0) / withTimes.length;
          withTimes.sort((a, b) => Math.abs(b.time - avg) - Math.abs(a.time - avg));
        }
        const roll = Math.random();
        if(roll < 0.65) pick = withTimes[0].uid;
        else if(roll < 0.85 && withTimes[1]) pick = withTimes[1].uid;
      }

      const delay = 600 + Math.random() * 3200;
      const t = setTimeout(() => {
        // Re-check still needs to vote
        const still = state.onlinePlayers.find(x => x.uid === p.uid);
        if(!still || still.votedFor) return;
        roomRefSecretsIsImposter(p.uid).then(isImp => {
          let finalPick = pick;
          if(isImp && Math.random() < 0.45){
            finalPick = others[Math.floor(Math.random() * others.length)].uid;
          }
          fbDb.collection('rooms').doc(state.roomCode).collection('players').doc(p.uid)
            .update({ votedFor: finalPick })
            .then(() => {
              botMaybeChat(p.uid, p.name, BOT_LINES_VOTE, 0.35);
            })
            .catch(err => {
              console.warn('bot vote failed', p.uid, err);
              // Allow retry on next snapshot
              botVoteStarted.delete(p.uid);
            });
        });
      }, delay);
      botActionTimers.push(t);
    });
  }

  async function runAdminCommand(){
    if(!state.currentUser || !state.currentUser.isOwner || !fbReady) return;
    playSFX('click');
    state.adminError = null;
    state.adminSuccess = null;
    const cmd = (state.adminCmd || '').trim().toLowerCase();
    const target = (state.adminTarget || '').trim();
    if(!cmd || !target){
      state.adminError = 'Enter a command and target (username or name).';
      renderAdminPanelDOM();
      return;
    }

    // Resolve target by username first, then by display name among online players / users collection
    let targetUid = null;
    let targetName = target;

    const unameSnap = await fbDb.collection('usernames').doc(target.toLowerCase()).get();
    if(unameSnap.exists){
      targetUid = unameSnap.data().uid;
    } else {
      const onlineMatch = state.onlinePlayers.find(p =>
        (p.username && p.username.toLowerCase() === target.toLowerCase()) ||
        (p.name && p.name.toLowerCase() === target.toLowerCase())
      );
      if(onlineMatch) targetUid = onlineMatch.uid;
    }

    if(!targetUid){
      // search users by name
      const q = await fbDb.collection('users').where('name', '==', target).limit(1).get();
      if(!q.empty) targetUid = q.docs[0].id;
    }

    if(!targetUid){
      state.adminError = 'User not found. Use their username or exact display name.';
      renderAdminPanelDOM();
      return;
    }

    if(targetUid === state.currentUser.uid){
      state.adminError = 'You cannot target yourself.';
      renderAdminPanelDOM();
      return;
    }

    try {
      if(cmd === 'ban'){
        await fbDb.collection('users').doc(targetUid).set({ banned: true, bannedAt: Date.now(), bannedBy: state.currentUser.uid }, { merge: true });
        if(state.roomCode){
          await fbDb.collection('rooms').doc(state.roomCode).collection('players').doc(targetUid).delete().catch(()=>{});
        }
        state.adminSuccess = 'Banned user permanently from the site.';
      } else if(cmd === 'unban'){
        await fbDb.collection('users').doc(targetUid).set({ banned: false, unbannedAt: Date.now(), unbannedBy: state.currentUser.uid }, { merge: true });
        state.adminSuccess = 'User has been unbanned.';
      } else if(cmd === 'kick'){
        if(!state.roomCode){
          state.adminError = 'Join a room first to kick someone from it.';
          renderAdminPanelDOM();
          return;
        }
        const t = state.onlinePlayers.find(p => p.uid === targetUid);
        targetName = t ? t.name : target;
        await fbDb.collection('rooms').doc(state.roomCode).collection('players').doc(targetUid).delete();
        await fbDb.collection('rooms').doc(state.roomCode).collection('messages').add({
          uid: 'system', name: 'System', text: targetName + ' was kicked by admin',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        state.adminSuccess = 'Kicked from current room.';
      } else if(cmd === 'mute'){
        const mutedUntil = Date.now() + (7 * 24 * 60 * 60 * 1000);
        await fbDb.collection('users').doc(targetUid).set({ mutedUntil: mutedUntil, mutedBy: state.currentUser.uid }, { merge: true });
        state.adminSuccess = 'Muted for 7 days (chat blocked).';
      } else if(cmd === 'unmute'){
        await fbDb.collection('users').doc(targetUid).set({ mutedUntil: null, unmutedAt: Date.now(), unmutedBy: state.currentUser.uid }, { merge: true });
        state.adminSuccess = 'User has been unmuted.';
      } else {
        state.adminError = 'Unknown command. Use: ban, unban, kick, mute, unmute';
        renderAdminPanelDOM();
        return;
      }
      renderAdminPanelDOM();
    } catch(err){
      state.adminError = err.message || 'Command failed.';
      renderAdminPanelDOM();
    }
  }

  // ---- BOTS (any host can add; owner also runs global lobby sim) ----

  // ===== Lobby activity: bots create / join / leave / auto-start (owner client only) =====
  const LOBBY_ROOM_NAMES = [
    'Chill Room','Speed Run','Noobs Only','Pro Lobby','Timer Wars','gg ez','Quick Match',
    'Late Night','Squad Up','Imposter Hunt','Try Hard','Casual','Ranked','Fun Only',
    'AFK ok','One More','Last Game','Duo Queue','Trio','Full Send','Vibes','Lock In',
    'Warmup','Main Lobby','EU Server','NA East','Random','Test Room','Come Join','Hurry',
    'Only Pros','Soft Lobby','Hard Mode','No Skip','Clue Off','Team Fight','1v1 Warmup'
  ];
  const LOBBY_MAX_OPTS = [3, 4, 5, 6, 8, 9, 10];
  let lobbySimTimer = null;
  let lobbySimBusy = false;
  let lobbyDensityMode = 'normal'; // quiet | normal | busy | packed
  let lobbyDensityUntil = 0;

  function pickLobbyRoomName(){
    const base = LOBBY_ROOM_NAMES[Math.floor(Math.random() * LOBBY_ROOM_NAMES.length)];
    if(Math.random() < 0.4) return base + ' ' + Math.floor(1 + Math.random() * 99);
    return base;
  }

  function stopLobbyBotSim(){
    if(lobbySimTimer){ clearInterval(lobbySimTimer); lobbySimTimer = null; }
  }

  // Fills the CURRENT waiting room with bots for ANY host (not only owner).
  // This is what makes test accounts get bots joining their lobby.
  let roomFillTimer = null;
  let roomFillBusy = false;
  function stopRoomFillSim(){
    if(roomFillTimer){ clearInterval(roomFillTimer); roomFillTimer = null; }
  }
  let roomFillNextAt = 0;
  let botRoomStartAt = 0; // scheduled auto-start for bot-hosted rooms only
  function startRoomFillSim(){
    stopRoomFillSim();
    if(!fbReady || !state.currentUser) return;
    roomFillNextAt = Date.now() + 2000 + Math.random() * 3000;
    botRoomStartAt = 0;
    roomFillTimer = setInterval(() => { tickRoomFill(); }, 800);
  }
  async function tickRoomFill(){
    if(roomFillBusy) return;
    if(!fbReady || !state.currentUser) return;
    if(state.screen !== 'onlineLobby' || state.onlineStatus !== 'waiting' || !state.roomCode) return;

    const maxP = state.onlineMaxPlayers || 10;
    const count = (state.onlinePlayers || []).length;
    const isBotRoom = !!state.onlineBotSimulated;

    // HUMAN rooms: never auto-start. Host must click Start.
    // BOT rooms: once we have enough players (>=3), schedule start in 3–10s.
    if(isBotRoom && count >= 3 && state.onlineStatus === 'waiting'){
      if(!botRoomStartAt){
        botRoomStartAt = Date.now() + 3000 + Math.random() * 7000; // 3–10s
      }
      if(Date.now() >= botRoomStartAt){
        roomFillBusy = true;
        try {
          const roomRef = fbDb.collection('rooms').doc(state.roomCode);
          const roomDoc = await roomRef.get();
          if(roomDoc.exists && roomDoc.data().status === 'waiting'){
            if(state.isHost){
              startOnlineGame();
            } else {
              const playersSnap = await roomRef.collection('players').get();
              await lobbyStartBotRoom(state.roomCode, roomDoc.data(), playersSnap);
            }
          }
        } catch(e){ console.warn('bot room delayed start', e); }
        roomFillBusy = false;
        return;
      }
    }

    // Never auto-fill private rooms (owner can still use Add Bot button)
    if(state.onlineIsPrivate) return;

    // Who may add/leave bots in THIS lobby?
    // - Host of any room
    // - Anyone sitting in a bot-simulated room (so bots keep joining after a human enters)
    // - Site owner
    const canFill = state.isHost || isBotRoom || (state.currentUser && state.currentUser.isOwner);
    if(!canFill) return;

    // Random bot LEAVE (not below 1 bot, keep lobby alive)
    if(count >= 3 && Math.random() < 0.18){
      roomFillBusy = true;
      try {
        await lobbyBotLeaveFromCode(state.roomCode);
      } catch(e){ console.warn('room fill leave', e); }
      roomFillBusy = false;
      // Leaving can push us under 3 — clear scheduled start so it re-arms later
      if(isBotRoom && (state.onlinePlayers || []).length < 3) botRoomStartAt = 0;
      return;
    }

    if(count >= maxP) return;

    // Pace joins: sometimes fast, sometimes slow
    if(Date.now() < roomFillNextAt) return;
    const gapRoll = Math.random();
    const nextGap = gapRoll < 0.25 ? (1500 + Math.random() * 1500)
      : gapRoll < 0.65 ? (3500 + Math.random() * 3500)
      : (6000 + Math.random() * 6000);
    roomFillNextAt = Date.now() + nextGap;

    roomFillBusy = true;
    try {
      await lobbyBotJoinSpecific(state.roomCode);
    } catch(e){ console.warn('room fill join', e); }
    roomFillBusy = false;
  }

  async function lobbyBotLeaveFromCode(code){
    if(!code) return;
    try {
      const playersSnap = await fbDb.collection('rooms').doc(code).collection('players').get();
      const bots = [];
      playersSnap.forEach(d => {
        if(d.data().isBot) bots.push(d.id);
      });
      if(bots.length <= 1) return; // keep at least one bot presence
      const leaveId = bots[Math.floor(Math.random() * bots.length)];
      await fbDb.collection('rooms').doc(code).collection('players').doc(leaveId).delete();
    } catch(e){ console.warn('bot leave code', e); }
  }

  function lobbySimAllowedScreen(){
    // Keep sim alive on home AND while waiting in a lobby so bots can join your room
    return state.screen === 'onlineHome'
      || state.screen === 'onlineCreate'
      || state.screen === 'onlineJoinPrivate'
      || (state.screen === 'onlineLobby' && state.onlineStatus === 'waiting');
  }

  function startLobbyBotSim(){
    if(!fbReady || !state.currentUser || !state.currentUser.isOwner) return;
    stopLobbyBotSim();
    lobbySimTimer = setInterval(() => { tickLobbyBotSim(); }, 2800);
    setTimeout(() => { seedLobbyBotRooms(); }, 350);
    setTimeout(() => { tickLobbyBotSim(); }, 1200);
  }

  function pickDensityTarget(){
    // Room density follows the live online player counter
    const n = state.fakeOnlineCount || 3000;
    if(n < 1800){ lobbyDensityMode = 'quiet'; return Math.floor(4 + Math.random() * 12); }
    if(n < 3500){ lobbyDensityMode = 'normal'; return Math.floor(18 + Math.random() * 30); }
    if(n < 5500){ lobbyDensityMode = 'busy'; return Math.floor(50 + Math.random() * 70); }
    lobbyDensityMode = 'packed';
    return Math.floor(100 + Math.random() * 160);
  }

  // Global online population — persisted so refresh keeps the same count
  let onlinePopTimer = null;
  function loadSavedOnlineCount(){
    try {
      const raw = localStorage.getItem('ti_online_count_v1');
      if(!raw) return null;
      const data = JSON.parse(raw);
      const n = parseInt(data.n, 10);
      if(!(n >= 264 && n <= 14000)) return null;
      const last = parseInt(data.t, 10) || Date.now();
      const mins = Math.min(120, Math.max(0, (Date.now() - last) / 60000));
      const drift = Math.round((Math.random() * 2 - 1) * Math.min(80, mins * 0.6));
      return Math.max(264, Math.min(14000, n + drift));
    } catch(e){ return null; }
  }
  function saveOnlineCount(n){
    try {
      localStorage.setItem('ti_online_count_v1', JSON.stringify({ n: n, t: Date.now() }));
    } catch(e){}
  }
  function startOnlinePopulationSim(){
    if(onlinePopTimer) return;
    if(!state.fakeOnlineCount){
      const saved = loadSavedOnlineCount();
      if(saved != null){
        state.fakeOnlineCount = saved;
      } else {
        const band = Math.random();
        if(band < 0.15) state.fakeOnlineCount = 264 + Math.floor(Math.random() * 700);
        else if(band < 0.55) state.fakeOnlineCount = 1800 + Math.floor(Math.random() * 2200);
        else if(band < 0.85) state.fakeOnlineCount = 4200 + Math.floor(Math.random() * 2500);
        else state.fakeOnlineCount = 7000 + Math.floor(Math.random() * 3000);
        saveOnlineCount(state.fakeOnlineCount);
      }
    }
    onlinePopTimer = setInterval(() => {
      const r = Math.random();
      let delta;
      if(r < 0.7) delta = (Math.random() < 0.5 ? -1 : 1) * (1 + Math.floor(Math.random() * 2));
      else if(r < 0.92) delta = (Math.random() < 0.5 ? -1 : 1) * (3 + Math.floor(Math.random() * 5));
      else delta = (Math.random() < 0.5 ? -1 : 1) * (8 + Math.floor(Math.random() * 12));

      state.fakeOnlineCount = Math.max(264, Math.min(14000, (state.fakeOnlineCount || 800) + delta));
      saveOnlineCount(state.fakeOnlineCount);
      if(state.screen === 'start' || state.screen === 'onlineHome') render();
    }, 4500 + Math.floor(Math.random() * 3500));
  }

  async function seedLobbyBotRooms(){
    if(!fbReady || !state.currentUser || !state.currentUser.isOwner) return;
    if(!lobbySimAllowedScreen()) return;
    const existing = (state.publicRooms || []).filter(r => r.botSimulated).length;
    const want = Math.min(40, pickDensityTarget());
    const toCreate = Math.max(0, want - existing);
    if(toCreate <= 0) return;
    lobbySimBusy = true;
    try {
      const chunk = Math.min(toCreate, 10);
      const jobs = [];
      for(let i = 0; i < chunk; i++) jobs.push(lobbyCreateBotRoom());
      await Promise.all(jobs);
    } catch(e){ console.warn('seed lobby', e); }
    lobbySimBusy = false;
    const after = (state.publicRooms || []).filter(r => r.botSimulated).length;
    if(after < 8) setTimeout(() => seedLobbyBotRooms(), 1800);
  }

  function tickLobbyBotSim(){
    if(lobbySimBusy) return;
    if(!fbReady || !state.currentUser || !state.currentUser.isOwner) return;
    if(!lobbySimAllowedScreen()) return;
    lobbySimBusy = true;

    const botRooms = (state.publicRooms || []).filter(r => r.botSimulated);
    // Public waiting rooms only — never private
    const joinableRooms = (state.publicRooms || []).filter(r => !r.isPrivate && (r.status === 'waiting' || !r.status));
    const targetBotRooms = pickDensityTarget();

    const actions = [];
    if(botRooms.length < targetBotRooms){
      actions.push('create');
      if(botRooms.length < targetBotRooms - 8) actions.push('create');
      if(botRooms.length < targetBotRooms - 20 && Math.random() < 0.7) actions.push('create');
      if(lobbyDensityMode === 'packed' && botRooms.length < targetBotRooms - 40) actions.push('create');
    }
    // Churn: delete some rooms and create fresh names so the list feels alive
    if(botRooms.length > 0 && (botRooms.length > targetBotRooms || Math.random() < 0.42)){
      actions.push('delete');
      if(botRooms.length > targetBotRooms + 10 || Math.random() < 0.35) actions.push('delete');
      if(botRooms.length > targetBotRooms + 30) actions.push('delete');
      // Replace deleted with new-named rooms
      if(Math.random() < 0.7) actions.push('create');
      if(Math.random() < 0.4) actions.push('create');
    }
    // Join rooms (human + bot) — sometimes fast burst
    if(joinableRooms.length > 0){
      actions.push('join');
      if(Math.random() < 0.55) actions.push('join');
      if(Math.random() < 0.3) actions.push('join');
    }
    // Leave rooms
    if(botRooms.length > 0 && Math.random() < 0.45) actions.push('leave');
    if(Math.random() < 0.25) actions.push('leave');
    // Auto-start full bot rooms
    if(botRooms.length > 0 && Math.random() < 0.7) actions.push('autostart');

    // If YOU are waiting in a PUBLIC lobby, feed bots into it (never private)
    if(state.screen === 'onlineLobby' && state.onlineStatus === 'waiting' && state.roomCode && !state.onlineIsPrivate){
      actions.push('joinMine');
      if(Math.random() < 0.5) actions.push('joinMine');
    }

    const run = async () => {
      try {
        for(const act of actions){
          if(act === 'create') await lobbyCreateBotRoom();
          else if(act === 'delete') await lobbyDeleteRandomBotRoom(botRooms);
          else if(act === 'join') await lobbyBotJoinRoom(joinableRooms);
          else if(act === 'joinMine') await lobbyBotJoinSpecific(state.roomCode);
          else if(act === 'leave') await lobbyBotLeaveRandom(joinableRooms);
          else if(act === 'autostart') await lobbyAutoStartFullBotRoom(botRooms);
        }
      } catch(e){ console.warn('lobby sim', e); }
      lobbySimBusy = false;
    };
    run();
  }

  async function lobbyCreateBotRoom(){
    if(!state.currentUser) return;
    const code = genRoomCode();

    const mode = modeRoll < 0.28 ? 'fast' : modeRoll < 0.72 ? 'standard' : 'marathon';
    const clueRoll = Math.random();
    const clueLevel = clueRoll < 0.12 ? 'off' : clueRoll < 0.32 ? 'easy' : clueRoll < 0.72 ? 'normal' : 'hard';
    const teamMode = Math.random() < 0.22;
    const hostUid = state.currentUser.uid; // rules require real auth uid
    const hostBotId = 'bot_host_' + code;
    const usedNames = new Set();
    const hostName = generateBotName(usedNames);
    usedNames.add(hostName.toLowerCase());
    await fbDb.collection('rooms').doc(code).set({
      hostUid: hostUid,
      roomName: roomName,
      isPrivate: false,
      password: null,
      status: 'waiting',
      maxPlayers: maxPlayers,
      mode: mode,
      clueLevel: clueLevel,
      teamMode: teamMode,
      enableClues: clueLevel !== 'off',
      botSimulated: true,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

      joined: firebase.firestore.FieldValue.serverTimestamp(),

  async function lobbyBotJoinSpecific(code){

      const roomRef = fbDb.collection('rooms').doc(code);
      const roomDoc = await roomRef.get();
      if(!roomDoc.exists) return;
      const room = roomDoc.data();
      // Never auto-join private rooms
      if(room.isPrivate) return;
      if(room.status && room.status !== 'waiting') return;
      const playersSnap = await roomRef.collection('players').get();
      const maxP = room.maxPlayers || 10;

        photoURL: botAvatarUrl(name, botId),
        isBot: true,
        isOwner: false,
        joined: firebase.firestore.FieldValue.serverTimestamp(),
        votedFor: null
      });
      // Background bot rooms (you're not inside): start when full.
      // Room you're sitting in: delayed 3–10s start is handled by tickRoomFill.
      if(room.botSimulated && playersSnap.size + 1 >= maxP && state.roomCode !== code){

  // Start a full bot-hosted room (botSimulated) so it leaves the public "waiting" list
  // Works even if a human joined — as long as the room is marked botSimulated.
  async function lobbyStartBotRoom(code, roomData, playersSnap){
    try {
      const players = [];
      playersSnap.forEach(d => players.push({ uid: d.id, ...d.data() }));
      if(players.length < 3) return;
      if(!roomData.botSimulated) return; // never force-start normal human-hosted rooms

      const roomRef = fbDb.collection('rooms').doc(code);
      const mode = roomData.mode || 'standard';
      const clueLevel = roomData.clueLevel || 'normal';
      let minS = 1, maxS = 9;
      if(mode === 'fast'){ minS = 0.5; maxS = 3; }
      if(mode === 'marathon'){ minS = 10; maxS = 20; }
      const centi = Math.floor(Math.random() * (maxS*100 - minS*100 + 1)) + (minS*100);
      const targetMs = centi * 10;
      const totalSec = targetMs / 1000;
      let clue = null;
      if(clueLevel !== 'off'){
        const spreadMin = clueLevel === 'easy' ? 2.5 : clueLevel === 'hard' ? 0.3 : 0.5;
        const spreadMax = clueLevel === 'easy' ? 5 : clueLevel === 'hard' ? 0.8 : 2;
        const lowOff = spreadMin + Math.random() * (spreadMax - spreadMin);
        const highOff = spreadMin + Math.random() * (spreadMax - spreadMin);
        const lower = Math.max(0, Math.floor(totalSec - lowOff));
        const upper = Math.ceil(totalSec + highOff);
        clue = clueLevel === 'hard' ? `Very close to ${Math.round(totalSec)}s` : `Target is between ${lower}s and ${upper}s`;
      }
      const imposterUid = players[Math.floor(Math.random() * players.length)].uid;
      const orderIdx = shuffledOrder(players.length);
      const turnOrder = orderIdx.map(i => players[i].uid);

      const batch = fbDb.batch();
      players.forEach(p => {
        const isImp = p.uid === imposterUid;
        batch.set(roomRef.collection('secrets').doc(p.uid), isImp
          ? { isImposter: true, clue: clue }
          : { isImposter: false, targetMs: targetMs }
        );
        batch.update(roomRef.collection('players').doc(p.uid), {
          time: null, submitted: false, votedFor: null, timing: false, skipped: false
        });
      });
      batch.update(roomRef, {
        status: 'reveal',
        turnOrder: turnOrder,
        currentTurnIndex: 0,
        turnPhase: 'play',
        reviewEndsAt: null,
        imposterUid: imposterUid,
        targetMs: targetMs
      });
      await batch.commit();
      // After a while, delete finished bot games so list stays fresh
      setTimeout(() => {
        lobbyDeleteRoomByCode(code).catch(() => {});
      }, 45000 + Math.random() * 60000);
    } catch(e){ console.warn('start bot room', e); }
  }

  function modeTimeRangeMs(){
    let minS = 1, maxS = 9;
    if(state.mode === 'fast'){ minS = 0.5; maxS = 3; }
    if(state.mode === 'marathon'){ minS = 10; maxS = 20; }

  }

  function resolveTargetMs(){
    if(state.onlineTargetMs != null) return state.onlineTargetMs;
    if(state.onlineSecret && state.onlineSecret.targetMs != null) return state.onlineSecret.targetMs;
    return null;
  }

  // Crew/imposter skill mix: some good, some mid, some bad (like real players)
  function botRandomTimeMs(isImposter, clue, knownTarget){
    const target = knownTarget != null ? knownTarget : resolveTargetMs();
    const range = modeTimeRangeMs();
    const skill = Math.random(); // 0..1 skill roll

    if(isImposter){
      if(clue && /between\s+(\d+(?:\.\d+)?)s\s+and\s+(\d+(?:\.\d+)?)s/i.test(clue)){
        const m = clue.match(/between\s+(\d+(?:\.\d+)?)s\s+and\s+(\d+(?:\.\d+)?)s/i);
        const lo = parseFloat(m[1]) * 1000;
        const hi = parseFloat(m[2]) * 1000;
        // Sometimes land in range, sometimes way outside so they look sus
        if(skill < 0.55) return Math.max(200, lo + Math.random() * Math.max(100, hi - lo));
        if(skill < 0.8) return Math.max(200, lo - 800 - Math.random() * 1500);
        return Math.max(200, hi + 600 + Math.random() * 2500);
      }
      if(clue && /close to\s+(\d+)/i.test(clue)){
        const m = clue.match(/close to\s+(\d+)/i);
        const center = parseInt(m[1], 10) * 1000;
        const errMag = skill < 0.4 ? (200 + Math.random() * 600)
          : skill < 0.7 ? (800 + Math.random() * 1500)
          : (1800 + Math.random() * 3500);
        const err = errMag * (Math.random() < 0.5 ? -1 : 1);
        return Math.max(200, center + err);
      }
      // Wild guess across mode range
      return Math.max(200, range.min + Math.random() * (range.max - range.min));
    }

    // Crew bots — skill tiers so not everyone is cracked
    if(target != null){
      let errMag;
      if(skill < 0.28){
        // Good: within ~0.1–0.5s
        errMag = 80 + Math.random() * 420;
      } else if(skill < 0.55){
        // Okay: ~0.5–1.4s off
        errMag = 500 + Math.random() * 900;
      } else if(skill < 0.78){
        // Bad: ~1.5–3.5s off
        errMag = 1500 + Math.random() * 2000;
      } else {
        // Terrible: ~3–7s off (or more)
        errMag = 3000 + Math.random() * 4000;
      }
      const err = errMag * (Math.random() < 0.5 ? -1 : 1);
      return Math.max(200, target + err);
    }
    return Math.max(200, range.min + Math.random() * (range.max - range.min));
  }

  function maybePlayBotTurn(){
    // Only host/owner drives bots so we don't get double actions
    if(!state.currentUser) return;
    if(!state.isHost && !state.currentUser.isOwner) return;
    if(state.onlineStatus !== 'reveal') return;
    if(state.onlineTurnPhase === 'review') return;
    if(!state.onlineTurnOrder || !state.onlineTurnOrder.length) return;

    const uid = state.onlineTurnOrder[state.onlineCurrentTurnIndex];
    const bot = state.onlinePlayers.find(p => p.uid === uid);
    if(!bot || !bot.isBot || bot.submitted) return;
    if(state._botPlayingUid === uid) return;
    state._botPlayingUid = uid;

    const roomRef = fbDb.collection('rooms').doc(state.roomCode);
    const playerRef = roomRef.collection('players').doc(uid);

    // Load bot secret so imposter bots can play from the clue
    roomRef.collection('secrets').doc(uid).get().then(sdoc => {
      const secret = sdoc.exists ? sdoc.data() : {};
      const isImposter = !!secret.isImposter;
      const clue = secret.clue || null;

      // Decide the score FIRST, then wait that long in real time so it matches the display
      const elapsed = botRandomTimeMs(isImposter, clue, secret.targetMs);
      // Small "react / start" delay before timer begins, then wait ~elapsed ms
      const startDelay = 500 + Math.random() * 700;
      const runMs = Math.max(800, elapsed); // never instant

      // After startDelay → show "timing..."
      const t1 = setTimeout(() => {
        playerRef.update({ timing: true, submitted: false }).catch(() => {});
      }, startDelay);

      // After startDelay + runMs → stop with that score
      const t2 = setTimeout(() => {
        const reviewEndsAt = Date.now() + (REVIEW_SECONDS * 1000);

        state.onlineTurnPhase = 'review';
        state.onlineReviewEndsAt = reviewEndsAt;
        state.onlineRoundPhase = 'stopped';
        const local = state.onlinePlayers.find(p => p.uid === uid);
        if(local){ local.time = elapsed; local.submitted = true; local.skipped = false; local.timing = false; }
        startReviewTimer(reviewEndsAt);

        const botIndex = state.onlineCurrentTurnIndex;
        state.onlineLastPlayedUid = uid;
        playerRef.update({ time: elapsed, submitted: true, skipped: false, timing: false })
          .then(() => roomRef.update({
            turnPhase: 'review',
            reviewEndsAt: reviewEndsAt,
            reviewForIndex: botIndex,
            lastPlayedUid: uid
          }))
          .catch(() => {})
          .finally(() => { state._botPlayingUid = null; });

        botMaybeChat(uid, bot.name, BOT_LINES_REVIEW, 0.45);
        render();
      }, startDelay + runMs);

      botActionTimers.push(t1, t2);
    }).catch(() => {
      state._botPlayingUid = null;
    });
  }

  function confirmDeleteRoom(){
    if(!fbReady || !state.currentUser || !state.pendingDeleteCode) return;
    playSFX('click');
    const code = state.pendingDeleteCode;
    const roomRef = fbDb.collection('rooms').doc(code);

    roomRef.get().then(doc => {
      if(!doc.exists){
        state.showDeleteRoomConfirm = false;
        state.pendingDeleteCode = null;
        state.onlineError = 'Room no longer exists.';
        render();
        return;
      }
      if(doc.data().hostUid !== state.currentUser.uid){
        state.showDeleteRoomConfirm = false;
        state.pendingDeleteCode = null;
        state.onlineError = 'You can only delete your own rooms.';
        render();
        return;
      }

      return Promise.all([
        roomRef.collection('players').get(),
        roomRef.collection('secrets').get(),
        roomRef.collection('messages').get()
      ]).then(([playersSnap, secretsSnap, messagesSnap]) => {
        const batch = fbDb.batch();
        playersSnap.forEach(d => batch.delete(d.ref));
        secretsSnap.forEach(d => batch.delete(d.ref));
        messagesSnap.forEach(d => batch.delete(d.ref));
        batch.delete(roomRef);
        return batch.commit();
      }).then(() => {
        state.showDeleteRoomConfirm = false;
        state.pendingDeleteCode = null;
        state.onlineError = null;
        if(state.roomCode === code){
          leaveOnlineRoom();
          state.screen = 'onlineHome';
        }
        render();
      });
    }).catch(err => {
      state.onlineError = 'Could not delete room: ' + err.message;
      state.showDeleteRoomConfirm = false;
      state.pendingDeleteCode = null;
      render();
    });
  }

  function startOnlineGame(){
    // Host OR anyone in a bot-simulated room can start
    if(!fbReady) return;
    if(!state.isHost && !state.onlineBotSimulated) return;
    if(state.onlinePlayers.length < 3){ state.onlineError = 'Need at least 3 players to start.'; render(); return; }
    playSFX('click');
    state.onlineError = null;
    const roomRef = fbDb.collection('rooms').doc(state.roomCode);
    roomRef.get().then(doc => {
      const data = doc.data() || {};
      const mode = data.mode || state.mode || 'standard';
      const clueLevel = data.clueLevel || state.clueLevel || 'normal';
      const teamMode = data.teamMode != null ? data.teamMode : !!state.teamMode;
      let minS = 1, maxS = 9;
      if(mode === 'fast'){ minS = 0.5; maxS = 3; }
      if(mode === 'marathon'){ minS = 10; maxS = 20; }
      const centi = Math.floor(Math.random() * (maxS*100 - minS*100 + 1)) + (minS*100);
      const targetMs = centi * 10;
      const totalSec = targetMs / 1000;

      let clue = null;
      if(clueLevel !== 'off'){
        let spreadMin, spreadMax;
        if(clueLevel === 'easy'){ spreadMin = 2.5; spreadMax = 5; }
        else if(clueLevel === 'hard'){ spreadMin = 0.3; spreadMax = 0.8; }
        else { spreadMin = 0.5; spreadMax = 2; }
        const lowOff = spreadMin + Math.random() * (spreadMax - spreadMin);
        const highOff = spreadMin + Math.random() * (spreadMax - spreadMin);
        const lower = Math.max(0, Math.floor(totalSec - lowOff));
        const upper = Math.ceil(totalSec + highOff);
        clue = clueLevel === 'hard'
          ? `Very close to ${Math.round(totalSec)}s`
          : `Target is between ${lower}s and ${upper}s`;
      }

      const imposterUid = state.onlinePlayers[Math.floor(Math.random()*state.onlinePlayers.length)].uid;
      const turnOrder = shuffledOrder(state.onlinePlayers.length).map(i => state.onlinePlayers[i].uid);

      // Assign teams evenly if team mode
      const teamByUid = {};
      if(teamMode){
        const order = shuffledOrder(state.onlinePlayers.length);
        order.forEach((idx, i) => {
          teamByUid[state.onlinePlayers[idx].uid] = i < Math.ceil(state.onlinePlayers.length / 2) ? 0 : 1;
        });
      }

      const batch = fbDb.batch();
      state.onlinePlayers.forEach(p => {
        const isImp = p.uid === imposterUid;
        const secretRef = roomRef.collection('secrets').doc(p.uid);
        batch.set(secretRef, isImp
          ? { isImposter: true, clue: clue }
          : { isImposter: false, targetMs: targetMs }
        );
        const pUpdate = { time: null, submitted: false, votedFor: null, timing: false, skipped: false };
        if(teamMode) pUpdate.team = teamByUid[p.uid];
        batch.update(roomRef.collection('players').doc(p.uid), pUpdate);
      });
      batch.update(roomRef, {
        status: 'reveal',
        turnOrder: turnOrder,
        currentTurnIndex: 0,
        turnPhase: 'play',
        reviewEndsAt: null,
        clueLevel: clueLevel,
        teamMode: teamMode
      });
      roomRef.set({ _imposterUidPending: imposterUid, _targetMsPending: targetMs }, { merge: true });
      return batch.commit();
    }).catch(err => { state.onlineError = 'Could not start game: ' + err.message; render(); });
  }

  function onlineBigButtonTap(){
    const myTurn = state.onlineTurnOrder[state.onlineCurrentTurnIndex] === state.currentUser.uid;
    if(!myTurn || state.onlineTurnPhase === 'review') return;

    const roomRef = fbDb.collection('rooms').doc(state.roomCode);
    const playerRef = roomRef.collection('players').doc(state.currentUser.uid);

    if(state.onlineRoundPhase === 'ready'){
      clearTurnTimer();
      playSFX('start');
      vibrate(20);
      state.roundStart = performance.now();
      state.onlineRoundPhase = 'running';
      // Tell everyone this player has started timing
      playerRef.update({ timing: true, submitted: false }).catch(() => {});
      render();
    } else if(state.onlineRoundPhase === 'running'){
      playSFX('stop');
      vibrate([20,30,20]);
      const elapsed = performance.now() - state.roundStart;
      state.onlineRoundPhase = 'stopped';
      const reviewEndsAt = Date.now() + (REVIEW_SECONDS * 1000);

      // Optimistic local update so we don't get stuck on "Submitted! / DONE"
      state.onlineTurnPhase = 'review';
      state.onlineReviewEndsAt = reviewEndsAt;
      // Also patch local player list so the time shows immediately
      const me = state.onlinePlayers.find(p => p.uid === state.currentUser.uid);
      if(me){ me.time = elapsed; me.submitted = true; me.skipped = false; me.timing = false; }
      startReviewTimer(reviewEndsAt);

      const myIndex = state.onlineCurrentTurnIndex;
      state.onlineLastPlayedUid = state.currentUser.uid;
      playerRef.update({ time: elapsed, submitted: true, skipped: false, timing: false })
        .then(() => roomRef.update({
          turnPhase: 'review',
          reviewEndsAt: reviewEndsAt,
          reviewForIndex: myIndex,
          lastPlayedUid: state.currentUser.uid
        }))
        .catch(err => {
          state.onlineError = 'Could not submit time: ' + err.message;
          render();
        });
      render();
    }
  }

  // Sequential next unsubmitted player. Any client can call; guarded by advancingTurn + phase.
  function advanceToNextTurn(){
    if(!fbReady || !state.roomCode) return;
    if(advancingTurn) return;
    if(state.onlineStatus !== 'reveal') return;

    const order = (state.onlineTurnOrder || []).slice();
    if(!order.length) return;
    const curIndex = state.onlineCurrentTurnIndex || 0;
    const justUid = order[curIndex];
    const justPlayed = state.onlinePlayers.find(p => p.uid === justUid);

    // Only advance if current player is done OR we're in review
    const mustAdvance = state.onlineTurnPhase === 'review' || (justPlayed && justPlayed.submitted);
    if(!mustAdvance) return;

    advancingTurn = true;

    const roomRef = fbDb.collection('rooms').doc(state.roomCode);
    if(justPlayed){ justPlayed.submitted = true; justPlayed.timing = false; }

    // Next unsubmitted player after current (wrap). Never pick justUid again this step.
    let nextUid = null;
    let newIndex = -1;
    for(let step = 1; step <= order.length; step++){
      const idx = (curIndex + step) % order.length;
      const uid = order[idx];
      if(uid === justUid) continue;
      const p = state.onlinePlayers.find(x => x.uid === uid);
      if(p && !p.submitted){ nextUid = uid; newIndex = idx; break; }
    }

    clearReviewTimer();
    lastReviewEndsAtStarted = null;
    state.onlineReviewEndsAt = null;
    state.onlineReviewSecondsLeft = null;
    state.onlineLastTimerIndex = -1;
    state._botPlayingUid = null;

    if(!nextUid || newIndex < 0){
      state.onlineTurnPhase = 'play';
      roomRef.update({
        status: 'voting',
        turnPhase: 'play',
        reviewEndsAt: null,
        reviewForIndex: null,
        lastPlayedUid: justUid || null
      }).then(() => { advancingTurn = false; render(); })
        .catch(() => { advancingTurn = false; });
      return;
    }

    state.onlineCurrentTurnIndex = newIndex;
    state.onlineTurnPhase = 'play';
    state.onlineRoundPhase = 'ready';
    state.onlineLastPlayedUid = justUid;
    render();

    roomRef.update({
      currentTurnIndex: newIndex,
      turnPhase: 'play',
      reviewEndsAt: null,
      reviewForIndex: null,
      lastPlayedUid: justUid || null
    }).then(() => {
      advancingTurn = false;
      setTimeout(() => { maybePlayBotTurn(); }, 350);
    }).catch(err => {
      console.warn('advance failed', err);
      advancingTurn = false;
    });
  }

  function tallyOnlineVotes(){
    const roomRef = fbDb.collection('rooms').doc(state.roomCode);
    roomRef.get().then(doc => {
      const data = doc.data();
      const imposterUid = data._imposterUidPending;
      
      let voteCounts = {};
      state.onlinePlayers.forEach(p => {
        if(p.votedFor) {
           voteCounts[p.votedFor] = (voteCounts[p.votedFor] || 0) + 1;
        }
      });
      
      let mostVotes = 0;
      let suspectedUid = null;
      for(const [uid, count] of Object.entries(voteCounts)){
        if(count > mostVotes){ mostVotes = count; suspectedUid = uid; }
      }
      
      const crewWins = suspectedUid === imposterUid;
      
      roomRef.update({
        status: 'revealed',
        imposterUid: imposterUid,
        targetMs: data._targetMsPending,
        suspectedUid: suspectedUid,
        crewWins: crewWins
      });
    });
  }

    });

  }

    const isImposter = state.revealIndex === state.imposterIndex;

    if(state.revealPhase === 'handoff'){
      return `
        <div class="screen">
          <div class="handoff-wrap">
            <div class="hand-icon">👆</div>
            <div class="player-num">Hand the phone to</div>
            <div class="player-name">${pName}</div>
            <button class="btn solid" style="max-width:280px;" onclick="TI.revealHandoffTap()">I'm ${pName} — Continue</button>
          </div>
        </div>`;
    }

    if(state.revealPhase === 'card'){
      return `
        <div class="screen">
          <div class="handoff-wrap">
            <div class="eyebrow">${pName} // Eyes Only</div>
            <div class="reveal-box" onclick="TI.revealCardTap()">
              <div class="bar">TAP TO DECLASSIFY</div>
              <div class="reveal-inner">
                ${isImposter
                  ? `<div class="role-label">Role</div><div class="imposter-text">You are<br>the Imposter</div>`
                  : `<div class="role-label">Target Time</div><div class="target-time">${formatTime(state.targetMs)}</div>`
                }
              </div>
            </div>
            <p class="helper-note">Make sure no one else can see the screen before you tap.</p>
          </div>
        </div>`;
    }

    const isLast = state.revealIndex === state.numPlayers - 1;
    return `
      <div class="screen">
        <div class="handoff-wrap">
          <div class="eyebrow">${pName} // Eyes Only</div>
          <div class="reveal-box open">
            <div class="bar">TAP TO DECLASSIFY</div>
            <div class="reveal-inner">
              ${isImposter
                ? `<div class="role-label">Role</div><div class="imposter-text">You are<br>the Imposter</div>
                   ${(state.clueLevel !== 'off' && state.imposterClue) ? `<div class="clue-badge">💡 Clue: ${state.imposterClue}</div>` : ''}
                   ${state.teamMode ? `<div class="clue-badge" style="border-color:var(--line); color:var(--ink); margin-top:6px;">Team ${teamName(state.playerTeams[state.revealIndex] || 0)}</div>` : ''}
                   <p class="helper-note">Blend in! Guess your timing and don't let anyone catch you.</p>`
                : `<div class="role-label">Target Time</div><div class="target-time">${formatTime(state.targetMs)}</div>
                   ${state.teamMode ? `<div class="clue-badge" style="border-color:var(--line); color:var(--ink); margin-top:6px;">Team ${teamName(state.playerTeams[state.revealIndex] || 0)}</div>` : ''}
                   <p class="helper-note">Memorize it. Try to land as close to this exact time as possible.</p>`
              }
            </div>
          </div>
          <div style="width:100%; margin-top:22px;">
            <button class="btn solid" onclick="TI.revealNext()">${isLast ? 'Everyone Ready — Start Game' : 'Next Player'}</button>
          </div>
        </div>
      </div>`;
  }

  function renderFirstPlayer(){
    const firstIdx = state.playerOrder[0];
    const firstName = state.playerNames[firstIdx];
    return `
      <div class="screen">
        <div class="handoff-wrap">
          <div class="eyebrow">Round Order Locked</div>
          <div class="hand-icon">🎲</div>
          <div class="player-num">Going first</div>
          <div class="player-name">${firstName}</div>
          <p class="helper-note">Turn order is randomized — everyone plays exactly once.</p>
          <button class="btn solid" style="max-width:280px; margin-top:14px;" onclick="TI.goToGame()">Start Round</button>
        </div>
      </div>`;
  }

  function renderGame(){
    const playerIdx = state.playerOrder[state.roundIndex];
    const pName = state.playerNames[playerIdx];
    const roundNum = state.roundIndex + 1;

    if(state.roundPhase === 'handoff'){
      return `
        <div class="screen">
          <div class="handoff-wrap">
            <div class="round-progress">TURN ${roundNum} OF ${state.numPlayers}</div>
            <div class="hand-icon">👆</div>
            <div class="player-num">Hand the phone to</div>
            <div class="player-name">${pName}</div>
            <button class="btn solid" style="max-width:280px;" onclick="TI.roundHandoffTap()">I'm ${pName} — Continue</button>
            <button class="btn ghost" style="max-width:280px; margin-top:10px;" onclick="TI.skipTurn()">Skip My Turn</button>
          </div>
        </div>`;
    }

    let timerHtml, btnLabel, btnClass = '';
    if(state.roundPhase === 'ready'){
      timerHtml = `<div class="timer-display hidden-val">--:--</div>`;
      btnLabel = 'TAP TO START';
    } else if(state.roundPhase === 'running'){
      timerHtml = `<div class="timer-display hidden-val">••:••</div>`;
      btnLabel = 'TAP TO STOP';
      btnClass = 'running';
    } else {
      timerHtml = `<div class="timer-display revealed">${formatTime(state.times[playerIdx])}</div>`;
      btnLabel = 'STOPPED';
    }

    const showNext = state.roundPhase === 'stopped';
    const isLast = state.roundIndex === state.numPlayers - 1;

    return `
      <div class="screen">
        <div class="round-wrap">
          <div class="round-progress">TURN ${roundNum} OF ${state.numPlayers} — ${pName}</div>
          ${timerHtml}
          <button class="big-btn ${btnClass}" ${state.roundPhase==='stopped'?'disabled':''} onclick="TI.bigButtonTap()">${btnLabel}</button>
          ${showNext ? `<button class="btn solid" style="max-width:280px;" onclick="TI.nextPlayerTap()">${isLast ? 'View Results' : 'Next Player'}</button>` : `<p class="helper-note">Tap once to start, tap again to stop. The clock is hidden while running.</p>`}
        </div>
      </div>`;
  }

  function renderResults(){
    let rows = '';
    for(let i=0; i<state.numPlayers; i++){
      const isImp = state.resultsRevealed && i === state.imposterIndex;
      const skipped = state.times[i] === 'SKIP';
      const teamTag = state.teamMode && state.playerTeams.length ? `<span class="rtag" style="color:var(--muted);">TEAM ${teamName(state.playerTeams[i] || 0).toUpperCase()}</span>` : '';
      rows += `
        <div class="result-row ${isImp?'imposter-row':''}">
          <div>
            <div class="rname">${state.playerNames[i]}</div>
            ${isImp ? `<span class="rtag">IMPOSTER</span>` : ''}
            ${teamTag}
          </div>
          <div class="rtime" style="${skipped ? 'font-size:15px; color:var(--muted);' : ''}">${skipped ? 'SKIPPED' : formatTime(state.times[i])}</div>
        </div>`;
    }

    const scoresList = state.playerNames.map((n, i) => `
      <div>
        <div style="color:var(--muted);">${n}</div>
        <div class="score-val">${state.scores[i]||0} pts</div>
      </div>
    `).join('');

    const teamBoard = state.teamMode ? `
      <div class="scoreboard" style="margin-bottom:10px;">
        <div>
          <div style="color:var(--muted);">Team Alpha</div>
          <div class="score-val">${state.teamScores[0]||0}</div>
        </div>
        <div>
          <div style="color:var(--muted);">Team Bravo</div>
          <div class="score-val">${state.teamScores[1]||0}</div>
        </div>
      </div>
      ${state.resultsRevealed && state.lastTeamWinner !== null ? `<div class="winner-banner crew">Team ${teamName(state.lastTeamWinner)} wins the round!</div>` : ''}
      ${state.resultsRevealed && state.lastTeamWinner === null ? `<p class="helper-note" style="text-align:center;">Team accuracy was a tie this round.</p>` : ''}
    ` : '';

    return `
      <div class="screen">
        <div class="eyebrow">Match Debrief // Round ${state.matchRound}</div>
        <h1 style="font-size:clamp(28px,7vw,34px); margin-top:6px;">Results</h1>
        
        ${teamBoard}
        <div class="scoreboard">${scoresList}</div>

        ${state.resultsRevealed ? `
          <div class="target-banner">
            <div class="role-label">Target Time Was</div>
            <div class="tval">${formatTime(state.targetMs)}</div>
          </div>
        ` : `<p class="sub">Review the recorded times with everyone and uncover who was guessing blind!</p>`}

        <div class="results-list">${rows}</div>
        <div class="spacer"></div>
        <div class="row-gap">
          ${!state.resultsRevealed ? `<button class="btn danger" onclick="TI.toggleReveal()">Reveal Imposter &amp; Score</button>` : ''}
          ${state.resultsRevealed ? `<button class="btn solid" onclick="TI.nextRound()">Play Next Round</button>` : ''}
          <button class="btn ghost" onclick="TI.goStart()">Main Menu</button>
        </div>
      </div>`;
  }

  function renderPractice(){
    let timerHtml, btnLabel, btnClass = '';
    if(state.practicePhase === 'ready'){
      timerHtml = `<div class="timer-display hidden-val">--:--</div>`;
      btnLabel = 'TAP TO START';
    } else if(state.practicePhase === 'running'){
      timerHtml = `<div class="timer-display hidden-val">••:••</div>`;
      btnLabel = 'TAP TO STOP';
      btnClass = 'running';
    } else {
      timerHtml = `<div class="timer-display revealed">${formatTime(state.practiceElapsed)}</div>`;
      btnLabel = 'STOPPED';

    return `
      <div class="screen">
        <div class="round-wrap">
          <div class="round-progress">PRACTICE MODE — NO PRESSURE</div>

          ${state.practicePhase === 'stopped'
            ? `<button class="btn solid" style="max-width:280px;" onclick="TI.practiceRestart()">Restart</button>`

          <button class="btn ghost" style="max-width:280px;" onclick="TI.goStart()">Back to Menu</button>
        </div>
      </div>`;

    return `<div class="error-banner">${state.onlineError}</div>`;

          ${isMine ? `<button onclick="TI.toggleDeleteRoomConfirm('${r.code}')" style="background:transparent; border:1px solid var(--red); color:var(--red); border-radius:50%; width:28px; height:28px; font-size:14px; cursor:pointer; flex:none; display:flex; align-items:center; justify-content:center;">✕</button>` : ''}

      <div class="screen">

        <div class="card">
          <div class="role-label">Timer Length</div>
          <div class="mode-selector">
            <button class="chip-btn ${state.mode==='fast'?'active':''}" onclick="TI.setMode('fast')">⚡ Fast</button>
            <button class="chip-btn ${state.mode==='standard'?'active':''}" onclick="TI.setMode('standard')">🎯 Standard</button>
            <button class="chip-btn ${state.mode==='marathon'?'active':''}" onclick="TI.setMode('marathon')">⏱ Marathon</button>
          </div>

          <div class="mode-selector" style="flex-wrap:wrap;">
            <button class="chip-btn ${state.clueLevel==='off'?'active':''}" onclick="TI.setClueLevel('off')">Off</button>
            <button class="chip-btn ${state.clueLevel==='easy'?'active':''}" onclick="TI.setClueLevel('easy')">Easy</button>
            <button class="chip-btn ${state.clueLevel==='normal'?'active':''}" onclick="TI.setClueLevel('normal')">Normal</button>
            <button class="chip-btn ${state.clueLevel==='hard'?'active':''}" onclick="TI.setClueLevel('hard')">Hard</button>
          </div>
          <div class="role-label" style="margin-top:12px;">Team Mode</div>
          <div class="option-toggle">
            <button class="chip-btn ${state.teamMode?'active':''}" onclick="TI.toggleTeamMode()">${state.teamMode ? 'ON — Alpha vs Bravo' : 'OFF — Solo'}</button>
          </div>
          <div style="display:flex; gap:8px; margin-top:12px;">
            <button class="btn solid" style="font-size:16px; padding:10px;" onclick="TI.goOnlineCreate(false)">+ Create Public</button>
            <button class="btn solid" style="font-size:16px; padding:10px;" onclick="TI.goOnlineCreate(true)">🔒 Create Private</button>
          </div>
        </div>

        <div class="card">
          <div class="role-label">Join Private Room</div>
          <button class="btn ghost" style="font-size:16px; padding:10px;" onclick="TI.goOnlineJoinPrivate()">🔑 Enter Name &amp; Password</button>
        </div>

        <div class="role-label">Active Public Rooms</div>
        <div class="results-list">${publicList}</div>

        <div class="spacer"></div>
        <button class="btn ghost" onclick="TI.goStart()">Back</button>
      </div>
      ${renderDeleteRoomModal()}`;
  }

    return `
      <div class="screen">
        <div class="eyebrow">${state.createRoomIsPrivate ? 'Create Private Room' : 'Create Public Room'}</div>
        <h1 style="font-size:clamp(26px,7vw,32px); margin-top:6px;">Room Settings</h1>

          ${state.createRoomIsPrivate ? `
            <div class="role-label" style="margin-top:12px;">Password</div>

          <div class="role-label" style="margin-top:12px;">Max Players (${state.createRoomMaxPlayers})</div>
          <div class="stepper">

  function renderOnlineJoinPrivate(){
    return `
      <div class="screen">
        <div class="eyebrow">Join Private Room</div>
        <h1 style="font-size:clamp(26px,7vw,32px); margin-top:6px;">Enter Details</h1>
        ${renderErrorBanner()}
        <div class="card">
          <div class="role-label">Room Name</div>
          <input class="input-field" type="text" value="${state.joinRoomName}" placeholder="Room name" onchange="TI.updateJoinField('Name', this.value)" />
          <div class="role-label" style="margin-top:12px;">Password</div>
          <input class="input-field" type="text" value="${state.joinRoomPassword}" placeholder="Room password" onchange="TI.updateJoinField('Password', this.value)" />
        </div>
        <div class="spacer"></div>
        <div class="row-gap">
          <button class="btn solid" onclick="TI.submitJoinPrivate()">Join Room</button>
          <button class="btn ghost" onclick="TI.goOnlineHome()">Back</button>
        </div>
      </div>`;
