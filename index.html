<style>

  .eyebrow{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:.28em;
    text-transform:uppercase;

  .eyebrow::before{

  h1{

  .btn{

  .round-wrap{
    flex:1;

    justify-content:center;

  }
  .timer-display{
    font-family:'Space Mono', monospace;

  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .timer-display.revealed{ color:var(--green); text-shadow:0 0 26px rgba(77,255,156,.35); }

  .big-btn{
    width: min(200px, 55vw);
    height: min(200px, 55vw);
    border-radius:50%;
    border:3px solid var(--green);
    background: radial-gradient(circle at 35% 30%, rgba(77,255,156,.18), transparent 70%);

  .big-btn.running{

  .round-progress{

  .scoreboard{
    display:flex;

  .results-list{
    display:flex;

    display:flex;

  .result-row.imposter-row{

  .result-row .rname{

  .result-row .rtag{

  .result-row .rtime{

  .target-banner{

  .target-banner .tval{

  .winner-banner{
    text-align:center;
    padding: 14px;

  .winner-banner.imposter{ background:rgba(255,90,90,.15); color:var(--red); border:2px solid var(--red); }
  .winner-banner.crew{ background:rgba(77,255,156,.15); color:var(--green); border:2px solid var(--green); }

  .modal-overlay{

    backdrop-filter: blur(6px);

  .modal-card{
    background: var(--panel-solid);

  .help-num{
    font-family:'Space Mono', monospace; font-size:14px; font-weight:700;

  .help-body{ font-size:15px; color:var(--ink); line-height:1.45; }

  .audio-btn{
    position:fixed;
    top: max(14px, env(safe-area-inset-top));

  .row-gap > * + *{ margin-top:10px; }

  .corner-credit{
    position:fixed; bottom: max(10px, env(safe-area-inset-bottom)); left:14px;

    text-transform:uppercase; color:#5c6b5e; z-index:5; pointer-events:none;

  .corner-version{
    position:fixed; bottom: max(10px, env(safe-area-inset-bottom)); right:14px;

</style>

<body>
<div id="app"></div>
<button class="audio-btn active" id="audioToggle" onclick="TI.toggleAudio()">🔊</button>
<div class="corner-credit">made by kobi</div>
<div class="corner-version" id="versionTag"></div>

<script>
const GAME_VERSION = "v16";

const firebaseConfig = {
  apiKey: "AIzaSyA_dIpy_Nu9F_gTIJ_P6w4yysCgabusLFw",
  authDomain: "timer-imposter.firebaseapp.com",
  projectId: "timer-imposter",
  storageBucket: "timer-imposter.firebasestorage.app",
  messagingSenderId: "173473961509",
  appId: "1:173473961509:web:03040fa242a3e6006f51cc"
};

let fbApp = null, fbAuth = null, fbDb = null, fbReady = false;

(function(){
  const state = {
    screen: 'start',
    showHelp: false,
    showAccounts: false,
    currentUser: null,
    roomCode: null,
    isHost: false,
    onlineUnsub: null,
    onlinePlayersUnsub: null,
    publicRoomsUnsub: null,
    publicRooms: [],
    onlinePlayers: [],
    onlineStatus: null,
    onlineSecret: null,
    onlineImposterUid: null,
    onlineTargetMs: null,
    onlineRoundPhase: 'ready',
    onlineMaxPlayers: 5,
    onlineVotedFor: null,
    onlineCrewWins: false,
    onlineSuspectedUid: null,
    soundEnabled: true,
    numPlayers: 3,
    playerNames: ['Player 1', 'Player 2', 'Player 3'],
    mode: 'standard',
    enableClues: true,
    imposterIndex: null,
    targetMs: null,
    imposterClue: '',
    revealIndex: 0,
    revealPhase: 'handoff',
    playerOrder: [],
    roundIndex: 0,
    roundPhase: 'handoff',
    roundStart: null,
    times: [],
    resultsRevealed: false,
    matchRound: 1,
    scores: []
  };

  try {
    if(firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf('PASTE_') !== 0){
      fbApp = firebase.initializeApp(firebaseConfig);
      fbAuth = firebase.auth();
      fbDb = firebase.firestore();
      fbReady = true;

      fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

      fbAuth.onAuthStateChanged(user => {
        if (user) {
          state.currentUser = { uid: user.uid, name: user.displayName || 'Player', photoURL: user.photoURL || '' };
        } else {
          state.currentUser = null;
        }
        render();
      });

      fbAuth.getRedirectResult().then(result => {
        if (result && result.user) {
          const u = result.user;
          state.currentUser = { uid: u.uid, name: u.displayName || 'Player', photoURL: u.photoURL || '' };
          render();
        }
      }).catch(err => console.warn('Redirect auth result error:', err));
    }
  } catch(e){ console.warn('Firebase init failed:', e); }

  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let ctx = null;

  function playSFX(type){
    if(!state.soundEnabled) return;
    try {
      if(!ctx) ctx = new AudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      const now = ctx.currentTime;
      if(type === 'click'){
        osc.frequency.setValueAtTime(400, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
      } else if(type === 'start'){
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if(type === 'stop'){
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(440, now + 0.12);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
      } else if(type === 'reveal'){
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(300, now + 0.3);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      }
    } catch(e){}
  }

  function vibrate(ms){ if(navigator.vibrate){ try{ navigator.vibrate(ms); }catch(e){} } }

  function shuffledOrder(n){
    const arr = Array.from({length:n}, (_,i)=>i);
    for(let i=arr.length-1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  function pad2(n){ return n.toString().padStart(2,'0'); }
  function formatTime(ms){
    const totalCenti = Math.round(ms/10);
    const sec = Math.min(99, Math.floor(totalCenti/100));
    const centi = totalCenti % 100;
    return pad2(sec) + ':' + pad2(centi);
  }

  function generateTargetAndClue(){
    let minS = 1, maxS = 9;
    if(state.mode === 'fast'){ minS = 0.5; maxS = 3; }
    if(state.mode === 'marathon'){ minS = 10; maxS = 20; }

    const centi = Math.floor(Math.random() * (maxS * 100 - minS * 100 + 1)) + (minS * 100);
    state.targetMs = centi * 10;

    const totalSec = state.targetMs / 1000;
    const lower = Math.max(0, Math.floor(totalSec - (Math.random() * 1.5 + 0.5)));
    const upper = Math.ceil(totalSec + (Math.random() * 1.5 + 0.5));
    state.imposterClue = `Target is between ${lower}s and ${upper}s`;
  }

  function syncNamesCount(){
    while(state.playerNames.length < state.numPlayers){
      state.playerNames.push(`Player ${state.playerNames.length + 1}`);
    }
    while(state.playerNames.length > state.numPlayers){
      state.playerNames.pop();
    }
    syncScoresCount();
  }
  function syncScoresCount(){
    while(state.scores.length < state.numPlayers){
      state.scores.push(0);
    }
    while(state.scores.length > state.numPlayers){
      state.scores.pop();
    }
  }

  function resetGameState(keepPlayers){
    state.imposterIndex = null;
    state.targetMs = null;
    state.revealIndex = 0;
    state.revealPhase = 'handoff';
    state.playerOrder = [];
    state.roundIndex = 0;
    state.roundPhase = 'handoff';
    state.roundStart = null;
    state.times = [];
    state.resultsRevealed = false;
    state.showHelp = false;

        const diff = Math.abs(state.times[i] - state.targetMs);
        if(diff < bestDiff){
          bestDiff = diff;
          winnerIdx = i;
        }
      }
    });

  function genRoomCode(){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for(let i=0;i<4;i++) code += chars[Math.floor(Math.random()*chars.length)];
    return code;

  function createRoom(isPrivate){
    if(!fbReady || !state.currentUser) return;
    playSFX('click');
    
    let maxP = prompt('Enter Max Players (3-10):', '5');
    if(!maxP) return;
    let parsedMax = parseInt(maxP, 10);
    if(isNaN(parsedMax) || parsedMax < 3 || parsedMax > 10){
        alert('Max players must be a number between 3 and 10.');
        return;
    }
    state.onlineMaxPlayers = parsedMax;

    let roomName = 'Public Room';
    let password = '';

    if(isPrivate){
      roomName = prompt('Enter Room Name:') || 'Private Room';
      password = prompt('Enter Room Password:');
      if(!password){ alert('Password is required for private rooms.'); return; }
    } else {
      roomName = prompt('Enter Public Room Name:') || `${state.currentUser.name}'s Room`;
    }

    const code = genRoomCode();
    state.roomCode = code;
    state.isHost = true;
    
    fbDb.collection('rooms').doc(code).set({
      hostUid: state.currentUser.uid,
      roomName: roomName,
      isPrivate: isPrivate,
      password: password || null,
      status: 'waiting',
      maxPlayers: state.onlineMaxPlayers,
      mode: state.mode || 'standard',
      enableClues: state.enableClues !== false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => {
      return fbDb.collection('rooms').doc(code).collection('players').doc(state.currentUser.uid).set({
        name: state.currentUser.name, joined: firebase.firestore.FieldValue.serverTimestamp(), votedFor: null
      });
    }).then(() => {
      state.screen = 'onlineLobby';
      subscribeToRoom(code);
      render();
    }).catch(err => alert('Could not create room: ' + err.message));
  }

  function joinPublicRoom(code){
    if(!fbReady || !state.currentUser) return;
    playSFX('click');
    joinRoomByCode(code);
  }

  function joinPrivateRoom(){
    if(!fbReady || !state.currentUser) return;
    playSFX('click');
    const roomName = prompt('Enter Private Room Name to Search:');
    if(!roomName) return;
    const password = prompt('Enter Room Password:');

    fbDb.collection('rooms')
      .where('isPrivate', '==', true)
      .where('roomName', '==', roomName.trim())
      .get().then(snap => {
        if(snap.empty){ alert('No private room found with that name.'); return; }
        let matchedDoc = null;
        snap.forEach(doc => {
          if(doc.data().password === password) matchedDoc = doc;
        });
        if(!matchedDoc){ alert('Incorrect password.'); return; }
        if(matchedDoc.data().status !== 'waiting'){ alert('That room has already started.'); return; }

        joinRoomByCode(matchedDoc.id);
      }).catch(err => alert('Could not join room: ' + err.message));
  }

  function joinRoomByCode(code){
    const roomRef = fbDb.collection('rooms').doc(code);
    roomRef.get().then(doc => {
      if(!doc.exists){ alert('No room found.'); return; }
      if(doc.data().status !== 'waiting'){ alert('That room has already started.'); return; }
      
      return roomRef.collection('players').get().then(snap => {
          if(snap.size >= (doc.data().maxPlayers || 10)){
              alert('This room is full!');
              return;
          }
          state.roomCode = code;
          state.isHost = false;
          state.onlineMaxPlayers = doc.data().maxPlayers || 10;
          return roomRef.collection('players').doc(state.currentUser.uid).set({
            name: state.currentUser.name, joined: firebase.firestore.FieldValue.serverTimestamp(), votedFor: null
          }).then(() => {
            state.screen = 'onlineLobby';
            subscribeToRoom(code);
            render();
          });
      });
    }).catch(err => alert('Could not join room: ' + err.message));
  }

  function subscribeToRoom(code){
    unsubscribeOnline();
    const roomRef = fbDb.collection('rooms').doc(code);

    state.onlineUnsub = roomRef.onSnapshot(doc => {
      if(!doc.exists) return;
      const data = doc.data();
      state.onlineStatus = data.status;
      state.onlineImposterUid = data.imposterUid || null;
      state.onlineTargetMs = data.targetMs || null;
      state.onlineMaxPlayers = data.maxPlayers || 10;
      state.onlineSuspectedUid = data.suspectedUid || null;
      state.onlineCrewWins = data.crewWins || false;

      if(data.status === 'reveal' && !state.onlineSecret){
        fbDb.collection('rooms').doc(code).collection('secrets').doc(state.currentUser.uid).get().then(sdoc => {
          if(sdoc.exists){ state.onlineSecret = sdoc.data(); render(); }
        });
      }
      
      if(state.screen === 'onlineLobby' && data.status === 'reveal'){
        state.screen = 'onlineReveal';
      }
      if(data.status === 'voting' && state.screen !== 'onlineVoting' && state.screen !== 'onlineResults'){
        state.screen = 'onlineVoting';
        state.onlineVotedFor = null;
      }
      if((state.screen === 'onlineVoting' || state.screen === 'onlineWaiting') && data.status === 'revealed'){
        state.screen = 'onlineResults';
      }
      render();
    });

    state.onlinePlayersUnsub = roomRef.collection('players').onSnapshot(snap => {
      state.onlinePlayers = [];
      snap.forEach(d => state.onlinePlayers.push({ uid: d.id, ...d.data() }));
      
      if(state.isHost && state.onlineStatus === 'voting'){
          const allVoted = state.onlinePlayers.every(p => p.votedFor);
          if(allVoted) tallyOnlineVotes();
      }
      render();
    });
  }

  function unsubscribeOnline(){
    if(state.onlineUnsub) state.onlineUnsub();
    if(state.onlinePlayersUnsub) state.onlinePlayersUnsub();
    if(state.publicRoomsUnsub) state.publicRoomsUnsub();
    state.onlineUnsub = null;
    state.onlinePlayersUnsub = null;
    state.publicRoomsUnsub = null;
  }

  function leaveOnlineRoom(){
    unsubscribeOnline();
    state.roomCode = null;
    state.isHost = false;
    state.onlinePlayers = [];
    state.onlineStatus = null;
    state.onlineSecret = null;
    state.onlineImposterUid = null;
    state.onlineTargetMs = null;
    state.onlineRoundPhase = 'ready';
    state.onlineVotedFor = null;
  }

  function startOnlineGame(){
    if(!state.isHost || !fbReady) return;
    if(state.onlinePlayers.length < 3){ alert('Need at least 3 players to start.'); return; }
    playSFX('click');
    const roomRef = fbDb.collection('rooms').doc(state.roomCode);
    roomRef.get().then(doc => {
      const mode = doc.data().mode || 'standard';
      const enableClues = doc.data().enableClues !== false;
      let minS = 1, maxS = 9;
      if(mode === 'fast'){ minS = 0.5; maxS = 3; }
      if(mode === 'marathon'){ minS = 10; maxS = 20; }
      const centi = Math.floor(Math.random() * (maxS*100 - minS*100 + 1)) + (minS*100);
      const targetMs = centi * 10;
      const totalSec = targetMs / 1000;
      const lower = Math.max(0, Math.floor(totalSec - (Math.random()*1.5+0.5)));
      const upper = Math.ceil(totalSec + (Math.random()*1.5+0.5));
      const clue = `Target is between ${lower}s and ${upper}s`;

      const imposterUid = state.onlinePlayers[Math.floor(Math.random()*state.onlinePlayers.length)].uid;

      const batch = fbDb.batch();
      state.onlinePlayers.forEach(p => {
        const isImp = p.uid === imposterUid;
        const secretRef = roomRef.collection('secrets').doc(p.uid);
        batch.set(secretRef, isImp
          ? { isImposter: true, clue: enableClues ? clue : null }
          : { isImposter: false, targetMs: targetMs }
        );
        batch.update(roomRef.collection('players').doc(p.uid), { time: null, submitted: false, votedFor: null });
      });
      batch.update(roomRef, { status: 'reveal' });
      roomRef.set({ _imposterUidPending: imposterUid, _targetMsPending: targetMs }, { merge: true });
      return batch.commit();
    }).catch(err => alert('Could not start game: ' + err.message));
  }

  function onlineBigButtonTap(){
    if(state.onlineRoundPhase === 'ready'){
      playSFX('start');
      vibrate(20);
      state.roundStart = performance.now();

  function tallyOnlineVotes(){
    const roomRef = fbDb.collection('rooms').doc(state.roomCode);
    roomRef.get().then(doc => {
      const data = doc.data();
      const imposterUid = data._imposterUidPending;
      
      let voteCounts = {};
      state.onlinePlayers.forEach(p => {
        if(p.votedFor) {
           voteCounts[p.votedFor] = (voteCounts[p.votedFor] || 0) + 1;
        }
      });
      
      let mostVotes = 0;
      let suspectedUid = null;
      for(const [uid, count] of Object.entries(voteCounts)){
        if(count > mostVotes){ mostVotes = count; suspectedUid = uid; }
      }
      
      const crewWins = suspectedUid === imposterUid;
      
      roomRef.update({
        status: 'revealed',
        imposterUid: imposterUid,
        targetMs: data._targetMsPending,
        suspectedUid: suspectedUid,
        crewWins: crewWins
      });
    });
  }

  function playAgainOnline(){

    playSFX('click');

    state.onlineRoundPhase = 'ready';
    state.onlineVotedFor = null;
    const roomRef = fbDb.collection('rooms').doc(state.roomCode);
    roomRef.update({ 
        status: 'waiting', 
        imposterUid: firebase.firestore.FieldValue.delete(), 
        targetMs: firebase.firestore.FieldValue.delete(),
        suspectedUid: firebase.firestore.FieldValue.delete(),
        crewWins: firebase.firestore.FieldValue.delete()
    });
    
    state.onlinePlayers.forEach(p => {
        roomRef.collection('players').doc(p.uid).update({ votedFor: null, submitted: false, time: null });
    });
    
    state.screen = 'onlineLobby';
    render();
  }

              <div class="reveal-inner">
                ${isImposter
                  ? `<div class="role-label">Role</div><div class="imposter-text">You are<br>the Imposter</div>`
                  : `<div class="role-label">Target Time</div><div class="target-time">${formatTime(state.targetMs)}</div>`
                }
              </div>
            </div>
            <p class="helper-note">Make sure no one else can see the screen before you tap.</p>
          </div>
        </div>`;
    }

    const isLast = state.revealIndex === state.numPlayers - 1;
    return `
      <div class="screen">
        <div class="handoff-wrap">
          <div class="eyebrow">${pName} // Eyes Only</div>
          <div class="reveal-box open">
            <div class="bar">TAP TO DECLASSIFY</div>
            <div class="reveal-inner">
              ${isImposter
                ? `<div class="role-label">Role</div><div class="imposter-text">You are<br>the Imposter</div>
                   ${state.enableClues ? `<div class="clue-badge">💡 Clue: ${state.imposterClue}</div>` : ''}
                   <p class="helper-note">Blend in! Guess your timing and don't let anyone catch you.</p>`
                : `<div class="role-label">Target Time</div><div class="target-time">${formatTime(state.targetMs)}</div><p class="helper-note">Memorize it. Try to land as close to this exact time as possible.</p>`
              }
            </div>
          </div>
          <div style="width:100%; margin-top:22px;">
            <button class="btn solid" onclick="TI.revealNext()">${isLast ? 'Everyone Ready — Start Game' : 'Next Player'}</button>
          </div>
        </div>
      </div>`;
  }

  function renderFirstPlayer(){
    const firstIdx = state.playerOrder[0];
    const firstName = state.playerNames[firstIdx];
    return `
      <div class="screen">
        <div class="handoff-wrap">
          <div class="eyebrow">Round Order Locked</div>
          <div class="hand-icon">🎲</div>
          <div class="player-num">Going first</div>
          <div class="player-name">${firstName}</div>
          <p class="helper-note">Turn order is randomized — everyone plays exactly once.</p>
          <button class="btn solid" style="max-width:280px; margin-top:14px;" onclick="TI.goToGame()">Start Round</button>
        </div>
      </div>`;
  }

  function renderGame(){
    const playerIdx = state.playerOrder[state.roundIndex];
    const pName = state.playerNames[playerIdx];
    const roundNum = state.roundIndex + 1;

    if(state.roundPhase === 'handoff'){
      return `
        <div class="screen">
          <div class="handoff-wrap">
            <div class="round-progress">TURN ${roundNum} OF ${state.numPlayers}</div>
            <div class="hand-icon">👆</div>
            <div class="player-num">Hand the phone to</div>
            <div class="player-name">${pName}</div>
            <button class="btn solid" style="max-width:280px;" onclick="TI.roundHandoffTap()">I'm ${pName} — Continue</button>
            <button class="btn ghost" style="max-width:280px; margin-top:10px;" onclick="TI.skipTurn()">Skip My Turn</button>
          </div>
        </div>`;
    }

    let timerHtml, btnLabel, btnClass = '';
    if(state.roundPhase === 'ready'){
      timerHtml = `<div class="timer-display hidden-val">--:--</div>`;
      btnLabel = 'TAP TO START';
    } else if(state.roundPhase === 'running'){
      timerHtml = `<div class="timer-display hidden-val">••:••</div>`;
      btnLabel = 'TAP TO STOP';
      btnClass = 'running';
    } else {
      timerHtml = `<div class="timer-display revealed">${formatTime(state.times[playerIdx])}</div>`;
      btnLabel = 'STOPPED';
    }

    const showNext = state.roundPhase === 'stopped';
    const isLast = state.roundIndex === state.numPlayers - 1;

    return `
      <div class="screen">
        <div class="round-wrap">
          <div class="round-progress">TURN ${roundNum} OF ${state.numPlayers} — ${pName}</div>
          ${timerHtml}
          <button class="big-btn ${btnClass}" ${state.roundPhase==='stopped'?'disabled':''} onclick="TI.bigButtonTap()">${btnLabel}</button>
          ${showNext ? `<button class="btn solid" style="max-width:280px;" onclick="TI.nextPlayerTap()">${isLast ? 'View Results' : 'Next Player'}</button>` : `<p class="helper-note">Tap once to start, tap again to stop. The clock is hidden while running.</p>`}
        </div>
      </div>`;
  }

  function renderResults(){
    let rows = '';
    for(let i=0; i<state.numPlayers; i++){
      const isImp = state.resultsRevealed && i === state.imposterIndex;
      const skipped = state.times[i] === 'SKIP';
      rows += `
        <div class="result-row ${isImp?'imposter-row':''}">
          <div>
            <div class="rname">${state.playerNames[i]}</div>
            ${isImp ? `<span class="rtag">IMPOSTER</span>` : ''}
          </div>
          <div class="rtime" style="${skipped ? 'font-size:15px; color:var(--muted);' : ''}">${skipped ? 'SKIPPED' : formatTime(state.times[i])}</div>
        </div>`;
    }

    const scoresList = state.playerNames.map((n, i) => `
      <div>
        <div style="color:var(--muted);">${n}</div>
        <div class="score-val">${state.scores[i]||0} pts</div>
      </div>
    `).join('');

    return `
      <div class="screen">
        <div class="eyebrow">Match Debrief // Round ${state.matchRound}</div>
        <h1 style="font-size:clamp(28px,7vw,34px); margin-top:6px;">Results</h1>
        
        <div class="scoreboard">${scoresList}</div>

        ${state.resultsRevealed ? `
          <div class="target-banner">
            <div class="role-label">Target Time Was</div>
            <div class="tval">${formatTime(state.targetMs)}</div>
          </div>
        ` : `<p class="sub">Review the recorded times with everyone and uncover who was guessing blind!</p>`}

        <div class="results-list">${rows}</div>
        <div class="spacer"></div>
        <div class="row-gap">
          ${!state.resultsRevealed ? `<button class="btn danger" onclick="TI.toggleReveal()">Reveal Imposter &amp; Score</button>` : ''}
          ${state.resultsRevealed ? `<button class="btn solid" onclick="TI.nextRound()">Play Next Round</button>` : ''}
          <button class="btn ghost" onclick="TI.goStart()">Main Menu</button>
        </div>
      </div>`;
  }

  function renderOnlineHome(){
    const publicList = state.publicRooms.length > 0 ? state.publicRooms.map(r => `
      <div class="result-row">
        <div>
          <div class="rname">${r.roomName || 'Public Room'}</div>
          <span style="font-size:12px; color:var(--muted);">${r.mode.toUpperCase()} • Max: ${r.maxPlayers || 10}</span>
        </div>
        <button class="chip-btn active" style="flex:none; padding:6px 12px;" onclick="TI.joinPublicRoom('${r.code}')">Join</button>
      </div>
    `).join('') : `<p class="helper-note" style="text-align:center; padding:12px;">No active public rooms right now.</p>`;

    return `
      <div class="screen">
        <div class="eyebrow">Online // Rooms</div>
        <h1 style="font-size:clamp(28px,7vw,34px); margin-top:6px;">Play Online (Not Working)</h1>
        
        <div class="card">
          <div class="role-label">Room Config</div>
          <div class="mode-selector">
            <button class="chip-btn ${state.mode==='fast'?'active':''}" onclick="TI.setMode('fast')">⚡ Fast</button>
            <button class="chip-btn ${state.mode==='standard'?'active':''}" onclick="TI.setMode('standard')">🎯 Standard</button>
            <button class="chip-btn ${state.mode==='marathon'?'active':''}" onclick="TI.setMode('marathon')">⏱ Marathon</button>
          </div>
          <div style="display:flex; gap:8px; margin-top:12px;">
            <button class="btn solid" style="font-size:16px; padding:10px;" onclick="TI.createRoom(false)">+ Create Public</button>
            <button class="btn solid" style="font-size:16px; padding:10px;" onclick="TI.createRoom(true)">🔒 Create Private</button>
          </div>
        </div>

        <div class="card">
          <div class="role-label">Join Private Room</div>
          <button class="btn ghost" style="font-size:16px; padding:10px;" onclick="TI.joinPrivateRoom()">🔑 Enter Name &amp; Password</button>
        </div>

        <div class="role-label">Active Public Rooms</div>
        <div class="results-list">${publicList}</div>

        <div class="spacer"></div>
        <button class="btn ghost" onclick="TI.goStart()">Back</button>
      </div>`;
  }

  function renderOnlineLobby(){
    const rows = state.onlinePlayers.map(p => `
      <div class="result-row"><div class="rname">${p.name}${p.uid === state.currentUser.uid ? ' (you)' : ''}</div></div>
    `).join('');
    return `
      <div class="screen">
        <div class="eyebrow">Room Lobby // Max: ${state.onlineMaxPlayers} Players</div>
        <h1 style="font-size:clamp(28px,7vw,34px); margin-top:6px;">Code: ${state.roomCode}</h1>
        <p class="sub">Waiting for players to join. Need at least 3 players.</p>
        <div class="results-list">${rows}</div>
        <div class="spacer"></div>
        <div class="row-gap">
          ${state.isHost ? `<button class="btn solid" onclick="TI.startOnlineGame()">Start Game (${state.onlinePlayers.length} joined)</button>` : `<p class="helper-note">Waiting for the host to start the game...</p>`}
          <button class="btn ghost" onclick="TI.exitOnlineToMenu()">Leave Room</button>
        </div>
      </div>`;
  }

  function renderOnlineReveal(){
    if(!state.onlineSecret){
      return `<div class="screen"><div class="handoff-wrap"><p class="helper-note">Loading your role...</p></div></div>`;
    }
    const isImposter = state.onlineSecret.isImposter;
    return `
      <div class="screen">
        <div class="handoff-wrap">
          <div class="eyebrow">Eyes Only</div>
          <div class="reveal-box open">
            <div class="bar">TAP TO DECLASSIFY</div>
            <div class="reveal-inner">
              ${isImposter
                ? `<div class="role-label">Role</div><div class="imposter-text">You are<br>the Imposter</div>
                   ${state.onlineSecret.clue ? `<div class="clue-badge">💡 Clue: ${state.onlineSecret.clue}</div>` : ''}`
                : `<div class="role-label">Target Time</div><div class="target-time">${formatTime(state.onlineSecret.targetMs)}</div>`
              }
            </div>
          </div>
          <div style="width:100%; margin-top:22px;">
            <button class="btn solid" onclick="TI.goToOnlineRound()">Ready — Start My Attempt</button>
          </div>
        </div>
      </div>`;
  }

  function renderOnlineRound(){
    let timerHtml, btnLabel, btnClass = '';
    if(state.onlineRoundPhase === 'ready'){
      timerHtml = `<div class="timer-display hidden-val">--:--</div>`;
      btnLabel = 'TAP TO START';
    } else if(state.onlineRoundPhase === 'running'){
      timerHtml = `<div class="timer-display hidden-val">••:••</div>`;
      btnLabel = 'TAP TO STOP';
      btnClass = 'running';
    } else {
      timerHtml = `<div class="timer-display revealed">Submitted!</div>`;
      btnLabel = 'DONE';
    }
    return `
      <div class="screen">
        <div class="round-wrap">
          <div class="round-progress">YOUR ATTEMPT</div>
          ${timerHtml}
          <button class="big-btn ${btnClass}" ${state.onlineRoundPhase==='stopped'?'disabled':''} onclick="TI.onlineBigButtonTap()">${btnLabel}</button>
          ${state.onlineRoundPhase === 'stopped' ? `<button class="btn solid" style="max-width:280px;" onclick="TI.goToOnlineWaiting()">Continue</button>` : `<p class="helper-note">Tap once to start, tap again to stop. The clock is hidden while running.</p>`}
        </div>
      </div>`;
  }

  function renderOnlineWaiting(){
    const total = state.onlinePlayers.length;
    const done = state.onlinePlayers.filter(p => p.submitted).length;
    const rows = state.onlinePlayers.map(p => `
      <div class="result-row"><div class="rname">${p.name}</div><div class="rtag" style="color:${p.submitted ? 'var(--green)' : 'var(--muted)'};">${p.submitted ? 'DONE' : 'WAITING'}</div></div>
    `).join('');
    return `
      <div class="screen">
        <div class="eyebrow">Waiting Room</div>
        <h1 style="font-size:clamp(26px,7vw,30px); margin-top:6px;">${done} / ${total} finished</h1>
        <div class="results-list">${rows}</div>
        <div class="spacer"></div>
        ${state.isHost ? `<button class="btn danger" ${done<total?'disabled':''} onclick="TI.startOnlineVoting()">Start Voting Phase</button>` : `<p class="helper-note">Waiting for the host to start the voting phase...</p>`}
      </div>`;
  }

  function renderOnlineVoting(){
    const myVote = state.onlineVotedFor;
    const rows = state.onlinePlayers.map(p => {
      if (p.uid === state.currentUser.uid) {
         return `<div class="result-row"><div class="rname">${p.name} (You)</div><div class="rtime">${p.time != null ? formatTime(p.time) : '—'}</div></div>`;
      }
      return `
        <div class="result-row">
          <div><div class="rname">${p.name}</div><div class="rtag" style="color:var(--muted); font-size: 12px;">Time: ${p.time != null ? formatTime(p.time) : '—'}</div></div>
          ${myVote ? (myVote === p.uid ? `<span class="rtag" style="color:var(--amber);">VOTED</span>` : '') : `<button class="chip-btn active" style="flex:none; padding:6px 12px; border-color:var(--amber); color:var(--amber); background:rgba(255,184,77,0.1);" onclick="TI.castOnlineVote('${p.uid}')">VOTE IMPOSTER</button>`}
        </div>`;
    }).join('');

    return `
      <div class="screen">
        <div class="eyebrow">Voting Phase</div>
        <h1 style="font-size:clamp(26px,7vw,30px); margin-top:6px;">Who is the Imposter?</h1>
        <p class="sub">Look at the times below and cast your vote.</p>
        <div class="results-list">${rows}</div>
        <div class="spacer"></div>
        ${myVote ? `<p class="helper-note" style="text-align:center;">Waiting for everyone to cast their votes...</p>` : ''}
      </div>`;
  }

  function renderOnlineResults(){
    const rows = state.onlinePlayers.map(p => {
      const isImp = p.uid === state.onlineImposterUid;
      const isSuspected = p.uid === state.onlineSuspectedUid;
      return `
        <div class="result-row ${isImp?'imposter-row':''} ${!isImp && isSuspected?'crew-row':''}">
          <div>
            <div class="rname">${p.name}</div>
            ${isImp ? `<span class="rtag">REAL IMPOSTER</span>` : ''}
            ${isSuspected ? `<span class="rtag" style="color:var(--amber);">VOTED OUT</span>` : ''}
          </div>
          <div class="rtime">${p.time != null ? formatTime(p.time) : '—'}</div>
        </div>`;
    }).join('');

    const winnerHtml = state.onlineCrewWins 
      ? `<div class="winner-banner crew">THE CREW WINS!</div><p class="helper-note" style="text-align:center;">The majority caught the Imposter!</p>`
      : `<div class="winner-banner imposter">IMPOSTER WINS!</div><p class="helper-note" style="text-align:center;">The Crew voted for the wrong person.</p>`;

    return `
      <div class="screen">
        <div class="eyebrow">Debrief // Online Round</div>
        <h1 style="font-size:clamp(28px,7vw,34px); margin-top:6px;">Round Over</h1>
        ${winnerHtml}
        <div class="target-banner" style="margin-top:10px;"><div class="role-label">Target Time Was</div><div class="tval">${formatTime(state.onlineTargetMs)}</div></div>
        <div class="results-list">${rows}</div>
        <div class="spacer"></div>
        <div class="row-gap">
          ${state.isHost ? `<button class="btn solid" onclick="TI.playAgainOnline()">Play Again</button>` : ''}
          <button class="btn ghost" onclick="TI.exitOnlineToMenu()">Leave Room</button>
        </div>
      </div>`;
  }

  function render(){
    const app = document.getElementById('app');
    let html = '';
    switch(state.screen){
      case 'start': html = renderStart(); break;
      case 'setup': html = renderSetup(); break;
      case 'reveal': html = renderReveal(); break;
      case 'firstplayer': html = renderFirstPlayer(); break;
      case 'game': html = renderGame(); break;
      case 'results': html = renderResults(); break;
      case 'onlineHome': html = renderOnlineHome(); break;
      case 'onlineLobby': html = renderOnlineLobby(); break;
      case 'onlineReveal': html = renderOnlineReveal(); break;
      case 'onlineRound': html = renderOnlineRound(); break;
      case 'onlineWaiting': html = renderOnlineWaiting(); break;
      case 'onlineVoting': html = renderOnlineVoting(); break;
      case 'onlineResults': html = renderOnlineResults(); break;
    }
    app.innerHTML = html;
  }

  window.TI = {
    goStart, toggleHelp, toggleAccounts, toggleAudio, goSetup, changePlayers, updateName, setMode, toggleClues,
    beginReveal, revealHandoffTap, revealCardTap, revealNext,
    goToGame, roundHandoffTap, bigButtonTap, nextPlayerTap, skipTurn,
    toggleReveal, nextRound,
    signInWithGoogle, signOut,
    goOnlineHome, createRoom, joinPublicRoom, joinPrivateRoom, exitOnlineToMenu, startOnlineGame,
    goToOnlineRound, onlineBigButtonTap, goToOnlineWaiting, startOnlineVoting, castOnlineVote, playAgainOnline
  };

  document.getElementById('versionTag').textContent = GAME_VERSION;
  loadSoundPref();
  const initBtn = document.getElementById('audioToggle');
  initBtn.textContent = state.soundEnabled ? '🔊' : '🔇';
  initBtn.classList.toggle('active', state.soundEnabled);
  render();
})();
</script>
</body>
</html>
