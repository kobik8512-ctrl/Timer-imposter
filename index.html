  function renderCloseRoomModal(){
    if(!state.showCloseRoomConfirm) return '';
    return `
      <div class="modal-overlay" onclick="TI.toggleCloseRoomConfirm(false)">
        <div class="modal-card" onclick="event.stopPropagation()">
          <div class="eyebrow">Close Room</div>
          <h2 class="modal-title">CLOSE THIS ROOM?</h2>
          <p class="help-body">This removes the room for everyone in it and can't be undone. Only the host can do this.</p>
          <button class="btn danger" style="margin-top:16px;" onclick="TI.confirmCloseRoom()">Yes, Close Room</button>
          <button class="btn ghost" style="margin-top:10px;" onclick="TI.toggleCloseRoomConfirm(false)">Cancel</button>
        </div>
      </div>`;
  }

  function renderDeleteRoomModal(){
    if(!state.showDeleteRoomConfirm) return '';
    return `
      <div class="modal-overlay" onclick="TI.toggleDeleteRoomConfirm(null)">
        <div class="modal-card" onclick="event.stopPropagation()">
          <div class="eyebrow">Delete Room</div>
          <h2 class="modal-title">DELETE THIS ROOM?</h2>
          <p class="help-body">This permanently removes the room and kicks everyone in it. This can't be undone.</p>
          <button class="btn danger" style="margin-top:16px;" onclick="TI.confirmDeleteRoom()">Yes, Delete Room</button>
          <button class="btn ghost" style="margin-top:10px;" onclick="TI.toggleDeleteRoomConfirm(null)">Cancel</button>
        </div>
      </div>`;
  }

  function renderOnlineLobby(){
    // Bot rooms never show Start — they auto-start in 3–10s
    const isBotRoom = !!state.onlineBotSimulated;
    const canStart = state.isHost && !isBotRoom && state.onlinePlayers.length >= 3;
    const boxes = state.onlinePlayers.map(p => {
      const isMe = state.currentUser && p.uid === state.currentUser.uid;
      const canKick = state.isHost && !isBotRoom && !isMe;
      return `
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px; width:90px; position:relative;">
        ${avatarHtml(p, 52)}
        <div style="font-size:12px; text-align:center; color:var(--ink); word-break:break-word;">${formatPlayerName(p)}${isMe ? ' (you)' : ''}</div>
        ${canKick ? `<button onclick="TI.kickPlayer('${p.uid}')" style="margin-top:2px; background:transparent; border:1px solid var(--red); color:var(--red); border-radius:4px; font-size:10px; padding:2px 8px; cursor:pointer; font-family:'Space Mono',monospace; letter-spacing:.05em; text-transform:uppercase;">Kick</button>` : ''}

    }).join('');

    if(isBotRoom){
      actionArea = `<p class="helper-note">Waiting for players…</p>`;

      actionArea = `<button class="btn solid" onclick="TI.startOnlineGame()">Start Game (${state.onlinePlayers.length} joined)</button>`;
    } else if(state.isHost){
      actionArea = `<button class="btn solid" onclick="TI.startOnlineGame()" style="opacity:.55;">Start Game (${state.onlinePlayers.length} joined)</button>`;
    } else {
      actionArea = `<p class="helper-note">Waiting for the host to start the game...</p>`;
    }
    return `

        <div class="eyebrow" style="display:flex; justify-content:space-between; align-items:center;">
          <span>Room Lobby // Max: ${state.onlineMaxPlayers} Players</span>
          ${state.isHost && !isBotRoom ? `<button onclick="TI.toggleCloseRoomConfirm(true)" style="background:transparent; border:1px solid var(--red); color:var(--red); border-radius:50%; width:26px; height:26px; font-size:14px; cursor:pointer; flex:none;">✕</button>` : ''}
        </div>
        <h1 style="font-size:clamp(28px,7vw,34px); margin-top:6px;">Code: ${state.roomCode}</h1>
        <p class="sub">Waiting for players to join. Need at least 3 players.</p>
        <div style="display:flex; flex-wrap:wrap; gap:14px; padding:14px 0;">${boxes}</div>
        <div class="spacer"></div>
        <div class="row-gap">
          ${actionArea}
          <button class="btn ghost" onclick="TI.exitOnlineToMenu()">Leave Room</button>
        </div>
      </div>
      ${renderCloseRoomModal()}`;
  }

  function renderOnlineReveal(){
    if(!state.onlineSecret){
      return `<div class="screen"><div class="handoff-wrap"><p class="helper-note">Loading your role...</p></div></div>`;
    }
    const isImposter = state.onlineSecret.isImposter;
    return `
      <div class="screen">
        <div class="handoff-wrap">
          <div class="eyebrow">Eyes Only</div>
          <div class="reveal-box open">
            <div class="bar">TAP TO DECLASSIFY</div>
            <div class="reveal-inner">
              ${isImposter
                ? `<div class="role-label">Role</div><div class="imposter-text">You are<br>the Imposter</div>
                   ${state.onlineSecret.clue ? `<div class="clue-badge">💡 Clue: ${state.onlineSecret.clue}</div>` : ''}
                   ${(() => { const me = state.onlinePlayers.find(p => p.uid === state.currentUser.uid); return (me && me.team != null) ? `<div class="clue-badge" style="border-color:var(--line); color:var(--ink); margin-top:6px;">Team ${teamName(me.team)}</div>` : ''; })()}`
                : `<div class="role-label">Target Time</div><div class="target-time">${formatTime(state.onlineSecret.targetMs)}</div>
                   ${(() => { const me = state.onlinePlayers.find(p => p.uid === state.currentUser.uid); return (me && me.team != null) ? `<div class="clue-badge" style="border-color:var(--line); color:var(--ink); margin-top:6px;">Team ${teamName(me.team)}</div>` : ''; })()}`
              }
            </div>
          </div>
          <div style="width:100%; margin-top:22px;">
            <button class="btn solid" onclick="TI.goToOnlineRound()">Ready — Start My Attempt</button>
          </div>
        </div>
      </div>`;
  }

  function renderLiveTimesList(){
    const done = state.onlinePlayers.filter(p => p.submitted);
    if(done.length === 0) return '';
    const rows = done.map(p => `
      <div class="result-row">
        <div style="display:flex; align-items:center; gap:8px;">${avatarHtml(p, 28)}<span class="rname">${formatPlayerName(p)}</span></div>
        <div class="rtime">${p.skipped ? 'SKIPPED' : formatTime(p.time)}</div>
      </div>
    `).join('');
    return `<div class="role-label" style="margin-top:16px;">Results So Far</div><div class="results-list">${rows}</div>`;
  }

  function renderOnlineRound(){
    const currentUid = state.onlineTurnOrder[state.onlineCurrentTurnIndex];
    const currentPlayer = state.onlinePlayers.find(p => p.uid === currentUid);
    const currentNameHtml = currentPlayer ? formatPlayerName(currentPlayer) : 'Player';
    const currentNamePlain = currentPlayer ? currentPlayer.name : 'Player';
    const myTurn = state.currentUser && currentUid === state.currentUser.uid;
    const meDoc = state.currentUser && state.onlinePlayers.find(p => p.uid === state.currentUser.uid);
    const iAlreadySubmitted = !!(meDoc && meDoc.submitted);
    // If the current turn player already submitted, ALWAYS show result (never TAP TO START again)
    const isReview = state.onlineTurnPhase === 'review'
      || state.onlineRoundPhase === 'stopped'
      || !!(currentPlayer && currentPlayer.submitted);
    const turnNum = state.onlineCurrentTurnIndex + 1;
    const totalTurns = state.onlineTurnOrder.length;

    // Current player done but index hasn't moved → request advance (once)
    if(currentPlayer && currentPlayer.submitted && state.onlineTurnPhase !== 'review' && !advancingTurn && !state._advanceScheduled){
      state._advanceScheduled = true;
      setTimeout(() => { state._advanceScheduled = false; advanceToNextTurn(); }, 250);
    }

    // ===== REVIEW PHASE: show the exact time first, then countdown =====
    if(isReview){
      const timeText = currentPlayer
        ? (currentPlayer.skipped ? 'SKIPPED' : (currentPlayer.time != null ? formatTime(currentPlayer.time) : '—'))
        : '—';
      const secs = state.onlineReviewSecondsLeft != null ? state.onlineReviewSecondsLeft : REVIEW_SECONDS;
      return `
        <div class="screen">
          <div class="round-wrap">
            <div class="round-progress">TURN ${turnNum} OF ${totalTurns}</div>
            <div style="font-size:18px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em;">${currentNameHtml} stopped at</div>
            <div class="timer-display revealed">${timeText}</div>
            <p class="helper-note" style="color:var(--amber); font-size:18px;">Next turn in ${secs}s</p>
            ${renderLiveTimesList()}
          </div>
        </div>`;
    }

    // ===== PLAY PHASE =====
    // Spectator view (not your turn)
    if(!myTurn){
      const isTiming = currentPlayer && currentPlayer.timing;
      return `
        <div class="screen">
          <div class="round-wrap">
            <div class="round-progress">TURN ${turnNum} OF ${totalTurns}</div>
            <div class="hand-icon">${isTiming ? '⏱' : '👆'}</div>
            <div class="player-name" style="font-size:32px; margin:0 0 8px;">${currentNameHtml}'s turn</div>
            ${isTiming
              ? `<div class="timer-display hidden-val">••:••</div>
                 <p class="helper-note">${currentNamePlain} is timing right now...</p>`
              : `<p class="helper-note">Waiting for ${currentNamePlain} to start the timer...</p>`
            }
            ${renderLiveTimesList()}
          </div>
        </div>`;
    }

    // Active player view (your turn)
    let timerHtml, btnLabel, btnClass = '';
    if(state.onlineRoundPhase === 'ready'){
      timerHtml = `<div class="timer-display hidden-val">--:--</div>`;
      btnLabel = 'TAP TO START';
    } else if(state.onlineRoundPhase === 'running'){
      timerHtml = `<div class="timer-display hidden-val">••:••</div>`;
      btnLabel = 'TAP TO STOP';
      btnClass = 'running';
    } else {
      timerHtml = `<div class="timer-display revealed">Submitted!</div>`;
      btnLabel = 'DONE';
    }
    const showCountdown = state.onlineRoundPhase === 'ready' && state.onlineTurnSecondsLeft !== null;
    return `
      <div class="screen">
        <div class="round-wrap">
          <div class="round-progress">YOUR TURN — ${turnNum} OF ${totalTurns}</div>
          ${showCountdown ? `<p class="helper-note" style="color:var(--amber);">Auto-skip in ${state.onlineTurnSecondsLeft}s</p>` : ''}
          ${timerHtml}
          <button class="big-btn ${btnClass}" ${state.onlineRoundPhase==='stopped'?'disabled':''} onclick="TI.onlineBigButtonTap()">${btnLabel}</button>
          ${state.onlineRoundPhase === 'ready' ? `<button class="btn ghost" style="max-width:280px;" onclick="TI.onlineSkipTurn()">Skip My Turn</button>` : ''}
          <p class="helper-note">Tap once to start, tap again to stop. Everyone can see when you start and stop.</p>
        </div>
      </div>`;
  }

  function renderOnlineWaiting(){
    const total = state.onlinePlayers.length;
    const done = state.onlinePlayers.filter(p => p.submitted).length;
    const rows = state.onlinePlayers.map(p => `
      <div class="result-row"><div class="rname">${formatPlayerName(p)}</div><div class="rtag" style="color:${p.submitted ? 'var(--green)' : 'var(--muted)'};">${p.submitted ? 'DONE' : 'WAITING'}</div></div>
    `).join('');
    return `
      <div class="screen">
        <div class="eyebrow">Waiting Room</div>
        <h1 style="font-size:clamp(26px,7vw,30px); margin-top:6px;">${done} / ${total} finished</h1>
        <div class="results-list">${rows}</div>
        <div class="spacer"></div>
        ${state.isHost ? `<button class="btn danger" ${done<total?'disabled':''} onclick="TI.startOnlineVoting()">Start Voting Phase</button>` : `<p class="helper-note">Waiting for the host to start the voting phase...</p>`}
      </div>`;
  }

  function renderOnlineVoting(){
    const myVote = state.onlineVotedFor;
    const rows = state.onlinePlayers.map(p => {
      if (p.uid === state.currentUser.uid) {
         return `<div class="result-row"><div class="rname">${formatPlayerName(p)} (You)</div><div class="rtime">${p.time != null ? formatTime(p.time) : '—'}</div></div>`;
      }
      return `
        <div class="result-row">
          <div><div class="rname">${formatPlayerName(p)}</div><div class="rtag" style="color:var(--muted); font-size: 12px;">Time: ${p.time != null ? formatTime(p.time) : '—'}</div></div>
          ${myVote ? (myVote === p.uid ? `<span class="rtag" style="color:var(--amber);">VOTED</span>` : '') : `<button class="chip-btn active" style="flex:none; padding:6px 12px; border-color:var(--amber); color:var(--amber); background:rgba(255,184,77,0.1);" onclick="TI.castOnlineVote('${p.uid}')">VOTE IMPOSTER</button>`}
        </div>`;
    }).join('');

    return `
      <div class="screen">
        <div class="eyebrow">Voting Phase</div>
        <h1 style="font-size:clamp(26px,7vw,30px); margin-top:6px;">Who is the Imposter?</h1>
        <p class="sub">Look at the times below and cast your vote.</p>
        <div class="results-list">${rows}</div>
        <div class="spacer"></div>
        ${myVote ? `<p class="helper-note" style="text-align:center;">Waiting for everyone to cast their votes...</p>` : ''}
      </div>`;
  }

  function renderOnlineResults(){
    const rows = state.onlinePlayers.map(p => {
      const isImp = p.uid === state.onlineImposterUid;
      const isSuspected = p.uid === state.onlineSuspectedUid;
      return `
        <div class="result-row ${isImp?'imposter-row':''} ${!isImp && isSuspected?'crew-row':''}">
          <div>
            <div class="rname">${formatPlayerName(p)}</div>
            ${isImp ? `<span class="rtag">REAL IMPOSTER</span>` : ''}
            ${isSuspected ? `<span class="rtag" style="color:var(--amber);">VOTED OUT</span>` : ''}
          </div>
          <div class="rtime">${p.time != null ? formatTime(p.time) : '—'}</div>
        </div>`;
    }).join('');

    const winnerHtml = state.onlineCrewWins 
      ? `<div class="winner-banner crew">THE CREW WINS!</div><p class="helper-note" style="text-align:center;">The majority caught the Imposter!</p>`
      : `<div class="winner-banner imposter">IMPOSTER WINS!</div><p class="helper-note" style="text-align:center;">The Crew voted for the wrong person.</p>`;

    return `
      <div class="screen">
        <div class="eyebrow">Debrief // Online Round</div>
        <h1 style="font-size:clamp(28px,7vw,34px); margin-top:6px;">Round Over</h1>
        ${winnerHtml}
        <div class="target-banner" style="margin-top:10px;"><div class="role-label">Target Time Was</div><div class="tval">${formatTime(state.onlineTargetMs)}</div></div>
        <div class="results-list">${rows}</div>
        <div class="spacer"></div>
        <div class="row-gap">
          ${state.isHost ? `<button class="btn solid" onclick="TI.playAgainOnline()">Play Again</button>` : ''}
          <button class="btn ghost" onclick="TI.exitOnlineToMenu()">Leave Room</button>
        </div>
      </div>`;
  }

  function renderBanned(){
    return `
      <div class="screen" style="justify-content:center; align-items:center; text-align:center;">
        <div class="hand-icon" style="font-size:56px;">🚫</div>
        <h1 style="font-size:clamp(32px,10vw,48px); color:var(--red); margin:10px 0;">YOU'RE BANNED!</h1>
        <p class="sub" style="max-width:320px; margin:0 auto 16px;">${state.banMessage || 'You have been banned from Timer Imposter by an administrator.'}</p>
        <p class="helper-note">You cannot play, join rooms, or use chat until an admin unbans you.</p>
        <p class="helper-note" style="margin-top:20px;">If you think this is a mistake, contact the owner.</p>
      </div>`;
  }

  function render(){
    const app = document.getElementById('app');
    let html = '';

    // Banned players are fully locked out of the app
    if(state.isBanned){
      html = renderBanned();
      app.innerHTML = html;
      const chatBtn = document.getElementById('chatToggleBtn');
      if(chatBtn) chatBtn.style.display = 'none';
      const adminBtn = document.getElementById('adminToggleBtn');
      if(adminBtn) adminBtn.style.display = 'none';
      const botBtn = document.getElementById('addBotBtn');
      if(botBtn) botBtn.style.display = 'none';
      return;
    }

    switch(state.screen){
      case 'banned': html = renderBanned(); break;
      case 'start': html = renderStart(); break;
      case 'setup': html = renderSetup(); break;
      case 'reveal': html = renderReveal(); break;
      case 'firstplayer': html = renderFirstPlayer(); break;
      case 'game': html = renderGame(); break;
      case 'results': html = renderResults(); break;
      case 'practice': html = renderPractice(); break;
      case 'onlineHome': html = renderOnlineHome(); break;
      case 'onlineCreate': html = renderOnlineCreate(); break;
      case 'onlineJoinPrivate': html = renderOnlineJoinPrivate(); break;
      case 'onlineLobby': html = renderOnlineLobby(); break;
      case 'onlineReveal': html = renderOnlineReveal(); break;
      case 'onlineRound': html = renderOnlineRound(); break;
      case 'onlineWaiting': html = renderOnlineWaiting(); break;
      case 'onlineVoting': html = renderOnlineVoting(); break;
      case 'onlineResults': html = renderOnlineResults(); break;
    }

    // Only play the fade-in animation when the screen actually changes.
    // This prevents the black flash / double-fade when Firebase auth re-renders the same screen on load.
    const screenChanged = state.lastScreen !== state.screen;
    state.lastScreen = state.screen;

    if(html.indexOf('class="screen') !== -1){
      if(screenChanged){
        html = html.replace('class="screen"', 'class="screen anim"');
      }
    }

    app.innerHTML = html;
    const chatBtn = document.getElementById('chatToggleBtn');
    if(chatBtn) chatBtn.style.display = state.roomCode ? 'flex' : 'none';
    const isOwner = !!(state.currentUser && state.currentUser.isOwner);
    const adminBtn = document.getElementById('adminToggleBtn');
    if(adminBtn) adminBtn.style.display = isOwner ? 'flex' : 'none';
    const botBtn = document.getElementById('addBotBtn');
    if(botBtn) botBtn.style.display = isOwner ? 'flex' : 'none';
    if(state.showAdmin) renderAdminPanelDOM();
  }

  window.TI = {
    goStart, toggleHelp, toggleAccounts, toggleAudio, goSetup, changePlayers, updateName, setMode, setClueLevel, toggleTeamMode,
    beginReveal, revealHandoffTap, revealCardTap, revealNext,
    goToGame, roundHandoffTap, bigButtonTap, nextPlayerTap, skipTurn,
    toggleReveal, nextRound,
    goPractice, practiceBigButtonTap, practiceRestart,
    signInWithGoogle, signOut, saveProfile,
    goOnlineHome, goOnlineCreate, updateCreateField, changeCreateMax, submitCreateRoom,
    joinPublicRoom, goOnlineJoinPrivate, updateJoinField, submitJoinPrivate,
    exitOnlineToMenu, startOnlineGame, toggleCloseRoomConfirm, confirmCloseRoom,
    toggleDeleteRoomConfirm, confirmDeleteRoom, kickPlayer, addBot,
    goToOnlineRound, onlineBigButtonTap, onlineSkipTurn, goToOnlineWaiting, startOnlineVoting, castOnlineVote, playAgainOnline,
    toggleChat, updateChatInput, sendChatMessage,
    toggleAdmin, updateAdminField, runAdminCommand
  };

  document.getElementById('versionTag').textContent = GAME_VERSION;

  // Force-refresh if the WebView is serving a stale cached copy.
  // version.json is tiny and fetched with cache disabled, so it's always fresh —
  // if it doesn't match the version baked into this loaded page, reload with a cache-buster.
  try {
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(r => r.json())
      .then(data => {
        if(data && data.version && data.version !== GAME_VERSION){
          const url = new URL(location.href);
          url.searchParams.set('v', Date.now());
          location.replace(url.toString());
        }
      })
      .catch(() => {});
  } catch(e){}

  loadSoundPref();
  const initBtn = document.getElementById('audioToggle');
  initBtn.textContent = state.soundEnabled ? '🔊' : '🔇';
  initBtn.classList.toggle('active', state.soundEnabled);

  // Avoid the load glitch: wait briefly for Firebase auth to settle before first paint.
  // If auth never fires (or Firebase is disabled), still show the UI after a short timeout.
  if(fbReady && !state.authSettled){
    setTimeout(() => {
      if(!state.authSettled){
        state.authSettled = true;
        render();
      }
    }, 400);
  } else {
    render();
  }
})();
</script>
</body>
</html>
