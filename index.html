<style>
  :root{
    --bg: #0a0d0b;
    --panel: #12160f0f, #131813;
    --panel-solid: #12160f;
    --line: #263028;
    --ink: #e8ede6;
    --muted: #7c8a7c;
    --green: #4dff9c;
    --green-dim: #2c6b48;
    --red: #ff5a5a;
    --amber: #ffb84d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background: radial-gradient(1200px 600px at 50% -10%, #10160f 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:'Barlow Condensed', sans-serif;
    display:flex;
    align-items:stretch;
    justify-content:center;
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
  }
  #app{
    width:100%;
    max-width:520px;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    min-height:100dvh;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    position:relative;
  }
  #app::before{
    content:"";
    position:fixed; inset:0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
    z-index:0;
  }
  .screen{
    position:relative;
    z-index:1;
    flex:1;
    display:flex;
    flex-direction:column;
  }
  .screen.anim{
    animation: fadein .35s ease both;
  }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important; transition-duration:.001s !important;}
  }

  .eyebrow{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--green);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow::before{
    content:"";
    width:6px; height:6px;
    background:var(--green);
    box-shadow:0 0 8px var(--green);
    border-radius:1px;
    flex:none;
  }

  h1{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    letter-spacing:.02em;
    text-transform:uppercase;
    margin: 10px 0 4px;
    line-height:.95;
  }
  .title-main{ font-size: clamp(44px, 13vw, 64px); }
  p.sub{ color:var(--muted); font-size:16px; line-height:1.4; margin:0 0 0; }

  .spacer{flex:1;}

  .btn{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    font-size:19px;
    border-radius:6px;
    border:2px solid var(--green);
    background:transparent;
    color:var(--green);
    padding:14px 20px;
    width:100%;
    cursor:pointer;
    transition: transform .12s ease, background .15s ease, color .15s ease;
    -webkit-user-select:none; user-select:none;
  }
  .btn:active{ transform:scale(.97); }
  .btn:focus-visible{ outline:2px solid var(--green); outline-offset:3px; }
  .btn.solid{ background:var(--green); color:#04140a; }
  .btn.ghost{ border-color:var(--line); color:var(--muted); }
  .btn.danger{ border-color:var(--red); color:var(--red); }
  .btn[disabled]{ opacity:.35; pointer-events:none; }

  .card{
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:12px;
  }

  .stepper{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    margin: 12px 0;
  }
  .stepper button{
    width:48px; height:48px;
    border-radius:50%;
    border:2px solid var(--green);
    background:transparent;
    color:var(--green);
    font-size:24px;
    font-family:'Space Mono', monospace;
    cursor:pointer;
  }
  .stepper button:active{ background:rgba(77,255,156,.12); }
  .stepper button[disabled]{ opacity:.3; pointer-events:none; }
  .stepper .count{
    font-family:'Space Mono', monospace;
    font-size:44px;
    min-width:60px;
    text-align:center;
  }

  .names-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:8px;
    max-height: 180px;
    overflow-y: auto;
    padding-right:4px;
  }
  .input-field{
    background: rgba(0,0,0,0.4);
    border:1px solid var(--line);
    border-radius:6px;
    color:var(--ink);
    font-family:'Barlow Condensed', sans-serif;
    font-size:16px;
    padding:8px 12px;
    width:100%;
    outline:none;
  }
  .input-field:focus{ border-color:var(--green); }

  .mode-selector, .option-toggle{
    display:flex;
    gap:8px;
    margin-top:6px;

  .chip-btn{
    flex:1;
    padding:8px;
    border:1px solid var(--line);
    border-radius:6px;
    background:transparent;
    color:var(--muted);
    font-family:'Space Mono', monospace;
    font-size:11px;
    text-transform:uppercase;
    cursor:pointer;
  }
  .chip-btn.active{
    border-color:var(--green);
    color:var(--green);
    background:rgba(77,255,156,0.08);
  }

  .handoff-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:6px;
  }
  .player-num{
    font-family:'Space Mono', monospace;
    font-size:14px;
    color:var(--muted);
    letter-spacing:.2em;
    text-transform:uppercase;
  }
  .player-name{
    font-size: clamp(36px, 12vw, 60px);
    font-weight:700;
    text-transform:uppercase;
    line-height:1;
    margin: 4px 0 24px;
    color:var(--green);
  }
  .hand-icon{ font-size:44px; opacity:.85; margin-bottom:8px; }

  .reveal-box{
    position:relative;
    border:1px solid var(--line);
    border-radius:10px;
    padding: 30px 20px;
    text-align:center;
    overflow:hidden;
    cursor:pointer;
    background: rgba(255,255,255,0.02);
    width:100%;
  }
  .reveal-box .bar{
    position:absolute; inset:0;
    background: repeating-linear-gradient(135deg, #1a1f1a 0px, #1a1f1a 10px, #14180f 10px, #14180f 20px);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Mono', monospace;
    letter-spacing:.2em;
    color:#5a6a5a;
    transition: transform .5s cubic-bezier(.7,0,.2,1), opacity .4s ease;
    z-index:2;
  }
  .reveal-box.open .bar{
    transform: translateX(105%);
    opacity:0;
  }
  .reveal-inner{ position:relative; z-index:1; }
  .role-label{
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:10px;
  }
  .target-time{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size: clamp(48px, 15vw, 72px);
    color:var(--green);
    text-shadow: 0 0 24px rgba(77,255,156,.35);
    letter-spacing:.02em;
  }
  .imposter-text{
    font-size: clamp(28px, 8vw, 38px);
    font-weight:700;
    text-transform:uppercase;
    color:var(--red);
    text-shadow: 0 0 18px rgba(255,90,90,.3);
    line-height:1.05;
  }
  .clue-badge{
    display:inline-block;
    margin-top:10px;
    padding:4px 10px;
    background:rgba(255,184,77,0.1);
    border:1px solid var(--amber);
    color:var(--amber);
    border-radius:4px;
    font-family:'Space Mono', monospace;
    font-size:12px;
  }
  .helper-note{
    margin-top:14px;
    font-size:14px;
    color:var(--muted);
    line-height:1.4;
  }

  .round-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 24px;
  }
  .timer-display{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size: clamp(56px, 17vw, 84px);
    color:var(--ink);
    letter-spacing:.02em;
  }
  .timer-display.hidden-val{
    color:#3a463c;
    animation: blink 1.1s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .timer-display.revealed{ color:var(--green); text-shadow:0 0 26px rgba(77,255,156,.35); }

  .big-btn{
    width: min(200px, 55vw);
    height: min(200px, 55vw);
    border-radius:50%;
    border:3px solid var(--green);
    background: radial-gradient(circle at 35% 30%, rgba(77,255,156,.18), transparent 70%);
    color:var(--green);
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    font-size:22px;
    cursor:pointer;
    transition: transform .12s ease, box-shadow .2s ease;
    box-shadow: 0 0 0 rgba(77,255,156,0);
  }
  .big-btn.running{
    border-color:var(--red);
    color:var(--red);
    background: radial-gradient(circle at 35% 30%, rgba(255,90,90,.18), transparent 70%);
    box-shadow: 0 0 40px rgba(255,90,90,.15);
  }
  .big-btn:active{ transform:scale(.95); }

  .round-progress{
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--muted);
    letter-spacing:.18em;
  }

  .scoreboard{
    display:flex;
    justify-content:space-around;
    background:rgba(255,255,255,0.02);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px;
    margin-bottom:14px;
    font-family:'Space Mono', monospace;
    font-size:12px;
    text-align:center;
  }
  .score-val{ font-size:18px; font-weight:700; color:var(--green); }

  .results-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin: 12px 0;
    max-height: 220px;
    overflow-y: auto;
  }
  .result-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 14px;
    background:rgba(255,255,255,0.02);
  }
  .result-row.imposter-row{
    border-color:var(--red);
    background:rgba(255,90,90,.06);
  }
  .result-row.crew-row{
    border-color:var(--green);
    background:rgba(77,255,156,.06);
  }
  .result-row .rname{
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.04em;
    font-size:16px;
  }
  .result-row .rtag{
    font-family:'Space Mono', monospace;
    font-size:10px;
    color:var(--red);
    letter-spacing:.15em;
    display:block;
  }
  .result-row .rtime{
    font-family:'Space Mono', monospace;
    font-size:20px;
    font-weight:700;
  }
  .target-banner{
    text-align:center;
    padding: 12px;
    border:1px dashed var(--green);
    border-radius:8px;
    margin-bottom:12px;
  }
  .target-banner .tval{
    font-family:'Space Mono', monospace;
    font-size:30px;
    color:var(--green);
    font-weight:700;
  }
  .winner-banner{
    text-align:center;
    padding: 14px;
    border-radius:8px;
    margin-bottom:12px;
    font-family:'Barlow Condensed', sans-serif;
    text-transform: uppercase;
    font-weight: 700;
    font-size: 24px;
    letter-spacing: .05em;
  }
  .winner-banner.imposter{ background:rgba(255,90,90,.15); color:var(--red); border:2px solid var(--red); }
  .winner-banner.crew{ background:rgba(77,255,156,.15); color:var(--green); border:2px solid var(--green); }
  .error-banner{
    background: rgba(255,90,90,.12);
    border: 1px solid var(--red);
    color: var(--red);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    margin-bottom: 12px;
  }

  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(10, 13, 11, 0.92);
    backdrop-filter: blur(6px);
    z-index:10;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    animation: fadein .25s ease both;
  }
  .modal-card{
    background: var(--panel-solid);
    border:1px solid var(--line);
    border-radius:12px;
    padding:24px;
    width:100%; max-width:460px;
    max-height:85vh; overflow-y:auto;
  }
  .modal-title{ font-size:28px; margin:6px 0 16px; }
  .help-step{ display:flex; gap:14px; margin-bottom:16px; }
  .help-num{
    font-family:'Space Mono', monospace; font-size:14px; font-weight:700;
    color:var(--green); background:rgba(77,255,156,0.1); border:1px solid var(--green-dim);
    width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none;
  }
  .help-body{ font-size:15px; color:var(--ink); line-height:1.45; }
  .help-body strong{ color:var(--green); }

  .audio-btn{
    position:fixed;
    top: max(14px, env(safe-area-inset-top));
    right:14px;
    z-index:5;
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    border-radius:50%;
    width:36px; height:36px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
  }
  .audio-btn.active{ border-color:var(--green); color:var(--green); }

  .chat-btn{
    position:fixed;
    top: max(14px, env(safe-area-inset-top));
    left:14px;
    z-index:5;
    background:transparent;
    border:1px solid var(--green);
    color:var(--green);
    border-radius:50%;
    width:36px; height:36px;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:16px;
  }
  .chat-panel{
    position:fixed; inset:0;
    background:rgba(10, 13, 11, 0.96);
    backdrop-filter: blur(6px);
    z-index:20;
    display:flex; flex-direction:column;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  .chat-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .chat-messages{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:6px 0; }
  .chat-msg{ max-width:80%; }
  .chat-msg.mine{ align-self:flex-end; text-align:right; }
  .chat-msg-name{ font-family:'Space Mono',monospace; font-size:10px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; }
  .chat-msg-bubble{ background:rgba(255,255,255,0.05); border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-top:2px; font-size:15px; }
  .chat-msg.mine .chat-msg-bubble{ background:rgba(77,255,156,0.1); border-color:var(--green-dim); }
  .chat-input-row{ display:flex; gap:8px; margin-top:10px; }
  .chat-input-row .input-field{ flex:1; }

  .row-gap > * + *{ margin-top:10px; }

  .corner-credit{
    position:fixed; bottom: max(10px, env(safe-area-inset-bottom)); left:14px;
    font-family:'Space Mono', monospace; font-size:12px; letter-spacing:.12em;
    text-transform:uppercase; color:#5c6b5e; z-index:5; pointer-events:none;
  }
  .corner-version{
    position:fixed; bottom: max(10px, env(safe-area-inset-bottom)); right:14px;
    font-family:'Space Mono', monospace; font-size:12px; letter-spacing:.12em;
    color:#5c6b5e; z-index:5; pointer-events:none;
  }

</style>
</head>

<script>
const GAME_VERSION = "v26";
const OWNER_EMAIL = "kobik8512@gmail.com";

const firebaseConfig = {
  apiKey: "AIzaSyA_dIpy_Nu9F_gTIJ_P6w4yysCgabusLFw",
  authDomain: "timer-imposter.firebaseapp.com",
  projectId: "timer-imposter",
  storageBucket: "timer-imposter.firebasestorage.app",
  messagingSenderId: "173473961509",
  appId: "1:173473961509:web:03040fa242a3e6006f51cc"
};

let fbApp = null, fbAuth = null, fbDb = null, fbReady = false;

(function(){
  const state = {
    screen: 'start',
    showHelp: false,
    showAccounts: false,
    currentUser: null,
    signInBlocked: false,
    roomCode: null,
    isHost: false,
    onlineUnsub: null,
    onlinePlayersUnsub: null,
    publicRoomsUnsub: null,
    publicRooms: [],
    onlinePlayers: [],
    onlineStatus: null,
    onlineSecret: null,
    onlineImposterUid: null,
    onlineTargetMs: null,
    onlineRoundPhase: 'ready', // local only for the active player: 'ready' | 'running' | 'stopped'
    onlineTurnOrder: [],
    onlineCurrentTurnIndex: 0,
    onlineTurnSecondsLeft: null,
    onlineLastTimerIndex: -1,
    onlineTurnPhase: 'play', // shared from room: 'play' | 'review'
    onlineReviewEndsAt: null,
    onlineReviewSecondsLeft: null,
    showChat: false,
    showCloseRoomConfirm: false,
    showDeleteRoomConfirm: false,
    pendingDeleteCode: null,
    chatMessages: [],
    chatUnsub: null,
    chatInput: '',
    onlineMaxPlayers: 5,
    onlineVotedFor: null,
    onlineCrewWins: false,
    onlineSuspectedUid: null,
    onlineError: null,
    createRoomIsPrivate: false,
    createRoomName: '',
    createRoomPassword: '',
    createRoomMaxPlayers: 5,
    joinRoomName: '',
    joinRoomPassword: '',
    soundEnabled: true,
    numPlayers: 3,
    playerNames: ['Player 1', 'Player 2', 'Player 3'],
    mode: 'standard',
    enableClues: true,
    imposterIndex: null,
    targetMs: null,
    imposterClue: '',
    revealIndex: 0,
    revealPhase: 'handoff',
    playerOrder: [],
    roundIndex: 0,
    roundPhase: 'handoff',
    roundStart: null,
    times: [],
    resultsRevealed: false,
    matchRound: 1,
    scores: [],
    practicePhase: 'ready', // 'ready' | 'running' | 'stopped'
    practiceStart: null,
    practiceElapsed: null,
    lastScreen: null,
    authSettled: false,
    editName: '',
    editUsername: '',
    profileError: null,
    showAdmin: false,
    adminCmd: '',
    adminTarget: '',
    adminError: null,
    adminSuccess: null,
    isMuted: false
  };

  try {
    if(firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf('PASTE_') !== 0){
      fbApp = firebase.initializeApp(firebaseConfig);
      fbAuth = firebase.auth();
      fbDb = firebase.firestore();
      fbReady = true;

      fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

      fbAuth.onAuthStateChanged(user => {
        if (user) {
          state.currentUser = {
            uid: user.uid,
            name: user.displayName || 'Player',
            photoURL: user.photoURL || '',
            email: (user.email || '').toLowerCase(),
            isOwner: (user.email || '').toLowerCase() === OWNER_EMAIL
          };
          loadSavedProfile();
          ensureUserDoc().catch(() => {});
        } else {
          state.currentUser = null;
        }
        state.authSettled = true;
        render();
      });

      fbAuth.getRedirectResult().then(result => {
        if (result && result.user) {
          const u = result.user;
          state.currentUser = {
            uid: u.uid,
            name: u.displayName || 'Player',
            photoURL: u.photoURL || '',
            email: (u.email || '').toLowerCase(),
            isOwner: (u.email || '').toLowerCase() === OWNER_EMAIL
          };
          state.authSettled = true;
          render();
        }
      }).catch(err => console.warn('Redirect auth result error:', err));
    } else {
      state.authSettled = true;
    }
  } catch(e){ console.warn('Firebase init failed:', e); state.authSettled = true; }

  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let ctx = null;
  let turnTimerInterval = null;
  let reviewInterval = null;
  const TURN_TIME_LIMIT = 20; // seconds the player has to start/stop before auto-skip
  const REVIEW_SECONDS = 10;  // seconds everyone can look at the score before next turn

  function clearTurnTimer(){
    if(turnTimerInterval){ clearInterval(turnTimerInterval); turnTimerInterval = null; }
    state.onlineTurnSecondsLeft = null;
  }
  function startTurnTimer(){
    clearTurnTimer();
    state.onlineTurnSecondsLeft = TURN_TIME_LIMIT;
    turnTimerInterval = setInterval(() => {
      state.onlineTurnSecondsLeft--;
      if(state.onlineTurnSecondsLeft <= 0){
        clearTurnTimer();
        onlineSkipTurn();
      } else {
        render();
      }
    }, 1000);

  function clearReviewTimer(){
    if(reviewInterval){ clearInterval(reviewInterval); reviewInterval = null; }
    state.onlineReviewSecondsLeft = null;
  }
  function startReviewTimer(endsAt){
    clearReviewTimer();
    function tick(){
      const left = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
      state.onlineReviewSecondsLeft = left;
      if(left <= 0){
        clearReviewTimer();
        // The player who just finished (or host) advances to the next turn
        advanceToNextTurn();
      } else {
        render();
      }
    }
    tick();
    reviewInterval = setInterval(tick, 250);
  }


  function playSFX(type){
    if(!state.soundEnabled) return;
    try {
      if(!ctx) ctx = new AudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      const now = ctx.currentTime;
      if(type === 'click'){
        osc.frequency.setValueAtTime(400, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
      } else if(type === 'start'){
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if(type === 'stop'){
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(440, now + 0.12);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
      } else if(type === 'reveal'){
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(300, now + 0.3);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      }
    } catch(e){}
  }

  function vibrate(ms){ if(navigator.vibrate){ try{ navigator.vibrate(ms); }catch(e){} } }

  function shuffledOrder(n){
    const arr = Array.from({length:n}, (_,i)=>i);
    for(let i=arr.length-1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  function pad2(n){ return n.toString().padStart(2,'0'); }
  function formatTime(ms){
    const totalCenti = Math.round(ms/10);
    const sec = Math.min(99, Math.floor(totalCenti/100));
    const centi = totalCenti % 100;
    return pad2(sec) + ':' + pad2(centi);
  }

  function generateTargetAndClue(){
    let minS = 1, maxS = 9;
    if(state.mode === 'fast'){ minS = 0.5; maxS = 3; }
    if(state.mode === 'marathon'){ minS = 10; maxS = 20; }

    const centi = Math.floor(Math.random() * (maxS * 100 - minS * 100 + 1)) + (minS * 100);
    state.targetMs = centi * 10;

    const totalSec = state.targetMs / 1000;
    const lower = Math.max(0, Math.floor(totalSec - (Math.random() * 1.5 + 0.5)));
    const upper = Math.ceil(totalSec + (Math.random() * 1.5 + 0.5));
    state.imposterClue = `Target is between ${lower}s and ${upper}s`;
  }

  function validateName(name){
    // Letters, numbers, underscores only (Roblox/Discord style)
    return /^[A-Za-z0-9_]{3,20}$/.test(name);

  function validateUsername(username){

  }

  function daysLeft(ts){
    if(!ts) return 0;
    const ms = 7 * 24 * 60 * 60 * 1000;
    const left = (ts + ms) - Date.now();
    return left > 0 ? Math.ceil(left / (24 * 60 * 60 * 1000)) : 0;
  }

  async function ensureUserDoc(){
    if(!fbReady || !state.currentUser) return null;
    const uref = fbDb.collection('users').doc(state.currentUser.uid);
    const snap = await uref.get();
    if(!snap.exists){
      await uref.set({
        name: state.currentUser.name,
        username: null,
        email: state.currentUser.email || null,
        isOwner: !!state.currentUser.isOwner,
        nameChangedAt: null,
        usernameChangedAt: null,
        mutedUntil: null,
        banned: false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      return { name: state.currentUser.name, username: null, nameChangedAt: null, usernameChangedAt: null, mutedUntil: null, banned: false };
    }
    const data = snap.data();
    if(data.banned){
      await fbAuth.signOut();
      state.currentUser = null;
      state.onlineError = 'You are banned from Timer Imposter.';
      state.screen = 'start';
      render();
      return null;
    }
    if(data.name) state.currentUser.name = data.name;
    if(data.username) state.currentUser.username = data.username;
    state.currentUser.mutedUntil = data.mutedUntil || null;
    state.isMuted = data.mutedUntil && data.mutedUntil > Date.now();
    return data;
  }

  function saveProfile(){
    if(!state.currentUser || !fbReady) return;
    playSFX('click');
    const nameInput = document.getElementById('profileNameInput');
    const usernameInput = document.getElementById('profileUsernameInput');
    const photoInput = document.getElementById('profilePhotoInput');
    let newName = (nameInput ? nameInput.value : '').trim();
    let newUsername = (usernameInput ? usernameInput.value : '').trim().toLowerCase();
    let newPhoto = (photoInput ? photoInput.value : '').trim();

    state.profileError = null;

    if(newName && !validateName(newName)){
      state.profileError = 'Name: 3-20 chars, letters, numbers, underscores only.';
      render();
      return;
    }
    if(newUsername && !validateUsername(newUsername)){
      state.profileError = 'Username: 3-20 chars, letters, numbers, underscores only.';
      render();
      return;
    }
    if(newPhoto && !/^https?:\/\/.+/i.test(newPhoto)){
      state.profileError = 'Photo URL must start with http:// or https://';
      render();
      return;
    }

    ensureUserDoc().then(async (udata) => {
      if(!udata) return;
      const updates = {};
      const nameCooldown = daysLeft(udata.nameChangedAt);
      const userCooldown = daysLeft(udata.usernameChangedAt);

      if(newName && newName !== (udata.name || state.currentUser.name)){
        if(nameCooldown > 0){
          state.profileError = `You can change your name again in ${nameCooldown} day(s).`;
          render();
          return;
        }
        updates.name = newName;
        updates.nameChangedAt = Date.now();
      }

      if(newUsername && newUsername !== (udata.username || '')){
        if(userCooldown > 0){
          state.profileError = `You can change your username again in ${userCooldown} day(s).`;
          render();
          return;
        }
        // Unique username check
        const unameRef = fbDb.collection('usernames').doc(newUsername);
        const taken = await unameRef.get();
        if(taken.exists && taken.data().uid !== state.currentUser.uid){
          state.profileError = 'That username is already taken.';
          render();
          return;
        }
        // Free old username
        if(udata.username){
          await fbDb.collection('usernames').doc(udata.username).delete().catch(()=>{});
        }
        await unameRef.set({ uid: state.currentUser.uid, claimedAt: firebase.firestore.FieldValue.serverTimestamp() });
        updates.username = newUsername;
        updates.usernameChangedAt = Date.now();
      }

      if(newPhoto !== undefined){
        updates.photoURL = newPhoto || null;
      }

      if(Object.keys(updates).length === 0){
        state.profileError = 'No changes to save.';
        render();
        return;
      }

      await fbDb.collection('users').doc(state.currentUser.uid).set(updates, { merge: true });
      if(updates.name) state.currentUser.name = updates.name;
      if(updates.username) state.currentUser.username = updates.username;
      if(updates.photoURL !== undefined) state.currentUser.photoURL = updates.photoURL || '';

      if(state.roomCode){
        const pUpdates = {};
        if(updates.name) pUpdates.name = updates.name;
        if(updates.photoURL !== undefined) pUpdates.photoURL = updates.photoURL || '';
        if(updates.username) pUpdates.username = updates.username;
        if(Object.keys(pUpdates).length){
          await fbDb.collection('rooms').doc(state.roomCode).collection('players').doc(state.currentUser.uid).update(pUpdates);
        }
      }

      state.profileError = null;
      state.showAccounts = false;
      render();
    }).catch(err => {
      state.profileError = err.message || 'Could not save profile.';
      render();
    });
  }

  function toggleReveal(){
    playSFX('reveal');
    state.resultsRevealed = true;

    let bestDiff = Infinity;
    let winnerIdx = null;

    state.playerNames.forEach((_, i) => {
      if(i !== state.imposterIndex && state.times[i] !== undefined && state.times[i] !== 'SKIP'){
        const diff = Math.abs(state.times[i] - state.targetMs);
        if(diff < bestDiff){
          bestDiff = diff;
          winnerIdx = i;
        }
      }
    });

    if(winnerIdx !== null){
      const pts = 1;
      state.scores[winnerIdx] = (state.scores[winnerIdx] || 0) + pts;

    render();

  function submitCreateRoom(){
    if(!fbReady || !state.currentUser) return;
    playSFX('click');
    const isPrivate = state.createRoomIsPrivate;
    const roomName = (state.createRoomName || '').trim() || (isPrivate ? 'Private Room' : `${state.currentUser.name}'s Room`);
    const password = (state.createRoomPassword || '').trim();
    if(isPrivate && !password){
      state.onlineError = 'Private rooms need a password.';
      render();
      return;
    }

    const code = genRoomCode();
    state.roomCode = code;
    state.isHost = true;

    fbDb.collection('rooms').where('hostUid', '==', state.currentUser.uid).get()
      .then(snap => {
        const batch = fbDb.batch();
        snap.forEach(doc => { if(doc.data().status === 'waiting') batch.delete(doc.ref); });
        return snap.empty ? Promise.resolve() : batch.commit();
      })
      .then(() => fbDb.collection('rooms').doc(code).set({
      hostUid: state.currentUser.uid,
      roomName: roomName,
      isPrivate: isPrivate,
      password: isPrivate ? password : null,
      status: 'waiting',
      maxPlayers: state.createRoomMaxPlayers,
      mode: state.mode || 'standard',
      enableClues: state.enableClues !== false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => {
      return fbDb.collection('rooms').doc(code).collection('players').doc(state.currentUser.uid).set({
        name: state.currentUser.name,
        photoURL: state.currentUser.photoURL || '',
        isOwner: !!state.currentUser.isOwner,
        joined: firebase.firestore.FieldValue.serverTimestamp(),
        votedFor: null

  function submitJoinPrivate(){
    if(!fbReady || !state.currentUser) return;
    playSFX('click');
    const roomName = (state.joinRoomName || '').trim();
    const password = (state.joinRoomPassword || '').trim();
    if(!roomName){ state.onlineError = 'Enter the room name.'; render(); return; }

    fbDb.collection('rooms')
      .where('isPrivate', '==', true)
      .where('roomName', '==', roomName)
      .get().then(snap => {
        if(snap.empty){ state.onlineError = 'No private room found with that name.'; render(); return; }
        let matchedDoc = null;
        snap.forEach(doc => { if(doc.data().password === password) matchedDoc = doc; });
        if(!matchedDoc){ state.onlineError = 'Incorrect password.'; render(); return; }
        if(matchedDoc.data().status !== 'waiting'){ state.onlineError = 'That room has already started.'; render(); return; }
        joinRoomByCode(matchedDoc.id);

  function joinRoomByCode(code){
    const roomRef = fbDb.collection('rooms').doc(code);
    roomRef.get().then(doc => {
      if(!doc.exists){ state.onlineError = 'No room found.'; render(); return; }
      if(doc.data().status !== 'waiting'){ state.onlineError = 'That room has already started.'; render(); return; }

      return roomRef.collection('players').get().then(snap => {
          if(snap.size >= (doc.data().maxPlayers || 10)){
              state.onlineError = 'This room is full!';
              render();
              return;
          }
          state.roomCode = code;
          state.isHost = (doc.data().hostUid === state.currentUser.uid);
          state.onlineMaxPlayers = doc.data().maxPlayers || 10;
          state.onlineError = null;
          return roomRef.collection('players').doc(state.currentUser.uid).set({
            name: state.currentUser.name,
            photoURL: state.currentUser.photoURL || '',
            isOwner: !!state.currentUser.isOwner,
            joined: firebase.firestore.FieldValue.serverTimestamp(),
            votedFor: null
          }).then(() => {
            state.screen = 'onlineLobby';
            subscribeToRoom(code);
            render();
          });
      });
    }).catch(err => { state.onlineError = 'Could not join room: ' + err.message; render(); });
  }

  function subscribeToRoom(code){
    unsubscribeOnline();
    subscribeToChat(code);
    const roomRef = fbDb.collection('rooms').doc(code);

    state.onlineUnsub = roomRef.onSnapshot(doc => {
      if(!doc.exists) return;
      const data = doc.data();
      state.onlineStatus = data.status;
      state.onlineImposterUid = data.imposterUid || null;
      state.onlineTargetMs = data.targetMs || null;
      state.onlineMaxPlayers = data.maxPlayers || 10;
      state.onlineSuspectedUid = data.suspectedUid || null;
      state.onlineCrewWins = data.crewWins || false;
      state.onlineTurnOrder = data.turnOrder || [];
      state.onlineCurrentTurnIndex = data.currentTurnIndex || 0;
      state.onlineTurnPhase = data.turnPhase || 'play';
      state.onlineReviewEndsAt = data.reviewEndsAt || null;

      const myTurnNow = state.currentUser && state.onlineTurnOrder[state.onlineCurrentTurnIndex] === state.currentUser.uid;

      // Start the 20s "you must take your turn" timer only for the active player in play phase
      if(data.status === 'reveal' && data.turnPhase !== 'review' && myTurnNow && state.onlineLastTimerIndex !== state.onlineCurrentTurnIndex){
        state.onlineLastTimerIndex = state.onlineCurrentTurnIndex;
        state.onlineRoundPhase = 'ready';
        startTurnTimer();
      } else if(!myTurnNow || data.status !== 'reveal' || data.turnPhase === 'review'){
        clearTurnTimer();
      }

      // Shared 10s review countdown for everyone
      if(data.status === 'reveal' && data.turnPhase === 'review' && data.reviewEndsAt){
        startReviewTimer(data.reviewEndsAt);
      } else {
        clearReviewTimer();
      }

      if(data.status === 'reveal' && !state.onlineSecret){
        fbDb.collection('rooms').doc(code).collection('secrets').doc(state.currentUser.uid).get().then(sdoc => {
          if(sdoc.exists){ state.onlineSecret = sdoc.data(); render(); }
        });
      }
      
      if(state.screen === 'onlineLobby' && data.status === 'reveal'){
        state.screen = 'onlineReveal';
      }
      // After role reveal, everyone goes to the shared round screen
      if(data.status === 'reveal' && (state.screen === 'onlineReveal' || state.screen === 'onlineLobby')){
        // keep them on reveal until they tap Ready; then goToOnlineRound
      }
      if(data.status === 'voting' && state.screen !== 'onlineVoting' && state.screen !== 'onlineResults'){
        state.screen = 'onlineVoting';
        state.onlineVotedFor = null;
      }
      if((state.screen === 'onlineVoting' || state.screen === 'onlineWaiting') && data.status === 'revealed'){
        state.screen = 'onlineResults';
      }
      render();
    });

    state.onlinePlayersUnsub = roomRef.collection('players').onSnapshot(snap => {
      state.onlinePlayers = [];
      snap.forEach(d => state.onlinePlayers.push({ uid: d.id, ...d.data() }));

      // If we were kicked (our player doc no longer exists), leave the room
      if(state.currentUser && state.roomCode && state.onlinePlayers.length > 0){
        const stillHere = state.onlinePlayers.some(p => p.uid === state.currentUser.uid);
        if(!stillHere){
          state.onlineError = 'You were kicked from the room.';
          leaveOnlineRoom();
          state.screen = 'onlineHome';
          render();
          return;
        }
      }
      
      if(state.isHost && state.onlineStatus === 'voting'){
          const allVoted = state.onlinePlayers.every(p => p.votedFor);
          if(allVoted) tallyOnlineVotes();
      }
      render();
    });
  }

  function unsubscribeOnline(){
    if(state.onlineUnsub) state.onlineUnsub();
    if(state.onlinePlayersUnsub) state.onlinePlayersUnsub();
    if(state.publicRoomsUnsub) state.publicRoomsUnsub();
    state.onlineUnsub = null;
    state.onlinePlayersUnsub = null;
    state.publicRoomsUnsub = null;
  }

    unsubscribeChat();
    state.chatUnsub = fbDb.collection('rooms').doc(code).collection('messages')
      .orderBy('createdAt', 'asc').limitToLast(50)
      .onSnapshot(snap => {
        state.chatMessages = [];

        renderChatPanelDOM();
      }, err => { console.warn('Chat sync error:', err); state.onlineError = 'Chat error: ' + err.message; render(); });

  function updateChatInput(val){ state.chatInput = val; }
  function sendChatMessage(){

  async function runAdminCommand(){
    if(!state.currentUser || !state.currentUser.isOwner || !fbReady) return;
    playSFX('click');
    state.adminError = null;
    state.adminSuccess = null;
    const cmd = (state.adminCmd || '').trim().toLowerCase();
    const target = (state.adminTarget || '').trim();
    if(!cmd || !target){
      state.adminError = 'Enter a command and target (username or name).';
      renderAdminPanelDOM();
      return;
    }

    // Resolve target by username first, then by display name among online players / users collection
    let targetUid = null;
    let targetName = target;

    const unameSnap = await fbDb.collection('usernames').doc(target.toLowerCase()).get();
    if(unameSnap.exists){
      targetUid = unameSnap.data().uid;
    } else {
      const onlineMatch = state.onlinePlayers.find(p =>
        (p.username && p.username.toLowerCase() === target.toLowerCase()) ||
        (p.name && p.name.toLowerCase() === target.toLowerCase())
      );
      if(onlineMatch) targetUid = onlineMatch.uid;
    }

    if(!targetUid){
      // search users by name
      const q = await fbDb.collection('users').where('name', '==', target).limit(1).get();
      if(!q.empty) targetUid = q.docs[0].id;
    }

    if(!targetUid){
      state.adminError = 'User not found. Use their username or exact display name.';
      renderAdminPanelDOM();
      return;
    }

    if(targetUid === state.currentUser.uid){
      state.adminError = 'You cannot target yourself.';
      renderAdminPanelDOM();
      return;
    }

    try {
      if(cmd === 'ban'){
        await fbDb.collection('users').doc(targetUid).set({ banned: true, bannedAt: Date.now(), bannedBy: state.currentUser.uid }, { merge: true });
        if(state.roomCode){
          await fbDb.collection('rooms').doc(state.roomCode).collection('players').doc(targetUid).delete().catch(()=>{});
        }
        state.adminSuccess = 'Banned user permanently from the site.';
      } else if(cmd === 'kick'){
        if(!state.roomCode){
          state.adminError = 'Join a room first to kick someone from it.';
          renderAdminPanelDOM();
          return;
        }
        const t = state.onlinePlayers.find(p => p.uid === targetUid);
        targetName = t ? t.name : target;
        await fbDb.collection('rooms').doc(state.roomCode).collection('players').doc(targetUid).delete();
        await fbDb.collection('rooms').doc(state.roomCode).collection('messages').add({
          uid: 'system', name: 'System', text: targetName + ' was kicked by admin',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        state.adminSuccess = 'Kicked from current room.';
      } else if(cmd === 'mute'){
        const mutedUntil = Date.now() + (7 * 24 * 60 * 60 * 1000);
        await fbDb.collection('users').doc(targetUid).set({ mutedUntil: mutedUntil, mutedBy: state.currentUser.uid }, { merge: true });
        state.adminSuccess = 'Muted for 7 days (chat blocked).';
      } else {
        state.adminError = 'Unknown command. Use: ban, kick, mute';
        renderAdminPanelDOM();
        return;
      }
      renderAdminPanelDOM();
    } catch(err){
      state.adminError = err.message || 'Command failed.';
      renderAdminPanelDOM();
    }
  }

          <div class="role-label" style="margin-top:12px;">Target (username or display name)</div>

      <div class="chat-panel">

        </div>
        <div class="chat-messages" id="chatMessagesList">${msgs || '<p class="helper-note">No messages yet — say hi!</p>'}</div>
        <div class="chat-input-row">

          <button class="btn solid" style="width:auto; padding:10px 18px;" onclick="TI.sendChatMessage(); document.getElementById('chatInputField').value='';">Send</button>

  function postSystemMessage(text){

    fbDb.collection('rooms').doc(state.roomCode).collection('messages').add({

      name: 'System',

      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(() => {});

  function leaveOnlineRoom(){
    const code = state.roomCode;
    const uid = state.currentUser ? state.currentUser.uid : null;
    const name = state.currentUser ? state.currentUser.name : 'A player';

    // Remove ourselves from the room so other players see us disappear
    if(fbReady && code && uid){
      const playerRef = fbDb.collection('rooms').doc(code).collection('players').doc(uid);
      playerRef.delete().then(() => {
        // Post leave message after delete so it still goes to the room
        fbDb.collection('rooms').doc(code).collection('messages').add({
          uid: 'system',
          name: 'System',
          text: name + ' left the room',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).catch(() => {});
      }).catch(() => {});
    }

    unsubscribeOnline();
    unsubscribeChat();
    clearTurnTimer();
    clearReviewTimer();
    state.onlineLastTimerIndex = -1;
    state.roomCode = null;
    state.isHost = false;
    state.onlinePlayers = [];
    state.onlineStatus = null;
    state.onlineSecret = null;
    state.onlineImposterUid = null;
    state.onlineTargetMs = null;
    state.onlineRoundPhase = 'ready';
    state.onlineTurnPhase = 'play';
    state.onlineReviewEndsAt = null;
    state.onlineVotedFor = null;
    state.showChat = false;
    state.chatMessages = [];
    renderChatPanelDOM();
  }

  function kickPlayer(targetUid){

    playSFX('click');

    const target = state.onlinePlayers.find(p => p.uid === targetUid);

      .then(() => {

      state.showCloseRoomConfirm = false;
      leaveOnlineRoom();

  function startOnlineGame(){
    if(!state.isHost || !fbReady) return;
    if(state.onlinePlayers.length < 3){ state.onlineError = 'Need at least 3 players to start.'; render(); return; }
    playSFX('click');
    state.onlineError = null;
    const roomRef = fbDb.collection('rooms').doc(state.roomCode);
    roomRef.get().then(doc => {
      const mode = doc.data().mode || 'standard';
      const enableClues = doc.data().enableClues !== false;
      let minS = 1, maxS = 9;
      if(mode === 'fast'){ minS = 0.5; maxS = 3; }
      if(mode === 'marathon'){ minS = 10; maxS = 20; }
      const centi = Math.floor(Math.random() * (maxS*100 - minS*100 + 1)) + (minS*100);
      const targetMs = centi * 10;
      const totalSec = targetMs / 1000;
      const lower = Math.max(0, Math.floor(totalSec - (Math.random()*1.5+0.5)));
      const upper = Math.ceil(totalSec + (Math.random()*1.5+0.5));
      const clue = `Target is between ${lower}s and ${upper}s`;

      const imposterUid = state.onlinePlayers[Math.floor(Math.random()*state.onlinePlayers.length)].uid;
      const turnOrder = shuffledOrder(state.onlinePlayers.length).map(i => state.onlinePlayers[i].uid);

      const batch = fbDb.batch();
      state.onlinePlayers.forEach(p => {
        const isImp = p.uid === imposterUid;
        const secretRef = roomRef.collection('secrets').doc(p.uid);
        batch.set(secretRef, isImp
          ? { isImposter: true, clue: enableClues ? clue : null }
          : { isImposter: false, targetMs: targetMs }
        );
        batch.update(roomRef.collection('players').doc(p.uid), { time: null, submitted: false, votedFor: null });
      });
      batch.update(roomRef, {
        status: 'reveal',
        turnOrder: turnOrder,
        currentTurnIndex: 0,
        turnPhase: 'play',
        reviewEndsAt: null
      });
      roomRef.set({ _imposterUidPending: imposterUid, _targetMsPending: targetMs }, { merge: true });
      return batch.commit();
    }).catch(err => { state.onlineError = 'Could not start game: ' + err.message; render(); });
  }

  function onlineBigButtonTap(){
    const myTurn = state.onlineTurnOrder[state.onlineCurrentTurnIndex] === state.currentUser.uid;
    if(!myTurn || state.onlineTurnPhase === 'review') return;

    const roomRef = fbDb.collection('rooms').doc(state.roomCode);
    const playerRef = roomRef.collection('players').doc(state.currentUser.uid);

    if(state.onlineRoundPhase === 'ready'){
      clearTurnTimer();
      playSFX('start');
      vibrate(20);
      state.roundStart = performance.now();
      state.onlineRoundPhase = 'running';
      // Tell everyone this player has started timing
      playerRef.update({ timing: true, submitted: false }).catch(() => {});
      render();
    } else if(state.onlineRoundPhase === 'running'){
      playSFX('stop');
      vibrate([20,30,20]);
      const elapsed = performance.now() - state.roundStart;
      state.onlineRoundPhase = 'stopped';
      const reviewEndsAt = Date.now() + (REVIEW_SECONDS * 1000);

      // Optimistic local update so we don't get stuck on "Submitted! / DONE"
      state.onlineTurnPhase = 'review';
      state.onlineReviewEndsAt = reviewEndsAt;
      // Also patch local player list so the time shows immediately
      const me = state.onlinePlayers.find(p => p.uid === state.currentUser.uid);
      if(me){ me.time = elapsed; me.submitted = true; me.skipped = false; me.timing = false; }
      startReviewTimer(reviewEndsAt);

      // Save the time and switch room into shared review phase so everyone sees the score
      playerRef.update({ time: elapsed, submitted: true, skipped: false, timing: false })
        .then(() => roomRef.update({
          turnPhase: 'review',
          reviewEndsAt: reviewEndsAt
        }))
        .catch(err => {
          state.onlineError = 'Could not submit time: ' + err.message;
          render();
        });
      render();
    }
  }

  function onlineSkipTurn(){
    const myTurn = state.onlineTurnOrder[state.onlineCurrentTurnIndex] === state.currentUser.uid;
    if(!myTurn || state.onlineTurnPhase === 'review') return;
    clearTurnTimer();
    playSFX('click');
    vibrate(10);
    state.onlineRoundPhase = 'stopped';
    const roomRef = fbDb.collection('rooms').doc(state.roomCode);
    const reviewEndsAt = Date.now() + (REVIEW_SECONDS * 1000);

    // Optimistic local update
    state.onlineTurnPhase = 'review';
    state.onlineReviewEndsAt = reviewEndsAt;
    const me = state.onlinePlayers.find(p => p.uid === state.currentUser.uid);
    if(me){ me.time = null; me.submitted = true; me.skipped = true; me.timing = false; }
    startReviewTimer(reviewEndsAt);

    roomRef.collection('players').doc(state.currentUser.uid).update({ time: null, submitted: true, skipped: true, timing: false })
      .then(() => roomRef.update({
        turnPhase: 'review',
        reviewEndsAt: reviewEndsAt
      }))
      .catch(err => {
        state.onlineError = 'Could not skip: ' + err.message;
        render();
      });
    render();
  }

  // Called when the 10s review countdown finishes — advance to next player or voting
  function advanceToNextTurn(){
    if(!fbReady || !state.roomCode) return;
    // Only one client should advance (prefer the player who just played, or the host)
    const justPlayedUid = state.onlineTurnOrder[state.onlineCurrentTurnIndex];
    const iAmResponsible = (state.currentUser && state.currentUser.uid === justPlayedUid) || state.isHost;
    if(!iAmResponsible) return;

    const roomRef = fbDb.collection('rooms').doc(state.roomCode);
    const newIndex = state.onlineCurrentTurnIndex + 1;

    if(newIndex >= state.onlineTurnOrder.length){
      roomRef.update({
        currentTurnIndex: newIndex,
        status: 'voting',
        turnPhase: 'play',
        reviewEndsAt: null
      }).catch(() => {});
    } else {
      roomRef.update({
        currentTurnIndex: newIndex,
        turnPhase: 'play',
        reviewEndsAt: null
      }).catch(() => {});
    }
  }

  function goToOnlineRound(){
    playSFX('click');
    state.onlineRoundPhase = 'ready';
    state.screen = 'onlineRound';
    render();
  }

  function goToOnlineWaiting(){
    playSFX('click');
    state.screen = 'onlineWaiting';
    render();
  }

  function startOnlineVoting(){
    if(!state.isHost) return;
    playSFX('click');
    fbDb.collection('rooms').doc(state.roomCode).update({ status: 'voting' });
  }

  function castOnlineVote(targetUid){
    playSFX('click');
    state.onlineVotedFor = targetUid;
    fbDb.collection('rooms').doc(state.roomCode).collection('players').doc(state.currentUser.uid).update({ votedFor: targetUid });
    render();
  }

  function tallyOnlineVotes(){
    const roomRef = fbDb.collection('rooms').doc(state.roomCode);
    roomRef.get().then(doc => {
      const data = doc.data();
      const imposterUid = data._imposterUidPending;
      
      let voteCounts = {};
      state.onlinePlayers.forEach(p => {
        if(p.votedFor) {
           voteCounts[p.votedFor] = (voteCounts[p.votedFor] || 0) + 1;
        }
      });
      
      let mostVotes = 0;
      let suspectedUid = null;
      for(const [uid, count] of Object.entries(voteCounts)){
        if(count > mostVotes){ mostVotes = count; suspectedUid = uid; }
      }
      
      const crewWins = suspectedUid === imposterUid;
      
      roomRef.update({
        status: 'revealed',
        imposterUid: imposterUid,
        targetMs: data._targetMsPending,
        suspectedUid: suspectedUid,
        crewWins: crewWins
      });
    });
  }

  function playAgainOnline(){
    if(!state.isHost) return;
    playSFX('click');
    clearTurnTimer();
    clearReviewTimer();
    state.onlineSecret = null;
    state.onlineRoundPhase = 'ready';
    state.onlineTurnPhase = 'play';
    state.onlineVotedFor = null;
    state.onlineLastTimerIndex = -1;
    const roomRef = fbDb.collection('rooms').doc(state.roomCode);
    roomRef.update({ 
        status: 'waiting', 
        imposterUid: firebase.firestore.FieldValue.delete(), 
        targetMs: firebase.firestore.FieldValue.delete(),
        suspectedUid: firebase.firestore.FieldValue.delete(),
        crewWins: firebase.firestore.FieldValue.delete(),
        turnPhase: 'play',
        reviewEndsAt: null,
        currentTurnIndex: 0,
        turnOrder: firebase.firestore.FieldValue.delete()
    });
    
    state.onlinePlayers.forEach(p => {
        roomRef.collection('players').doc(p.uid).update({ votedFor: null, submitted: false, time: null, timing: false, skipped: false });
    });
    
    state.screen = 'onlineLobby';
    render();
  }

          <div class="role-label" style="margin-top:12px;">Max Players (${state.createRoomMaxPlayers})</div>
          <div class="stepper">
            <button ${state.createRoomMaxPlayers<=3?'disabled':''} onclick="TI.changeCreateMax(-1)">–</button>
            <div class="count" style="font-size:32px;">${state.createRoomMaxPlayers}</div>
            <button ${state.createRoomMaxPlayers>=10?'disabled':''} onclick="TI.changeCreateMax(1)">+</button>
          </div>
        </div>
        <div class="spacer"></div>
        <div class="row-gap">
          <button class="btn solid" onclick="TI.submitCreateRoom()">Create Room</button>
          <button class="btn ghost" onclick="TI.goOnlineHome()">Back</button>
        </div>
      </div>`;
  }

  function renderOnlineJoinPrivate(){
    return `
      <div class="screen">
        <div class="eyebrow">Join Private Room</div>
        <h1 style="font-size:clamp(26px,7vw,32px); margin-top:6px;">Enter Details</h1>
        ${renderErrorBanner()}
        <div class="card">
          <div class="role-label">Room Name</div>
          <input class="input-field" type="text" value="${state.joinRoomName}" placeholder="Room name" onchange="TI.updateJoinField('Name', this.value)" />
          <div class="role-label" style="margin-top:12px;">Password</div>
          <input class="input-field" type="text" value="${state.joinRoomPassword}" placeholder="Room password" onchange="TI.updateJoinField('Password', this.value)" />
        </div>
        <div class="spacer"></div>
        <div class="row-gap">
          <button class="btn solid" onclick="TI.submitJoinPrivate()">Join Room</button>
          <button class="btn ghost" onclick="TI.goOnlineHome()">Back</button>
        </div>
      </div>`;
  }

  function renderCloseRoomModal(){
    if(!state.showCloseRoomConfirm) return '';
    return `
      <div class="modal-overlay" onclick="TI.toggleCloseRoomConfirm(false)">
        <div class="modal-card" onclick="event.stopPropagation()">
          <div class="eyebrow">Close Room</div>
          <h2 class="modal-title">CLOSE THIS ROOM?</h2>
          <p class="help-body">This removes the room for everyone in it and can't be undone. Only the host can do this.</p>
          <button class="btn danger" style="margin-top:16px;" onclick="TI.confirmCloseRoom()">Yes, Close Room</button>
          <button class="btn ghost" style="margin-top:10px;" onclick="TI.toggleCloseRoomConfirm(false)">Cancel</button>
        </div>
      </div>`;
  }

  function renderDeleteRoomModal(){
    if(!state.showDeleteRoomConfirm) return '';
    return `
      <div class="modal-overlay" onclick="TI.toggleDeleteRoomConfirm(null)">
        <div class="modal-card" onclick="event.stopPropagation()">
          <div class="eyebrow">Delete Room</div>
          <h2 class="modal-title">DELETE THIS ROOM?</h2>
          <p class="help-body">This permanently removes the room and kicks everyone in it. This can't be undone.</p>
          <button class="btn danger" style="margin-top:16px;" onclick="TI.confirmDeleteRoom()">Yes, Delete Room</button>
          <button class="btn ghost" style="margin-top:10px;" onclick="TI.toggleDeleteRoomConfirm(null)">Cancel</button>
        </div>
      </div>`;
  }

  function renderOnlineLobby(){
    const boxes = state.onlinePlayers.map(p => {
      const isMe = state.currentUser && p.uid === state.currentUser.uid;
      const canKick = state.isHost && !isMe;
      return `
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px; width:90px; position:relative;">
        ${avatarHtml(p, 52)}
        <div style="font-size:12px; text-align:center; color:var(--ink); word-break:break-word;">${formatPlayerName(p)}${isMe ? ' (you)' : ''}</div>
        ${canKick ? `<button onclick="TI.kickPlayer('${p.uid}')" style="margin-top:2px; background:transparent; border:1px solid var(--red); color:var(--red); border-radius:4px; font-size:10px; padding:2px 8px; cursor:pointer; font-family:'Space Mono',monospace; letter-spacing:.05em; text-transform:uppercase;">Kick</button>` : ''}
      </div>`;
    }).join('');
    return `
      <div class="screen">
        <div class="eyebrow" style="display:flex; justify-content:space-between; align-items:center;">
          <span>Room Lobby // Max: ${state.onlineMaxPlayers} Players</span>
          ${state.isHost ? `<button onclick="TI.toggleCloseRoomConfirm(true)" style="background:transparent; border:1px solid var(--red); color:var(--red); border-radius:50%; width:26px; height:26px; font-size:14px; cursor:pointer; flex:none;">✕</button>` : ''}
        </div>
        <h1 style="font-size:clamp(28px,7vw,34px); margin-top:6px;">Code: ${state.roomCode}</h1>
        <p class="sub">Waiting for players to join. Need at least 3 players.</p>
        <div style="display:flex; flex-wrap:wrap; gap:14px; padding:14px 0;">${boxes}</div>
        <div class="spacer"></div>
        <div class="row-gap">
          ${state.isHost ? `<button class="btn solid" onclick="TI.startOnlineGame()">Start Game (${state.onlinePlayers.length} joined)</button>` : `<p class="helper-note">Waiting for the host to start the game...</p>`}
          <button class="btn ghost" onclick="TI.exitOnlineToMenu()">Leave Room</button>
        </div>
      </div>
      ${renderCloseRoomModal()}`;
  }

  function renderOnlineReveal(){
    if(!state.onlineSecret){
      return `<div class="screen"><div class="handoff-wrap"><p class="helper-note">Loading your role...</p></div></div>`;
    }
    const isImposter = state.onlineSecret.isImposter;
    return `
      <div class="screen">
        <div class="handoff-wrap">
          <div class="eyebrow">Eyes Only</div>
          <div class="reveal-box open">
            <div class="bar">TAP TO DECLASSIFY</div>
            <div class="reveal-inner">
              ${isImposter
                ? `<div class="role-label">Role</div><div class="imposter-text">You are<br>the Imposter</div>
                   ${state.onlineSecret.clue ? `<div class="clue-badge">💡 Clue: ${state.onlineSecret.clue}</div>` : ''}`
                : `<div class="role-label">Target Time</div><div class="target-time">${formatTime(state.onlineSecret.targetMs)}</div>`
              }
            </div>
          </div>
          <div style="width:100%; margin-top:22px;">
            <button class="btn solid" onclick="TI.goToOnlineRound()">Ready — Start My Attempt</button>
          </div>
        </div>
      </div>`;
  }

  function renderLiveTimesList(){
    const done = state.onlinePlayers.filter(p => p.submitted);
    if(done.length === 0) return '';
    const rows = done.map(p => `
      <div class="result-row">
        <div style="display:flex; align-items:center; gap:8px;">${avatarHtml(p, 28)}<span class="rname">${formatPlayerName(p)}</span></div>
        <div class="rtime">${p.skipped ? 'SKIPPED' : formatTime(p.time)}</div>
      </div>
    `).join('');
    return `<div class="role-label" style="margin-top:16px;">Results So Far</div><div class="results-list">${rows}</div>`;
  }

  function renderOnlineRound(){
    const currentUid = state.onlineTurnOrder[state.onlineCurrentTurnIndex];
    const currentPlayer = state.onlinePlayers.find(p => p.uid === currentUid);
    const currentNameHtml = currentPlayer ? formatPlayerName(currentPlayer) : 'Player';
    const currentNamePlain = currentPlayer ? currentPlayer.name : 'Player';
    const myTurn = state.currentUser && currentUid === state.currentUser.uid;
    const isReview = state.onlineTurnPhase === 'review';
    const turnNum = state.onlineCurrentTurnIndex + 1;
    const totalTurns = state.onlineTurnOrder.length;

    // ===== REVIEW PHASE: show the exact time first, then countdown =====
    if(isReview){
      const timeText = currentPlayer
        ? (currentPlayer.skipped ? 'SKIPPED' : (currentPlayer.time != null ? formatTime(currentPlayer.time) : '—'))
        : '—';
      const secs = state.onlineReviewSecondsLeft != null ? state.onlineReviewSecondsLeft : REVIEW_SECONDS;
      return `
        <div class="screen">
          <div class="round-wrap">
            <div class="round-progress">TURN ${turnNum} OF ${totalTurns}</div>
            <div style="font-size:18px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em;">${currentNameHtml} stopped at</div>
            <div class="timer-display revealed">${timeText}</div>
            <p class="helper-note" style="color:var(--amber); font-size:18px;">Next turn in ${secs}s</p>
            ${renderLiveTimesList()}
          </div>
        </div>`;
    }

    // ===== PLAY PHASE =====
    // Spectator view (not your turn)
    if(!myTurn){
      const isTiming = currentPlayer && currentPlayer.timing;
      return `
        <div class="screen">
          <div class="round-wrap">
            <div class="round-progress">TURN ${turnNum} OF ${totalTurns}</div>
            <div class="hand-icon">${isTiming ? '⏱' : '👆'}</div>
            <div class="player-name" style="font-size:32px; margin:0 0 8px;">${currentNameHtml}'s turn</div>
            ${isTiming
              ? `<div class="timer-display hidden-val">••:••</div>
                 <p class="helper-note">${currentNamePlain} is timing right now...</p>`
              : `<p class="helper-note">Waiting for ${currentNamePlain} to start the timer...</p>`
            }
            ${renderLiveTimesList()}
          </div>
        </div>`;
    }

    // Active player view (your turn)
    let timerHtml, btnLabel, btnClass = '';
    if(state.onlineRoundPhase === 'ready'){
      timerHtml = `<div class="timer-display hidden-val">--:--</div>`;
      btnLabel = 'TAP TO START';
    } else if(state.onlineRoundPhase === 'running'){
      timerHtml = `<div class="timer-display hidden-val">••:••</div>`;
      btnLabel = 'TAP TO STOP';
      btnClass = 'running';
    } else {
      timerHtml = `<div class="timer-display revealed">Submitted!</div>`;
      btnLabel = 'DONE';
    }
    const showCountdown = state.onlineRoundPhase === 'ready' && state.onlineTurnSecondsLeft !== null;
    return `
      <div class="screen">
        <div class="round-wrap">
          <div class="round-progress">YOUR TURN — ${turnNum} OF ${totalTurns}</div>
          ${showCountdown ? `<p class="helper-note" style="color:var(--amber);">Auto-skip in ${state.onlineTurnSecondsLeft}s</p>` : ''}
          ${timerHtml}
          <button class="big-btn ${btnClass}" ${state.onlineRoundPhase==='stopped'?'disabled':''} onclick="TI.onlineBigButtonTap()">${btnLabel}</button>
          ${state.onlineRoundPhase === 'ready' ? `<button class="btn ghost" style="max-width:280px;" onclick="TI.onlineSkipTurn()">Skip My Turn</button>` : ''}
          <p class="helper-note">Tap once to start, tap again to stop. Everyone can see when you start and stop.</p>
        </div>
      </div>`;
  }

  function renderOnlineWaiting(){
    const total = state.onlinePlayers.length;
    const done = state.onlinePlayers.filter(p => p.submitted).length;
    const rows = state.onlinePlayers.map(p => `
      <div class="result-row"><div class="rname">${formatPlayerName(p)}</div><div class="rtag" style="color:${p.submitted ? 'var(--green)' : 'var(--muted)'};">${p.submitted ? 'DONE' : 'WAITING'}</div></div>
    `).join('');
    return `
      <div class="screen">
        <div class="eyebrow">Waiting Room</div>
        <h1 style="font-size:clamp(26px,7vw,30px); margin-top:6px;">${done} / ${total} finished</h1>
        <div class="results-list">${rows}</div>
        <div class="spacer"></div>
        ${state.isHost ? `<button class="btn danger" ${done<total?'disabled':''} onclick="TI.startOnlineVoting()">Start Voting Phase</button>` : `<p class="helper-note">Waiting for the host to start the voting phase...</p>`}
      </div>`;
  }

  function renderOnlineVoting(){
    const myVote = state.onlineVotedFor;
    const rows = state.onlinePlayers.map(p => {
      if (p.uid === state.currentUser.uid) {
         return `<div class="result-row"><div class="rname">${formatPlayerName(p)} (You)</div><div class="rtime">${p.time != null ? formatTime(p.time) : '—'}</div></div>`;
      }
      return `
        <div class="result-row">
          <div><div class="rname">${formatPlayerName(p)}</div><div class="rtag" style="color:var(--muted); font-size: 12px;">Time: ${p.time != null ? formatTime(p.time) : '—'}</div></div>
          ${myVote ? (myVote === p.uid ? `<span class="rtag" style="color:var(--amber);">VOTED</span>` : '') : `<button class="chip-btn active" style="flex:none; padding:6px 12px; border-color:var(--amber); color:var(--amber); background:rgba(255,184,77,0.1);" onclick="TI.castOnlineVote('${p.uid}')">VOTE IMPOSTER</button>`}
        </div>`;
    }).join('');

    return `
      <div class="screen">
        <div class="eyebrow">Voting Phase</div>
        <h1 style="font-size:clamp(26px,7vw,30px); margin-top:6px;">Who is the Imposter?</h1>
        <p class="sub">Look at the times below and cast your vote.</p>
        <div class="results-list">${rows}</div>
        <div class="spacer"></div>
        ${myVote ? `<p class="helper-note" style="text-align:center;">Waiting for everyone to cast their votes...</p>` : ''}
      </div>`;
  }

  function renderOnlineResults(){
    const rows = state.onlinePlayers.map(p => {
      const isImp = p.uid === state.onlineImposterUid;
      const isSuspected = p.uid === state.onlineSuspectedUid;
      return `
        <div class="result-row ${isImp?'imposter-row':''} ${!isImp && isSuspected?'crew-row':''}">
          <div>
            <div class="rname">${formatPlayerName(p)}</div>
            ${isImp ? `<span class="rtag">REAL IMPOSTER</span>` : ''}
            ${isSuspected ? `<span class="rtag" style="color:var(--amber);">VOTED OUT</span>` : ''}
          </div>
          <div class="rtime">${p.time != null ? formatTime(p.time) : '—'}</div>
        </div>`;
    }).join('');

    const winnerHtml = state.onlineCrewWins 
      ? `<div class="winner-banner crew">THE CREW WINS!</div><p class="helper-note" style="text-align:center;">The majority caught the Imposter!</p>`
      : `<div class="winner-banner imposter">IMPOSTER WINS!</div><p class="helper-note" style="text-align:center;">The Crew voted for the wrong person.</p>`;

    return `
      <div class="screen">
        <div class="eyebrow">Debrief // Online Round</div>
        <h1 style="font-size:clamp(28px,7vw,34px); margin-top:6px;">Round Over</h1>
        ${winnerHtml}
        <div class="target-banner" style="margin-top:10px;"><div class="role-label">Target Time Was</div><div class="tval">${formatTime(state.onlineTargetMs)}</div></div>
        <div class="results-list">${rows}</div>
        <div class="spacer"></div>
        <div class="row-gap">
          ${state.isHost ? `<button class="btn solid" onclick="TI.playAgainOnline()">Play Again</button>` : ''}
          <button class="btn ghost" onclick="TI.exitOnlineToMenu()">Leave Room</button>
        </div>
      </div>`;
  }

  function render(){
    const app = document.getElementById('app');
    let html = '';
    switch(state.screen){
      case 'start': html = renderStart(); break;
      case 'setup': html = renderSetup(); break;
      case 'reveal': html = renderReveal(); break;
      case 'firstplayer': html = renderFirstPlayer(); break;
      case 'game': html = renderGame(); break;
      case 'results': html = renderResults(); break;
      case 'practice': html = renderPractice(); break;
      case 'onlineHome': html = renderOnlineHome(); break;
      case 'onlineCreate': html = renderOnlineCreate(); break;
      case 'onlineJoinPrivate': html = renderOnlineJoinPrivate(); break;
      case 'onlineLobby': html = renderOnlineLobby(); break;
      case 'onlineReveal': html = renderOnlineReveal(); break;
      case 'onlineRound': html = renderOnlineRound(); break;
      case 'onlineWaiting': html = renderOnlineWaiting(); break;
      case 'onlineVoting': html = renderOnlineVoting(); break;
      case 'onlineResults': html = renderOnlineResults(); break;
    }

    // Only play the fade-in animation when the screen actually changes.
    // This prevents the black flash / double-fade when Firebase auth re-renders the same screen on load.
    const screenChanged = state.lastScreen !== state.screen;
    state.lastScreen = state.screen;

    if(html.indexOf('class="screen') !== -1){
      if(screenChanged){
        html = html.replace('class="screen"', 'class="screen anim"');
      }
    }

    app.innerHTML = html;
    const chatBtn = document.getElementById('chatToggleBtn');
    if(chatBtn) chatBtn.style.display = state.roomCode ? 'flex' : 'none';
    const adminBtn = document.getElementById('adminToggleBtn');
    if(adminBtn) adminBtn.style.display = (state.currentUser && state.currentUser.isOwner) ? 'flex' : 'none';
    if(state.showAdmin) renderAdminPanelDOM();
  }

  window.TI = {
    goStart, toggleHelp, toggleAccounts, toggleAudio, goSetup, changePlayers, updateName, setMode, toggleClues,
    beginReveal, revealHandoffTap, revealCardTap, revealNext,
    goToGame, roundHandoffTap, bigButtonTap, nextPlayerTap, skipTurn,
    toggleReveal, nextRound,
    goPractice, practiceBigButtonTap, practiceRestart,
    signInWithGoogle, signOut, saveProfile,
    goOnlineHome, goOnlineCreate, updateCreateField, changeCreateMax, submitCreateRoom,
    joinPublicRoom, goOnlineJoinPrivate, updateJoinField, submitJoinPrivate,
    exitOnlineToMenu, startOnlineGame, toggleCloseRoomConfirm, confirmCloseRoom,
    toggleDeleteRoomConfirm, confirmDeleteRoom, kickPlayer,
    goToOnlineRound, onlineBigButtonTap, onlineSkipTurn, goToOnlineWaiting, startOnlineVoting, castOnlineVote, playAgainOnline,
    toggleChat, updateChatInput, sendChatMessage,
    toggleAdmin, updateAdminField, runAdminCommand
  };

  document.getElementById('versionTag').textContent = GAME_VERSION;

  // Force-refresh if the WebView is serving a stale cached copy.
  // version.json is tiny and fetched with cache disabled, so it's always fresh —
  // if it doesn't match the version baked into this loaded page, reload with a cache-buster.
  try {
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(r => r.json())
      .then(data => {
        if(data && data.version && data.version !== GAME_VERSION){
          const url = new URL(location.href);
          url.searchParams.set('v', Date.now());
          location.replace(url.toString());
        }
      })
      .catch(() => {});
  } catch(e){}

  loadSoundPref();
  const initBtn = document.getElementById('audioToggle');
  initBtn.textContent = state.soundEnabled ? '🔊' : '🔇';
  initBtn.classList.toggle('active', state.soundEnabled);

  // Avoid the load glitch: wait briefly for Firebase auth to settle before first paint.
  // If auth never fires (or Firebase is disabled), still show the UI after a short timeout.
  if(fbReady && !state.authSettled){
    setTimeout(() => {
      if(!state.authSettled){
        state.authSettled = true;
        render();
      }
    }, 400);
  } else {
    render();
  }
})();
</script>
</body>
</html>
