<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Timer Imposter - Free Pass & Play Party Game</title>
<meta name="description" content="Timer Imposter is a free pass-and-play party game. Everyone but one player secretly knows a target time — blind-tap a hidden stopwatch and catch the imposter. Play free, no signup, works offline.">
<meta name="keywords" content="timer imposter, timer imposter game, pass and play games, party games, stopwatch game, imposter game">
<meta property="og:title" content="Timer Imposter - Free Pass & Play Party Game">
<meta property="og:description" content="Everyone but one player knows a secret target time. Blind-tap a hidden stopwatch and catch the imposter. Free, no signup.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kobik8512-ctrl.github.io/Timer-imposter/">
<meta property="og:image" content="https://kobik8512-ctrl.github.io/Timer-imposter/icon-512.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0d0b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0d0b;
    --panel: #12160f0f, #131813;
    --panel-solid: #12160f;
    --line: #263028;
    --ink: #e8ede6;
    --muted: #7c8a7c;
    --green: #4dff9c;
    --green-dim: #2c6b48;
    --red: #ff5a5a;
    --amber: #ffb84d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background: radial-gradient(1200px 600px at 50% -10%, #10160f 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:'Barlow Condensed', sans-serif;
    display:flex;
    align-items:stretch;
    justify-content:center;
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
  }
  #app{
    width:100%;
    max-width:520px;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    min-height:100dvh;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    position:relative;
  }
  #app::before{
    content:"";
    position:fixed; inset:0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
    z-index:0;
  }
  .screen{
    position:relative;
    z-index:1;
    flex:1;
    display:flex;
    flex-direction:column;
    animation: fadein .35s ease both;
  }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important; transition-duration:.001s !important;}
  }

  .eyebrow{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--green);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow::before{
    content:"";
    width:6px; height:6px;
    background:var(--green);
    box-shadow:0 0 8px var(--green);
    border-radius:1px;
    flex:none;
  }

  h1{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    letter-spacing:.02em;
    text-transform:uppercase;
    margin: 10px 0 4px;
    line-height:.95;
  }
  .title-main{ font-size: clamp(44px, 13vw, 64px); }
  p.sub{ color:var(--muted); font-size:16px; line-height:1.4; margin:0 0 0; }

  .spacer{flex:1;}

  .btn{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    font-size:19px;
    border-radius:6px;
    border:2px solid var(--green);
    background:transparent;
    color:var(--green);
    padding:14px 20px;
    width:100%;
    cursor:pointer;
    transition: transform .12s ease, background .15s ease, color .15s ease;
    -webkit-user-select:none; user-select:none;
  }
  .btn:active{ transform:scale(.97); }
  .btn:focus-visible{ outline:2px solid var(--green); outline-offset:3px; }
  .btn.solid{ background:var(--green); color:#04140a; }
  .btn.ghost{ border-color:var(--line); color:var(--muted); }
  .btn.danger{ border-color:var(--red); color:var(--red); }
  .btn[disabled]{ opacity:.35; pointer-events:none; }

  .card{
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:12px;
  }

  /* Setup Stepper & Options */
  .stepper{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    margin: 12px 0;
  }
  .stepper button{
    width:48px; height:48px;
    border-radius:50%;
    border:2px solid var(--green);
    background:transparent;
    color:var(--green);
    font-size:24px;
    font-family:'Space Mono', monospace;
    cursor:pointer;
  }
  .stepper button:active{ background:rgba(77,255,156,.12); }
  .stepper button[disabled]{ opacity:.3; pointer-events:none; }
  .stepper .count{
    font-family:'Space Mono', monospace;
    font-size:44px;
    min-width:60px;
    text-align:center;
  }

  .names-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:8px;
    max-height: 180px;
    overflow-y: auto;
    padding-right:4px;
  }
  .input-field{
    background: rgba(0,0,0,0.4);
    border:1px solid var(--line);
    border-radius:6px;
    color:var(--ink);
    font-family:'Barlow Condensed', sans-serif;
    font-size:16px;
    padding:8px 12px;
    width:100%;
    outline:none;
  }
  .input-field:focus{ border-color:var(--green); }

  .mode-selector, .option-toggle{
    display:flex;
    gap:8px;
    margin-top:6px;
  }
  .chip-btn{
    flex:1;
    padding:8px;
    border:1px solid var(--line);
    border-radius:6px;
    background:transparent;
    color:var(--muted);
    font-family:'Space Mono', monospace;
    font-size:11px;
    text-transform:uppercase;
    cursor:pointer;
  }
  .chip-btn.active{
    border-color:var(--green);
    color:var(--green);
    background:rgba(77,255,156,0.08);
  }

  /* Handoff pass screen */
  .handoff-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:6px;
  }
  .player-num{
    font-family:'Space Mono', monospace;
    font-size:14px;
    color:var(--muted);
    letter-spacing:.2em;
    text-transform:uppercase;
  }
  .player-name{
    font-size: clamp(36px, 12vw, 60px);
    font-weight:700;
    text-transform:uppercase;
    line-height:1;
    margin: 4px 0 24px;
    color:var(--green);
  }
  .hand-icon{ font-size:44px; opacity:.85; margin-bottom:8px; }

  /* Redacted reveal card */
  .reveal-box{
    position:relative;
    border:1px solid var(--line);
    border-radius:10px;
    padding: 30px 20px;
    text-align:center;
    overflow:hidden;
    cursor:pointer;
    background: rgba(255,255,255,0.02);
    width:100%;
  }
  .reveal-box .bar{
    position:absolute; inset:0;
    background: repeating-linear-gradient(135deg, #1a1f1a 0px, #1a1f1a 10px, #14180f 10px, #14180f 20px);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Mono', monospace;
    letter-spacing:.2em;
    color:#5a6a5a;
    transition: transform .5s cubic-bezier(.7,0,.2,1), opacity .4s ease;
    z-index:2;
  }
  .reveal-box.open .bar{
    transform: translateX(105%);
    opacity:0;
  }
  .reveal-inner{ position:relative; z-index:1; }
  .role-label{
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:10px;
  }
  .target-time{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size: clamp(48px, 15vw, 72px);
    color:var(--green);
    text-shadow: 0 0 24px rgba(77,255,156,.35);
    letter-spacing:.02em;
  }
  .imposter-text{
    font-size: clamp(28px, 8vw, 38px);
    font-weight:700;
    text-transform:uppercase;
    color:var(--red);
    text-shadow: 0 0 18px rgba(255,90,90,.3);
    line-height:1.05;
  }
  .clue-badge{
    display:inline-block;
    margin-top:10px;
    padding:4px 10px;
    background:rgba(255,184,77,0.1);
    border:1px solid var(--amber);
    color:var(--amber);
    border-radius:4px;
    font-family:'Space Mono', monospace;
    font-size:12px;
  }
  .helper-note{
    margin-top:14px;
    font-size:14px;
    color:var(--muted);
    line-height:1.4;
  }

  /* Game round */
  .round-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 24px;
  }
  .timer-display{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size: clamp(56px, 17vw, 84px);
    color:var(--ink);
    letter-spacing:.02em;
  }
  .timer-display.hidden-val{
    color:#3a463c;
    animation: blink 1.1s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .timer-display.revealed{ color:var(--green); text-shadow:0 0 26px rgba(77,255,156,.35); }

  .big-btn{
    width: min(200px, 55vw);
    height: min(200px, 55vw);
    border-radius:50%;
    border:3px solid var(--green);
    background: radial-gradient(circle at 35% 30%, rgba(77,255,156,.18), transparent 70%);
    color:var(--green);
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    font-size:22px;
    cursor:pointer;
    transition: transform .12s ease, box-shadow .2s ease;
    box-shadow: 0 0 0 rgba(77,255,156,0);
  }
  .big-btn.running{
    border-color:var(--red);
    color:var(--red);
    background: radial-gradient(circle at 35% 30%, rgba(255,90,90,.18), transparent 70%);
    box-shadow: 0 0 40px rgba(255,90,90,.15);
  }
  .big-btn:active{ transform:scale(.95); }

  .round-progress{
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--muted);
    letter-spacing:.18em;
  }

  /* Results */
  .scoreboard{
    display:flex;
    justify-content:space-around;
    background:rgba(255,255,255,0.02);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px;
    margin-bottom:14px;
    font-family:'Space Mono', monospace;
    font-size:12px;
    text-align:center;
  }
  .score-val{ font-size:18px; font-weight:700; color:var(--green); }

  .results-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin: 12px 0;
  }
  .result-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 14px;
    background:rgba(255,255,255,0.02);
  }
  .result-row.imposter-row{
    border-color:var(--red);
    background:rgba(255,90,90,.06);
  }
  .result-row .rname{
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.04em;
    font-size:16px;
  }
  .result-row .rtag{
    font-family:'Space Mono', monospace;
    font-size:10px;
    color:var(--red);
    letter-spacing:.15em;
    display:block;
  }
  .result-row .rtime{
    font-family:'Space Mono', monospace;
    font-size:20px;
    font-weight:700;
  }
  .target-banner{
    text-align:center;
    padding: 12px;
    border:1px dashed var(--green);
    border-radius:8px;
    margin-bottom:12px;
  }
  .target-banner .tval{
    font-family:'Space Mono', monospace;
    font-size:30px;
    color:var(--green);
    font-weight:700;
  }

  /* Modal */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(10, 13, 11, 0.92);
    backdrop-filter: blur(6px);
    z-index:10;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    animation: fadein .25s ease both;
  }
  .modal-card{
    background: var(--panel-solid);
    border:1px solid var(--line);
    border-radius:12px;
    padding:24px;
    width:100%; max-width:460px;
    max-height:85vh; overflow-y:auto;
  }
  .modal-title{ font-size:28px; margin:6px 0 16px; }
  .help-step{ display:flex; gap:14px; margin-bottom:16px; }
  .help-num{
    font-family:'Space Mono', monospace; font-size:14px; font-weight:700;
    color:var(--green); background:rgba(77,255,156,0.1); border:1px solid var(--green-dim);
    width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none;
  }
  .help-body{ font-size:15px; color:var(--ink); line-height:1.45; }
  .help-body strong{ color:var(--green); }

  .audio-btn{
    position:fixed;
    top: max(14px, env(safe-area-inset-top));
    right:14px;
    z-index:5;
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    border-radius:50%;
    width:36px; height:36px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
  }
  .audio-btn.active{ border-color:var(--green); color:var(--green); }

  .row-gap > * + *{ margin-top:10px; }

  .corner-credit{
    position:fixed; bottom: max(10px, env(safe-area-inset-bottom)); left:14px;
    font-family:'Space Mono', monospace; font-size:12px; letter-spacing:.12em;
    text-transform:uppercase; color:#5c6b5e; z-index:5; pointer-events:none;
  }
  .corner-version{
    position:fixed; bottom: max(10px, env(safe-area-inset-bottom)); right:14px;
    font-family:'Space Mono', monospace; font-size:12px; letter-spacing:.12em;
    color:#5c6b5e; z-index:5; pointer-events:none;
  }

</style>
</head>
<body>
<div id="app"></div>
<button class="audio-btn active" id="audioToggle" onclick="TI.toggleAudio()">🔊</button>
<div class="corner-credit">made by kobi</div>
<div class="corner-version" id="versionTag"></div>

<script>
/*
  TIMER IMPOSTER — version log
  v1-v3 — core gameplay, pass-and-play, versioning
  v4 — added help modal
  v5 — added custom modes, player names, clues, voting, audio SFX, multi-round scores
  v6 — removed voting screen, direct flow to results
  v7 — restored PWA manifest/icon links in <head> (needed for GitHub Pages / APK install to keep working)
  v8 — added joke "offline paywall" prank screen (not a real charge, just a gag)
  v9 — swapped ₾ for $ in the paywall joke
  v10 — removed offline paywall joke (broke on the WebView app since it needs internet to load at all); fixed duplicate-name score bug (scores now tracked by player position, not name text); rewrote How to Play with a full concrete walkthrough
  v11 — added "Skip My Turn" button during rounds; sound on/off preference now persists between sessions; added "Sign in with Google" button on start screen (UI placeholder only — real accounts need a Firebase project to be set up before this can actually work)
  v12 — added SEO meta tags (title, description, Open Graph) for search visibility; added robots.txt and sitemap.xml
*/
const GAME_VERSION = "v12";
(function(){
  const state = {
    screen: 'start',
    showHelp: false,
    showAccounts: false,
    soundEnabled: true,
    numPlayers: 3,
    playerNames: ['Player 1', 'Player 2', 'Player 3'],
    mode: 'standard', // 'fast', 'standard', 'marathon'
    enableClues: true,
    imposterIndex: null,
    targetMs: null,
    imposterClue: '',
    revealIndex: 0,
    revealPhase: 'handoff',
    playerOrder: [],
    roundIndex: 0,
    roundPhase: 'handoff',
    roundStart: null,
    times: [],
    resultsRevealed: false,
    matchRound: 1,
    scores: [] // scores[playerIndex] = points — indexed by position, not name, so duplicate names don't collide
  };

  // ---- Audio Synthesizer (Web Audio API) ----
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let ctx = null;

  function playSFX(type){
    if(!state.soundEnabled) return;
    try {
      if(!ctx) ctx = new AudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      const now = ctx.currentTime;
      if(type === 'click'){
        osc.frequency.setValueAtTime(400, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
      } else if(type === 'start'){
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if(type === 'stop'){
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(440, now + 0.12);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
      } else if(type === 'reveal'){
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(300, now + 0.3);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      }
    } catch(e){}
  }

  function vibrate(ms){ if(navigator.vibrate){ try{ navigator.vibrate(ms); }catch(e){} } }

  function shuffledOrder(n){
    const arr = Array.from({length:n}, (_,i)=>i);
    for(let i=arr.length-1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  function pad2(n){ return n.toString().padStart(2,'0'); }
  function formatTime(ms){
    const totalCenti = Math.round(ms/10);
    const sec = Math.min(99, Math.floor(totalCenti/100));
    const centi = totalCenti % 100;
    return pad2(sec) + ':' + pad2(centi);
  }

  function generateTargetAndClue(){
    let minS = 1, maxS = 9;
    if(state.mode === 'fast'){ minS = 0.5; maxS = 3; }
    if(state.mode === 'marathon'){ minS = 10; maxS = 20; }

    const centi = Math.floor(Math.random() * (maxS * 100 - minS * 100 + 1)) + (minS * 100);
    state.targetMs = centi * 10;

    const totalSec = state.targetMs / 1000;
    const lower = Math.max(0, Math.floor(totalSec - (Math.random() * 1.5 + 0.5)));
    const upper = Math.ceil(totalSec + (Math.random() * 1.5 + 0.5));
    state.imposterClue = `Target is between ${lower}s and ${upper}s`;
  }

  function syncNamesCount(){
    while(state.playerNames.length < state.numPlayers){
      state.playerNames.push(`Player ${state.playerNames.length + 1}`);
    }
    while(state.playerNames.length > state.numPlayers){
      state.playerNames.pop();
    }
    syncScoresCount();
  }
  function syncScoresCount(){
    while(state.scores.length < state.numPlayers){
      state.scores.push(0);
    }
    while(state.scores.length > state.numPlayers){
      state.scores.pop();
    }
  }

  function resetGameState(keepPlayers){
    state.imposterIndex = null;
    state.targetMs = null;
    state.revealIndex = 0;
    state.revealPhase = 'handoff';
    state.playerOrder = [];
    state.roundIndex = 0;
    state.roundPhase = 'handoff';
    state.roundStart = null;
    state.times = [];
    state.resultsRevealed = false;
    state.showHelp = false;
    if(!keepPlayers){
      state.numPlayers = 3;
      state.playerNames = ['Player 1', 'Player 2', 'Player 3'];
      state.matchRound = 1;
      state.scores = [];
    }
  }

  // ---- Actions ----
  function goStart(){ playSFX('click'); state.screen='start'; render(); }
  function toggleHelp(show){ playSFX('click'); state.showHelp = show; render(); }
  function toggleAccounts(show){ playSFX('click'); state.showAccounts = show; render(); }
  function loadSoundPref(){
    try {
      const saved = localStorage.getItem('ti_sound');
      if(saved !== null) state.soundEnabled = saved === '1';
    } catch(e){}
  }
  function saveSoundPref(){
    try { localStorage.setItem('ti_sound', state.soundEnabled ? '1' : '0'); } catch(e){}
  }
  function toggleAudio(){
    state.soundEnabled = !state.soundEnabled;
    saveSoundPref();
    const btn = document.getElementById('audioToggle');
    btn.textContent = state.soundEnabled ? '🔊' : '🔇';
    btn.classList.toggle('active', state.soundEnabled);
  }
  function goSetup(){ playSFX('click'); resetGameState(true); state.screen='setup'; render(); }
  function changePlayers(d){
    playSFX('click');
    state.numPlayers = Math.max(3, Math.min(10, state.numPlayers + d));
    syncNamesCount();
    render();
  }
  function updateName(idx, val){
    state.playerNames[idx] = val || `Player ${idx+1}`;
  }
  function setMode(m){ playSFX('click'); state.mode = m; render(); }
  function toggleClues(){ playSFX('click'); state.enableClues = !state.enableClues; render(); }

  function beginReveal(){
    playSFX('click');
    state.imposterIndex = Math.floor(Math.random() * state.numPlayers);
    generateTargetAndClue();
    state.revealIndex = 0;
    state.revealPhase = 'handoff';
    state.screen = 'reveal';
    syncScoresCount();
    render();
  }
  function revealHandoffTap(){ playSFX('click'); state.revealPhase = 'card'; render(); }
  function revealCardTap(){
    playSFX('click');
    vibrate(15);
    state.revealPhase = 'shown';
    render();
  }
  function revealNext(){
    playSFX('click');
    if(state.revealIndex < state.numPlayers - 1){
      state.revealIndex++;
      state.revealPhase = 'handoff';
      render();
    } else {
      state.playerOrder = shuffledOrder(state.numPlayers);
      state.screen = 'firstplayer';
      render();
    }
  }
  function goToGame(){
    playSFX('click');
    state.screen = 'game';
    state.roundIndex = 0;
    state.roundPhase = 'handoff';
    render();
  }
  function roundHandoffTap(){ playSFX('click'); state.roundPhase = 'ready'; render(); }
  function bigButtonTap(){
    if(state.roundPhase === 'ready'){
      playSFX('start');
      vibrate(20);
      state.roundStart = performance.now();
      state.roundPhase = 'running';
      render();
    } else if(state.roundPhase === 'running'){
      playSFX('stop');
      vibrate([20,30,20]);
      const elapsed = performance.now() - state.roundStart;
      const playerIdx = state.playerOrder[state.roundIndex];
      state.times[playerIdx] = elapsed;
      state.roundPhase = 'stopped';
      render();
    }
  }
  function nextPlayerTap(){
    playSFX('click');
    if(state.roundIndex < state.numPlayers - 1){
      state.roundIndex++;
      state.roundPhase = 'handoff';
      render();
    } else {
      state.screen = 'results';
      render();
    }
  }
  function skipTurn(){
    playSFX('click');
    vibrate(10);
    const playerIdx = state.playerOrder[state.roundIndex];
    state.times[playerIdx] = 'SKIP';
    if(state.roundIndex < state.numPlayers - 1){
      state.roundIndex++;
      state.roundPhase = 'handoff';
    } else {
      state.screen = 'results';
    }
    render();
  }
  function toggleReveal(){
    playSFX('reveal');
    state.resultsRevealed = true;

    // Calculate closest player to target among regular players
    let bestDiff = Infinity;
    let winnerIdx = null;

    state.playerNames.forEach((_, i) => {
      if(i !== state.imposterIndex && state.times[i] !== undefined && state.times[i] !== 'SKIP'){
        const diff = Math.abs(state.times[i] - state.targetMs);
        if(diff < bestDiff){
          bestDiff = diff;
          winnerIdx = i;
        }
      }
    });

    if(winnerIdx !== null){
      state.scores[winnerIdx] = (state.scores[winnerIdx] || 0) + 1;
    }

    render();
  }
  function nextRound(){
    playSFX('click');
    state.matchRound++;
    resetGameState(true);
    beginReveal();
  }

  // ---- Renderers ----
  function renderHelpModal(){
    if(!state.showHelp) return '';
    return `
      <div class="modal-overlay" onclick="TI.toggleHelp(false)">
        <div class="modal-card" onclick="event.stopPropagation()">
          <div class="eyebrow">Briefing // Manual</div>
          <h2 class="modal-title">HOW TO PLAY</h2>
          <p class="help-body" style="margin-bottom:18px;">One phone gets passed around the group. Here's exactly what happens, step by step, using a 3-player example:</p>

          <div class="help-step">
            <div class="help-num">1</div>
            <div class="help-body"><strong>Set up the game.</strong> Enter how many people are playing and type in everyone's name. Pick a mode — Fast, Standard, or Marathon — which decides how long the secret time will roughly be.</div>
          </div>

          <div class="help-step">
            <div class="help-num">2</div>
            <div class="help-body"><strong>Secret briefing (one player at a time).</strong> The phone gets handed to Player 1 privately. They tap to reveal their card. Almost everyone sees the exact <strong>target time</strong> — for example <strong>04:50</strong>, meaning 4 seconds and 50 hundredths. One random player instead becomes the <strong>Imposter</strong> and does NOT see the target — they might get a vague clue instead, like "somewhere between 3s and 7s," if clues are turned on. Pass the phone to the next player and repeat until everyone has secretly seen their card. No one should see anyone else's screen.</div>
          </div>

          <div class="help-step">
            <div class="help-num">3</div>
            <div class="help-body"><strong>The blind stopwatch (one player at a time, in random order).</strong> Each player gets the phone for their turn. Tap the button once to <strong>start</strong> a hidden timer — you can't see any numbers while it's counting. Tap it again to <strong>stop</strong> whenever you think the exact target time has passed. If you knew the real target, try to land as close to it as possible. If you're the Imposter, you're just guessing blind — try not to guess too far off, or everyone will suspect you!</div>
          </div>

          <div class="help-step">
            <div class="help-num">4</div>
            <div class="help-body"><strong>Compare times together.</strong> Once everyone's had their turn, look at the results screen as a group. All the final times are shown side by side. Talk it out — whoever's time looks the most "off" from the others might be the Imposter.</div>
          </div>

          <div class="help-step">
            <div class="help-num">5</div>
            <div class="help-body"><strong>Reveal &amp; score.</strong> Tap "Reveal Imposter" to see who it really was and what the real target time was. Whoever (besides the Imposter) landed closest to the target earns a point. Scores carry over if you keep playing more rounds.</div>
          </div>

          <div class="help-step">
            <div class="help-num">6</div>
            <div class="help-body"><strong>Play again.</strong> Tap "Play Next Round" for a new secret time and a new random Imposter, or "Main Menu" to change the player list or settings.</div>
          </div>

          <button class="btn solid" style="margin-top:20px;" onclick="TI.toggleHelp(false)">Got It</button>
        </div>
      </div>`;
  }

  function renderAccountsModal(){
    if(!state.showAccounts) return '';
    return `
      <div class="modal-overlay" onclick="TI.toggleAccounts(false)">
        <div class="modal-card" onclick="event.stopPropagation()">
          <div class="eyebrow">Coming Soon</div>
          <h2 class="modal-title">ONLINE ACCOUNTS</h2>
          <p class="help-body">Sign-in and online multiplayer are in development! For now, Timer Imposter is fully offline and works great as pass-and-play — no account needed.</p>
          <button class="btn solid" style="margin-top:16px;" onclick="TI.toggleAccounts(false)">Got It</button>
        </div>
      </div>`;
  }

  function renderStart(){
    return `
      <div class="screen" style="justify-content:center; align-items:flex-start;">
        <div class="eyebrow">Classified Op // Pass &amp; Play</div>
        <h1 class="title-main">TIMER<br>IMPOSTER</h1>
        <p class="sub">One phone. Everyone but one player memorizes a secret target time.<br>Blind-tap a hidden stopwatch and catch the imposter!</p>
        <div class="spacer"></div>
        <div class="row-gap" style="width:100%;">
          <button class="btn solid" onclick="TI.goSetup()">Start Game</button>
          <button class="btn ghost" onclick="TI.toggleHelp(true)">How to Play</button>
          <button class="btn ghost" onclick="TI.toggleAccounts(true)">🔐 Sign in with Google</button>
        </div>
      </div>
      ${renderHelpModal()}
      ${renderAccountsModal()}`;
  }

  function renderSetup(){
    syncNamesCount();
    const nameInputs = state.playerNames.map((n, i) => `
      <input class="input-field" type="text" value="${n}" placeholder="Player ${i+1}" onchange="TI.updateName(${i}, this.value)" />
    `).join('');

    return `
      <div class="screen">
        <div class="eyebrow">Setup // Configuration</div>
        <h1 style="font-size:clamp(26px,7vw,32px); margin-top:6px;">Match Setup</h1>
        
        <div class="card">
          <div class="role-label">Squad Size (${state.numPlayers})</div>
          <div class="stepper">
            <button ${state.numPlayers<=3?'disabled':''} onclick="TI.changePlayers(-1)">–</button>
            <div class="count">${state.numPlayers}</div>
            <button ${state.numPlayers>=10?'disabled':''} onclick="TI.changePlayers(1)">+</button>
          </div>
          <div class="role-label" style="margin-top:10px;">Player Names</div>
          <div class="names-grid">${nameInputs}</div>
        </div>

        <div class="card">
          <div class="role-label">Game Mode</div>
          <div class="mode-selector">
            <button class="chip-btn ${state.mode==='fast'?'active':''}" onclick="TI.setMode('fast')">⚡ Fast (0.5-3s)</button>
            <button class="chip-btn ${state.mode==='standard'?'active':''}" onclick="TI.setMode('standard')">🎯 Standard (1-9s)</button>
            <button class="chip-btn ${state.mode==='marathon'?'active':''}" onclick="TI.setMode('marathon')">⏱ Marathon (10-20s)</button>
          </div>
          <div class="role-label" style="margin-top:12px;">Imposter Clue Hint</div>
          <div class="option-toggle">
            <button class="chip-btn ${state.enableClues?'active':''}" onclick="TI.toggleClues()">${state.enableClues ? 'ON (Gives range hint)' : 'OFF (Pure Blind)'}</button>
          </div>
        </div>

        <div class="spacer"></div>
        <button class="btn solid" onclick="TI.beginReveal()">Begin Briefing</button>
      </div>`;
  }

  function renderReveal(){
    const pName = state.playerNames[state.revealIndex];
    const isImposter = state.revealIndex === state.imposterIndex;

    if(state.revealPhase === 'handoff'){
      return `
        <div class="screen">
          <div class="handoff-wrap">
            <div class="hand-icon">👆</div>
            <div class="player-num">Hand the phone to</div>
            <div class="player-name">${pName}</div>
            <button class="btn solid" style="max-width:280px;" onclick="TI.revealHandoffTap()">I'm ${pName} — Continue</button>
          </div>
        </div>`;
    }

    if(state.revealPhase === 'card'){
      return `
        <div class="screen">
          <div class="handoff-wrap">
            <div class="eyebrow">${pName} // Eyes Only</div>
            <div class="reveal-box" onclick="TI.revealCardTap()">
              <div class="bar">TAP TO DECLASSIFY</div>
              <div class="reveal-inner">
                ${isImposter
                  ? `<div class="role-label">Role</div><div class="imposter-text">You are<br>the Imposter</div>`
                  : `<div class="role-label">Target Time</div><div class="target-time">${formatTime(state.targetMs)}</div>`
                }
              </div>
            </div>
            <p class="helper-note">Make sure no one else can see the screen before you tap.</p>
          </div>
        </div>`;
    }

    const isLast = state.revealIndex === state.numPlayers - 1;
    return `
      <div class="screen">
        <div class="handoff-wrap">
          <div class="eyebrow">${pName} // Eyes Only</div>
          <div class="reveal-box open">
            <div class="bar">TAP TO DECLASSIFY</div>
            <div class="reveal-inner">
              ${isImposter
                ? `<div class="role-label">Role</div><div class="imposter-text">You are<br>the Imposter</div>
                   ${state.enableClues ? `<div class="clue-badge">💡 Clue: ${state.imposterClue}</div>` : ''}
                   <p class="helper-note">Blend in! Guess your timing and don't let anyone catch you.</p>`
                : `<div class="role-label">Target Time</div><div class="target-time">${formatTime(state.targetMs)}</div><p class="helper-note">Memorize it. Try to land as close to this exact time as possible.</p>`
              }
            </div>
          </div>
          <div style="width:100%; margin-top:22px;">
            <button class="btn solid" onclick="TI.revealNext()">${isLast ? 'Everyone Ready — Start Game' : 'Next Player'}</button>
          </div>
        </div>
      </div>`;
  }

  function renderFirstPlayer(){
    const firstIdx = state.playerOrder[0];
    const firstName = state.playerNames[firstIdx];
    return `
      <div class="screen">
        <div class="handoff-wrap">
          <div class="eyebrow">Round Order Locked</div>
          <div class="hand-icon">🎲</div>
          <div class="player-num">Going first</div>
          <div class="player-name">${firstName}</div>
          <p class="helper-note">Turn order is randomized — everyone plays exactly once.</p>
          <button class="btn solid" style="max-width:280px; margin-top:14px;" onclick="TI.goToGame()">Start Round</button>
        </div>
      </div>`;
  }

  function renderGame(){
    const playerIdx = state.playerOrder[state.roundIndex];
    const pName = state.playerNames[playerIdx];
    const roundNum = state.roundIndex + 1;

    if(state.roundPhase === 'handoff'){
      return `
        <div class="screen">
          <div class="handoff-wrap">
            <div class="round-progress">TURN ${roundNum} OF ${state.numPlayers}</div>
            <div class="hand-icon">👆</div>
            <div class="player-num">Hand the phone to</div>
            <div class="player-name">${pName}</div>
            <button class="btn solid" style="max-width:280px;" onclick="TI.roundHandoffTap()">I'm ${pName} — Continue</button>
            <button class="btn ghost" style="max-width:280px; margin-top:10px;" onclick="TI.skipTurn()">Skip My Turn</button>
          </div>
        </div>`;
    }

    let timerHtml, btnLabel, btnClass = '';
    if(state.roundPhase === 'ready'){
      timerHtml = `<div class="timer-display hidden-val">--:--</div>`;
      btnLabel = 'TAP TO START';
    } else if(state.roundPhase === 'running'){
      timerHtml = `<div class="timer-display hidden-val">••:••</div>`;
      btnLabel = 'TAP TO STOP';
      btnClass = 'running';
    } else {
      timerHtml = `<div class="timer-display revealed">${formatTime(state.times[playerIdx])}</div>`;
      btnLabel = 'STOPPED';
    }

    const showNext = state.roundPhase === 'stopped';
    const isLast = state.roundIndex === state.numPlayers - 1;

    return `
      <div class="screen">
        <div class="round-wrap">
          <div class="round-progress">TURN ${roundNum} OF ${state.numPlayers} — ${pName}</div>
          ${timerHtml}
          <button class="big-btn ${btnClass}" ${state.roundPhase==='stopped'?'disabled':''} onclick="TI.bigButtonTap()">${btnLabel}</button>
          ${showNext ? `<button class="btn solid" style="max-width:280px;" onclick="TI.nextPlayerTap()">${isLast ? 'View Results' : 'Next Player'}</button>` : `<p class="helper-note">Tap once to start, tap again to stop. The clock is hidden while running.</p>`}
        </div>
      </div>`;
  }

  function renderResults(){
    let rows = '';
    for(let i=0; i<state.numPlayers; i++){
      const isImp = state.resultsRevealed && i === state.imposterIndex;
      const skipped = state.times[i] === 'SKIP';
      rows += `
        <div class="result-row ${isImp?'imposter-row':''}">
          <div>
            <div class="rname">${state.playerNames[i]}</div>
            ${isImp ? `<span class="rtag">IMPOSTER</span>` : ''}
          </div>
          <div class="rtime" style="${skipped ? 'font-size:15px; color:var(--muted);' : ''}">${skipped ? 'SKIPPED' : formatTime(state.times[i])}</div>
        </div>`;
    }

    const scoresList = state.playerNames.map((n, i) => `
      <div>
        <div style="color:var(--muted);">${n}</div>
        <div class="score-val">${state.scores[i]||0} pts</div>
      </div>
    `).join('');

    return `
      <div class="screen">
        <div class="eyebrow">Match Debrief // Round ${state.matchRound}</div>
        <h1 style="font-size:clamp(28px,7vw,34px); margin-top:6px;">Results</h1>
        
        <div class="scoreboard">${scoresList}</div>

        ${state.resultsRevealed ? `
          <div class="target-banner">
            <div class="role-label">Target Time Was</div>
            <div class="tval">${formatTime(state.targetMs)}</div>
          </div>
        ` : `<p class="sub">Review the recorded times with everyone and uncover who was guessing blind!</p>`}

        <div class="results-list">${rows}</div>
        <div class="spacer"></div>
        <div class="row-gap">
          ${!state.resultsRevealed ? `<button class="btn danger" onclick="TI.toggleReveal()">Reveal Imposter &amp; Score</button>` : ''}
          ${state.resultsRevealed ? `<button class="btn solid" onclick="TI.nextRound()">Play Next Round</button>` : ''}
          <button class="btn ghost" onclick="TI.goStart()">Main Menu</button>
        </div>
      </div>`;
  }

  function render(){
    const app = document.getElementById('app');
    let html = '';
    switch(state.screen){
      case 'start': html = renderStart(); break;
      case 'setup': html = renderSetup(); break;
      case 'reveal': html = renderReveal(); break;
      case 'firstplayer': html = renderFirstPlayer(); break;
      case 'game': html = renderGame(); break;
      case 'results': html = renderResults(); break;
    }
    app.innerHTML = html;
  }

  window.TI = {
    goStart, toggleHelp, toggleAccounts, toggleAudio, goSetup, changePlayers, updateName, setMode, toggleClues,
    beginReveal, revealHandoffTap, revealCardTap, revealNext,
    goToGame, roundHandoffTap, bigButtonTap, nextPlayerTap, skipTurn,
    toggleReveal, nextRound
  };

  document.getElementById('versionTag').textContent = GAME_VERSION;
  loadSoundPref();
  const initBtn = document.getElementById('audioToggle');
  initBtn.textContent = state.soundEnabled ? '🔊' : '🔇';
  initBtn.classList.toggle('active', state.soundEnabled);
  render();
})();

</script>
</body>
</html>
